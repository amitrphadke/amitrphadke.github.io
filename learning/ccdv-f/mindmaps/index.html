API errors](https://platform.claude.com/docs/en/api/errors)\n  - Key facts\n    - 400 invalid\\_request\\_error · 401 authentication\\_error · 402 billing\\_error · 403 permission\\_error · 404 not\\_found\\_error · 409 conflict\\_error · 413 request\\_too\\_large · 429 rate\\_limit\\_error · 500 api\\_error · 504 timeout\\_error · 529 overloaded\\_error.\n    - Error body: {type:'error', error:{type, message}, request\\_id:'req\\_…'}. Header request-id; Python message.\\_request\\_id.\n    - Request-size limits: Messages 32 MB, Token Counting 32 MB, Batches 256 MB, Files 500 MB.\n    - Non-streaming requests can time out around 10 minutes — stream or use Batches for long jobs; don't set huge max\\_tokens without streaming.\n    - SDKs retry transient errors (connection, 429, 5xx) with backoff, 2 retries by default, honouring retry-after.\n    - SSE error events can arrive after a 200 response.\n  - ⚠ Exam traps\n    - 529 overloaded\\_error is Anthropic-side; 429 rate\\_limit\\_error is your quota.\n    - 413: Messages cap is 32 MB, Batch 256 MB.\n    - A 400 can also mean an organisation spend limit was hit, not only malformed input.\n- [Rate limits](https://platform.claude.com/docs/en/api/rate-limits)\n  - Key facts\n    - Usage tiers by monthly spend cap: Start $500, Build $1,000, Scale $200,000, Custom; new orgs may start in an Evaluation tier.\n    - Three limits per model per organisation: requests/min (RPM), input tokens/min (ITPM), output tokens/min (OTPM). Limits are per model — hitting Sonnet's limit doesn't block Opus.\n    - Cache-aware ITPM: input\\_tokens + cache\\_creation\\_input\\_tokens count; cache\\_read\\_input\\_tokens do NOT (except Haiku 3.5). At 80% cache hit, 2M ITPM ≈ 10M effective tokens/min.\n    - Token-bucket enforcement with continuous replenishment — bursts get 429 even under the per-minute number. max\\_tokens does not count toward OTPM.\n    - 429 returns retry-after (seconds). A spend-cap 429 has details.error\\_code 'enforced\\_spend\\_limit\\_reached', no retry-after, and resets on the 1st at 00:00 UTC.\n    - Headers: anthropic-ratelimit-{requests,input-tokens,output-tokens}-{limit,remaining,reset}; retry-after.\n    - Batches: 1,000 RPM shared across models; 200,000 requests in the processing queue; 100,000 requests per batch.\n  - ⚠ Exam traps\n    - Cache reads are free against ITPM — caching raises effective throughput, not just cost.\n    - A spend-limit 429 has no retry-after and won't clear until next month.\n    - Limits are per model per org/workspace.\n- [Tool use overview](https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview)\n  - Key facts\n    - A tool = name, description, input\\_schema (JSON Schema object with properties and required).\n    - tool\\_choice: {type:'auto'} default — Claude decides; {type:'any'} — must call some tool; {type:'tool', name} — must call that tool; {type:'none'} — no tools. disable\\_parallel\\_tool\\_use: true inside tool\\_choice limits Claude to one call per turn; parallel calls are on by default and appear as several tool\\_use blocks in one response.\n    - When Claude calls a tool: stop\\_reason 'tool\\_use', block {type:'tool\\_use', id, name, input}. You reply in a USER message with {type:'tool\\_result', tool\\_use\\_id, content, is\\_error?}.\n    - Client tools run in your code (custom tools plus Anthropic-defined computer use, text editor, bash, memory). Server tools run on Anthropic's side (web search, web fetch, code execution, MCP connector, tool search) — results come back directly; you do not send tool\\_result for them.\n    - strict: true on a custom tool guarantees the call's arguments match the schema exactly (no hallucinated parameters).\n    - Tool use injects an automatic system prompt of ~286–800 tokens depending on model and tool\\_choice (Opus 5 286/406; Sonnet 5 354/474; Haiku 4.5 496/588).\n    - Billing: tools, tool\\_use and tool\\_result blocks are input tokens; client tools have no extra charge; web search / code execution have per-use charges.\n    - Claude won't reliably invent missing required parameters — ask or make them optional; steer eagerness in the system prompt.\n  - ⚠ Exam traps\n    - Server tools (web search, code execution) need no tool\\_result from you; client tools do.\n    - any = some tool; tool = a named tool; none = disabled; auto = default.\n    - disable\\_parallel\\_tool\\_use lives inside tool\\_choice, not at the top level.\n- [Define tools and handle tool calls](https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools)\n  - Key facts\n    - name must match ^\\[a-zA-Z0-9\\_-\\]{1,64}$; description and input\\_schema are required; optional: input\\_examples, cache\\_control, strict, defer\\_loading, allowed\\_callers.\n    - The description is the single most important factor — 3–4+ sentences: what it does, when to use it, what each parameter means, what it returns. Prefer fewer, more capable tools; namespace names (github\\_list\\_prs).\n    - tool\\_choice any/tool are NOT supported with manual extended thinking, nor on Fable/Mythos 5.1 — use auto + strict:true. With any/tool Claude emits no text before the tool\\_use block. Changing tool\\_choice invalidates cached message blocks (tools/system cache stays).\n    - tool\\_result content may be a string or a list of text/image/document/search\\_result blocks; empty content is allowed; is\\_error defaults to false.\n    - tool\\_result blocks must immediately follow the tool\\_use turn and must come FIRST in the user content array (text after them). Every tool\\_use id needs a matching tool\\_result or the API errors: 'tool\\_use ids were found without tool\\_result blocks'.\n    - Parallel calls: return all results in one user message, one block per call.\n    - Write instructive error messages ('Rate limit exceeded. Retry after 60 seconds.'); Claude typically retries 2–3 times on invalid-parameter errors.\n    - Keep untrusted tool output inside tool\\_result blocks (never in system or plain text) to limit prompt injection.\n  - ⚠ Exam traps\n    - tool\\_result goes in a user message and must precede any text in that message.\n    - is\\_error:true tells Claude the execution failed; it does not end the conversation.\n    - Forced tool use (any/tool) is incompatible with manual extended thinking.\n- [Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)\n  - Key facts\n    - Mark a breakpoint with cache\\_control: {type:'ephemeral'}; optional ttl '5m' (default) or '1h'. Up to 4 breakpoints per request.\n    - Pricing: 5-min write 1.25× base input; 1-hour write 2×; read 0.1× (0.025× on Fable/Mythos 5.1).\n    - Minimum cacheable prefix by model: 512 tokens (Fable 5.1, Opus 5, Fable 5); 1,024 (Opus 4.8, Sonnet 5, Sonnet 4.6, Sonnet 4.5); 2,048 (Opus 4.7, Haiku 3.5); 4,096 (Opus 4.6, Opus 4.5, Haiku 4.5). Shorter prefixes are processed but silently not cached.\n    - Prefix order: tools → system → messages. The system looks ~20 blocks back from each breakpoint for an earlier cache hit.\n    - usage: cache\\_creation\\_input\\_tokens, cache\\_read\\_input\\_tokens, input\\_tokens (tokens after the last breakpoint); total input = the sum.\n    - Invalidation: changing tool definitions invalidates everything; toggling web search/citations invalidates system+messages; changing tool\\_choice or adding/removing images invalidates the messages cache; thinking config changes usually invalidate; changing top-level effort invalidates the message cache.\n    - Cannot cache thinking blocks directly, citation sub-blocks or empty text blocks; cached tokens still count toward the context window.\n    - Place the breakpoint on the last block identical across requests; never on content with timestamps or per-request data. For chat, a moving breakpoint on the newest message caches history incrementally.\n  - ⚠ Exam traps\n    - Reads are 10% of base price; writes cost MORE than base — caching only pays with reuse.\n    - Order is tools → system → messages: a changed tool definition busts every downstream cache.\n    - A 1,000-token system prompt on Haiku 4.5 or Opus 4.6 (4,096 minimum) will silently not be cached.\n- [Message Batches API](https://platform.claude.com/docs/en/build-with-claude/batch-processing)\n  - Key facts\n    - 50% off standard prices on input and output; stacks with prompt caching.\n    - Limits: 100,000 requests or 256 MB per batch. Most batches finish within 1 hour; hard limit 24 hours, after which unfinished requests are 'expired' (not billed). Results retrievable for 29 days.\n    - Each request: custom\\_id (1–64 chars, unique) + params (normal Messages params). processing\\_status: in\\_progress → ended (or canceling → ended). Per-request result.type: succeeded, errored, canceled, expired — only succeeded is billed.\n    - Results are NOT returned in input order — match on custom\\_id; delivered as a .jsonl stream.\n    - Not supported: stream:true, fast mode. Supported: vision, tool use incl. server tools, system prompts, multi-turn, extended thinking, caching, all active models.\n    - Endpoints: POST /v1/messages/batches; GET …/{id}; GET …; POST …/{id}/cancel; GET …/{id}/results; DELETE …/{id}. Validation errors surface asynchronously in results.\n  - ⚠ Exam traps\n    - Discount is 50% on input AND output, and combines with caching.\n    - 'Guaranteed within 24 hours' is wrong — requests may expire at 24 h; typical is under an hour.\n    - Results are unordered; custom\\_id is the only reliable join key.\n\n## ❓ Self-check\n\n- Claude returns two tool\\_use blocks in one response. How do you reply?\n  - → One user message with two tool\\_result blocks, each matching a tool\\_use\\_id.\n- Your cache never hits. Most likely cause?\n  - → Content before the breakpoint changes each call, or the prefix is under the minimum cacheable length (~1,024 tokens).\n- Cheapest way to classify 50,000 support tickets overnight?\n  - → Message Batches API with a small model (Haiku), a cached system prompt, and low max\\_tokens.\n- What must be true of a tool description?\n  - → Detailed: what it does, when to use it, what each parameter means, what it returns — it drives tool selection more than the prompt.\n- How do you guarantee a response follows a JSON schema using tools?\n  - → Define one tool with that input\\_schema and set tool\\_choice={type:'tool', name:...}; read the tool\\_use input as your structured output.\n- A tool call fails with a stack trace. What do you send back?\n  - → A tool\\_result with is\\_error:true and a short error message so Claude can retry or explain.\n- Order of the cacheable prefix?\n  - → tools → system → messages; a breakpoint caches everything up to and including its block.\n- Cache read vs write pricing?\n  - → Write ≈ 1.25× base input (2× for 1-hour TTL); read ≈ 0.1× base input.\n- What does retry-after on a 429 mean?\n  - → Wait at least that many seconds before retrying; the SDK honours it automatically.\n- Batch results arrive out of order. How do you match them?\n  - → By custom\\_id you set on each request.\n- Which errors does the SDK retry by default?\n  - → 408, 409, 429, 5xx and connection errors — 2 retries with backoff; 400/401 are not retried.\n\n## ⚠ Traps to drill\n\n- Who runs a client-side tool?\n  - → Your code. Claude only returns a tool\\_use block with name and input.\n- Which role carries tool\\_result blocks?\n  - → user. One message, one tool\\_result per tool\\_use, ids must match.\n- Order of content in the cached prefix?\n  - → tools → system → messages. Change anything before the breakpoint and the cache is invalidated.\n- Does caching cut output tokens?\n  - → No — only input cost and time-to-first-token. Output is priced the same.\n- Batch API for a chatbot?\n  - → Never — asynchronous, up to 24 h. Batch = bulk, offline, 50% cheaper.\n- Minimum cacheable prefix length?\n  - → Model-dependent: 512 (Opus 5) · 1,024 (Sonnet 5/4.5) · 2,048 (Opus 4.7) · 4,096 (Haiku 4.5, Opus 4.5/4.6); shorter is silently not cached.\n- tool\\_choice value that forces one specific tool?\n  - → {type:'tool', name:'...'}; 'any' forces some tool; 'auto' is default; 'none' disables.\n- 429 vs 529?\n  - → 429 rate limit (your volume, honour retry-after); 529 overloaded (Anthropic side, back off with jitter).\n\n## 🗒 Cheat sheet\n\n- Tool loop: tools + messages → stop\\_reason tool\\_use → run it yourself → user msg with tool\\_result(tool\\_use\\_id, content, is\\_error?) → repeat until end\\_turn\n- tool\\_choice: auto (default) · any (must use some) · tool:{name} (must use that) · none; disable\\_parallel\\_tool\\_use for one-at-a-time\n- Parallel calls: several tool\\_use blocks → all results in ONE user message\n- Cache: cache\\_control ephemeral on a block; prefix = tools→system→messages up to it; min 512–4,096 tokens by model (Sonnet 5 = 1,024, Haiku 4.5 = 4,096); TTL 5 min (refreshes) or 1 h; write 1.25×/2×, read 0.1×; ≤4 breakpoints; reads free vs ITPM\n- Batches: custom\\_id per request, up to 100k reqs, ≤24 h, 50% off, results 29 days, join on custom\\_id, types succeeded/errored/canceled/expired\n- Errors: 400 yours · 401 key · 413 too large · 429 rate limit (retry-after) · 500 api · 529 overloaded; SDK retries 408/409/429/5xx ×2\n- Rate limits per org per model: RPM, ITPM, OTPM; tiers grow with spend\n\n## ☑ Chapter checklist\n\n- Can draw the tool-use loop (request → tool\\_use → run tool → tool\\_result → final answer) from memory\n- Know what tool\\_choice auto / any / tool / none do\n- Cache hit visible in usage: cache\\_read\\_input\\_tokens > 0\n- Batch job submitted, polled, results parsed by custom\\_id\n- Retry/backoff wrapper handles 429 and 529\n- notes/tools-caching-batch.md written\n\n","ch3":"# Chapter 3 — Model selection, cost optimisation, prompt and context engineering\n\n## 🎯 Goal\n\n- Pick the right model and the cheapest configuration for a workload, and write prompts the Anthropic way. This chapter is ~28% of the exam.\n\n## Exam domains\n\n- Model Selection & Optimisation — 16.8%\n- Prompt & Context Engineering — 11%\n\n## 📅 Daily plan\n\n- 09-21 · Model family: Opus / Sonnet / Haiku trade-offs, context window, model IDs vs aliases, deprecations\n  - Build: Run one task on three models; table of latency, tokens, cost\n    - Copy the current model table (name, ID, alias, context window, max output, price in/out) into notes/models-prompting.md.\n    - ch3/compare.py: run the same 5 prompts (a classification, an extraction, a code fix, a summary, a reasoning puzzle) on Haiku, Sonnet, Opus; record latency, tokens, cost via your cost() helper.\n    - Mark which tasks Haiku got right — that is your evidence for 'smallest model that passes'.\n    - Read the deprecation policy: how much notice, what happens to a retired ID.\n  - ✔ Done when: A 5×3 table with cost and correctness; you can state each tier's sweet spot.\n  - Read\n    - [Models overview](https://docs.claude.com/en/docs/about-claude/models/overview)\n    - [Choosing a model](https://docs.claude.com/en/docs/about-claude/models/choosing-a-model)\n    - [Model deprecations](https://docs.claude.com/en/docs/about-claude/model-deprecations)\n- 09-22 · Cost: token counting endpoint, pricing per model, the optimisation order (prompt → cache → batch → smaller model)\n  - Build: Build a cost calculator script\n    - Call client.messages.count\\_tokens(model, system, messages, tools) and compare to the usage of the real call.\n    - ch3/cost.py: given model, input, output, cache read/write tokens and batch flag → USD. Cover the 1h-TTL write multiplier.\n    - Model a workload: 10k calls/day, 3k-token stable prefix, 200-token question, 300-token answer. Compute cost for: baseline Sonnet; + caching; + Haiku; + batch. Put the four numbers in notes.\n    - Write the optimisation ladder in your own words with one sentence on why each rung comes before the next.\n  - ✔ Done when: Calculator matches the pricing page; the four-scenario table shows caching and model choice dominate.\n  - Read\n    - [Token counting](https://docs.claude.com/en/docs/build-with-claude/token-counting)\n    - [Pricing](https://docs.claude.com/en/docs/about-claude/pricing)\n- 09-23 · Prompt engineering: clear instructions, examples, XML tags, role in system prompt, output format\n  - Build: Rewrite a weak prompt three ways; compare\n    - Take a weak prompt from your dev project ('summarise this log'). Version 1: clear and direct with success criteria and audience. Version 2: add 2 few-shot examples in <example> tags. Version 3: add a role in system and an <output\\_format>.\n    - Run each 5 times at temperature 0.7 on Sonnet; score consistency and usefulness.\n    - Try the Console Workbench prompt improver / generator on version 1 and diff what it added.\n    - Record which technique gave the biggest jump — usually clarity, then examples.\n  - ✔ Done when: Three versions committed with a short scored comparison; you can recite Anthropic's technique order.\n  - Read\n    - [Prompt engineering overview](https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview)\n    - [Be clear and direct](https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/be-clear-and-direct)\n    - [Use examples (multishot)](https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/multishot-prompting)\n    - [Use XML tags](https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/use-xml-tags)\n    - [System prompts / role](https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/system-prompts)\n- 09-24 · Extended thinking (manual budget\\_tokens vs adaptive + effort): when it helps, cost; chain-of-thought prompts\n  - Build: Compare thinking on and off on a reasoning task\n    - Pick a multi-step task (plan a zero-downtime DB migration with constraints). On Haiku 4.5 run with thinking={type:\"enabled\", budget\\_tokens:4000} and without; on Sonnet 5 run thinking={type:\"adaptive\"} with output\\_config effort low vs high. Compare quality, output tokens, cost, latency.\n    - Read the thinking block in content; note it is billed as output and that budget\\_tokens must be < max\\_tokens.\n    - Try the same with a prompt-only chain of thought ('Think step by step inside <thinking> tags, then answer in <answer>') on a model without thinking on.\n    - Note the incompatibilities: no prefill with thinking; temperature fixed at 1 with thinking; tool use works but requires passing thinking blocks back.\n  - ✔ Done when: You can say when thinking pays for itself (multi-step reasoning, maths, planning) and when it is waste (lookups, classification).\n  - Read\n    - [Extended thinking](https://docs.claude.com/en/docs/build-with-claude/extended-thinking)\n    - [Let Claude think (chain of thought)](https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/chain-of-thought)\n    - [Effort parameter (where supported)](https://docs.claude.com/en/docs/build-with-claude/effort)\n- 09-25 · Context engineering: window management, summarisation, what goes in system vs user, long-context tips (docs first, question last)\n  - Build: Add conversation summarisation to chat.py past N tokens\n    - In chat.py, count tokens before each call; when history exceeds N, ask Haiku to summarise the older turns into one assistant/user pair and keep the last 4 turns verbatim.\n    - Test a 30-turn conversation; watch input tokens plateau instead of climbing.\n    - Long-doc experiment: put a 40-page PDF text in <document> tags at the top with the question at the bottom, and ask Claude to quote relevant passages in <quotes> before answering. Compare with question-first.\n    - Write the 'what lives where' rule: system = role, rules, stable reference (cached); user = task, data, question; assistant = prefill.\n  - ✔ Done when: Summarisation kicks in automatically and quality holds; the long-doc experiment shows why docs go first.\n  - Read\n    - [Context windows](https://docs.claude.com/en/docs/build-with-claude/context-windows)\n    - [Long context tips](https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/long-context-tips)\n    - [Context editing / compaction (where available)](https://docs.claude.com/en/docs/build-with-claude/context-editing)\n    - [Effective context engineering (Anthropic engineering blog)](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents)\n- 09-26 · Academy modules on prompting; Console Workbench prompt improver\n  - Build: Build a 'which model when' decision sheet\n    - Complete the prompting modules and quizzes.\n    - Build a one-page decision sheet: workload → model → optimisations → why. Cover at least: high-volume classification, customer chat, code review agent, legal document analysis, batch summarisation, real-time voice-ish latency.\n    - Add a second sheet: 'symptom → fix' (too expensive, too slow, inconsistent format, hallucinating, truncated).\n  - ✔ Done when: Both sheets in notes; each row names a model, a technique and a reason.\n  - Read\n    - [Course: Claude Platform 101](https://academy.claude.com/courses/claude-platform-101)\n    - Library: appdesign\n    - Library: techfund\n    - [Prompt generator / improver in Console](https://platform.claude.com/workbench)\n    - [Prompt engineering interactive tutorial](https://github.com/anthropics/prompt-eng-interactive-tutorial)\n- 09-27 · Review day\n  - Build: Write notes/models-prompting.md\n    - Finish notes/models-prompting.md: model table, ladder, technique order, thinking rules, context rules, decision sheets.\n    - Self-check; then the Model Selection and Prompt & Context Engineering quizzes in the Question bank.\n    - Weekly retrospective.\n  - ✔ Done when: Notes committed; both quizzes recorded; retrospective filled.\n  - Read\n    - Study material below\n\n## 📖 Study material\n\n- Model selection\n  - Haiku · fastest, cheapest · classification, extraction, routing, moderation pre-checks, high-volume simple Q&A, sub-agents doing narrow jobs · lowest\n  - Sonnet · best balance · default for apps, coding, RAG chat, agents with tools · middle\n  - Opus · deepest reasoning · complex multi-step agents, hard analysis, orchestrator in multi-agent systems, when quality dominates cost · highest\n  - Start small: pick the smallest model that passes your eval; escalate only on measured failure. Route: cheap model first, escalate on low confidence or a \"needs expert\" classification.\n  - Current lineup (Sep 2026): Fable 5.1, Opus 5 and Sonnet 5 have a 1M context window and 128K max output; Haiku 4.5 has 200K / 64K. No long-context surcharge. Prices per MTok in/out: Fable 5.1 $10/$50 · Opus 5 $5/$25 · Sonnet 5 $2/$10 · Haiku 4.5 $1/$5.\n  - Pin model IDs in production so behaviour is stable. Pre-4.6 models have dated snapshots (claude-sonnet-4-5-20250929) plus rolling aliases (claude-sonnet-4-5) — aliases are for experiments; 4.6+ IDs (claude-sonnet-5) are dateless but already pinned snapshots. Deprecations get ≥60 days' notice; migrate by re-running evals on the new snapshot. All Claude 3.x models are retired.\n  - Cloud availability: the same models are on Amazon Bedrock, Google Vertex AI and Microsoft Foundry — model IDs differ per platform; the SDK has platform-specific clients.\n- Cost ladder (do in this order, measure between rungs)\n  - Trim the prompt and outputs: remove boilerplate, cap max\\_tokens, ask for terse formats.\n  - Cache the stable prefix (system, tools, documents) — biggest win for repeated context.\n  - Batch anything non-interactive — flat 50% off.\n  - Downgrade the model where the eval still passes; route the hard cases up.\n  - Reduce thinking budget or effort on tasks that do not need it.\n  - Measure with usage and count\\_tokens first — do not optimise blind. Output tokens cost ~5× input; thinking is output.\n- Prompt engineering — Anthropic's technique order\n  - Be clear and direct: state the task, audience, success criteria, constraints; give context on why. Imagine handing it to a capable new colleague.\n  - Examples (multishot): 3–5 diverse, relevant examples wrapped in <example> tags — the single most effective lever for format and tone.\n  - Let Claude think: chain of thought — \"think step by step\" or structured <thinking>/<answer> tags; or turn on extended thinking.\n  - XML tags: separate instructions, context, examples, documents (<document>, <instructions>) so nothing is confused for anything else. Tags are also the safe way to fence untrusted content.\n  - Give Claude a role via the system prompt (\"You are a senior SRE reviewing Terraform…\") — changes tone, depth, and what it notices.\n  - Prefill the response to force format or skip preamble.\n  - Chain prompts: split complex work into sequential calls, each verifiable.\n  - Long-context tips: documents at the top (~20k+ tokens), query at the bottom; ask for quotes first; structure multiple docs with metadata tags.\n- Extended thinking and effort\n  - Manual mode: thinking: {type:\"enabled\", budget\\_tokens: N}; N ≥ 1,024 and below max\\_tokens (Haiku 4.5 and 4.5-era models). Adaptive mode: thinking: {type:\"adaptive\"} plus output\\_config: {effort: low|medium|high|xhigh|max} on 4.6+ — manual budget\\_tokens is a 400 on 4.7+/Opus 5/Sonnet 5. Thinking blocks come back in content (summarised) and are billed as output tokens.\n  - Helps: maths, multi-step planning, complex analysis, agentic decisions. Wastes money: lookups, classification, formatting, retrieval-style Q&A.\n  - Constraints: no prefill; with tool use you pass thinking blocks back unchanged (signature validated); tool\\_choice any/tool is not allowed with manual thinking; interleaved thinking (between tool calls) is automatic in adaptive mode. 4.6+ keeps prior-turn thinking in context (billed as input).\n  - Effort (low / medium / high / xhigh / max, default high) shapes the whole response — text, tool calls and thinking depth; it is a signal, not a hard budget; changing it at the top level invalidates the message cache.\n- Context engineering\n  - The window is a budget: system + tools + history + documents + output must fit. Exceeding it is a 400 error (or a truncation with some settings).\n  - Strategies: summarise or drop old turns; keep the last N turns verbatim; store long-term facts in a retrieval layer and inject only what is relevant (RAG); keep the system prompt stable so it caches; put volatile content last.\n  - Newer platform features automate this: context editing (auto-clear old tool results), compaction, and memory tools for agents.\n  - Attention degrades with size — \"lost in the middle\" — so place the most important material at the start and end, and ask for quotes to ground answers.\n- ⚠ Exam traps\n  - \"Fastest way to cut cost\" is caching or a smaller model, not lowering temperature.\n  - Temperature controls randomness, not length or cost (and is rejected on Claude 4.7+).\n  - Thinking tokens are billed as output; budget\\_tokens ≥ 1,024 and < max\\_tokens.\n  - Aliases are not pinned.\n  - Cached tokens still count toward the context window.\n  - The first technique to try is always clearer instructions, not examples or thinking.\n  - Docs go before the question, not after.\n- Structured prompt template\n\n## 📚 Library digests\n\n- [Models overview and IDs](https://platform.claude.com/docs/en/about-claude/models/overview)\n  - Key facts\n    - Current lineup (Sep 2026): Claude Fable 5.1 claude-fable-5-1 (1M context, 128K max output, adaptive thinking always on, $10/$50); Claude Opus 5 claude-opus-5 (1M, 128K, adaptive, $5/$25); Claude Sonnet 5 claude-sonnet-5 (1M, 128K, adaptive, $2/$10, fast); Claude Haiku 4.5 claude-haiku-4-5-20251001 (200K, 64K, manual extended thinking, $1/$5, fastest).\n    - Recommendations: Opus 5 for most workloads; Fable 5.1 for the hardest reasoning/agentic work; Sonnet 5 for speed/cost balance; Haiku 4.5 for budget and speed. Default effort is high on the 5-series; effort is not supported on Haiku 4.5.\n    - All support text+image input, tool use, vision, multilingual output.\n    - ID formats: 4.6 and later are dateless and pinned (claude-sonnet-4-6, claude-opus-5) — they are snapshots, not evergreen aliases. Pre-4.6: dated IDs (claude-sonnet-4-5-20250929) plus rolling aliases (claude-sonnet-4-5). Bedrock: anthropic.claude-opus-5; Vertex: same as API.\n    - Weights never change for a given ID. GET /v1/models returns max\\_input\\_tokens, max\\_tokens and capabilities.\n    - Same models on Amazon Bedrock, Google Vertex AI, Microsoft Foundry with platform-specific IDs and SDK clients.\n  - ⚠ Exam traps\n    - claude-sonnet-4-6 is a fixed snapshot; claude-sonnet-4-5 is an alias that rolls forward — only pre-4.6 IDs have alias/snapshot pairs.\n    - Haiku 4.5 is the only current model with 200K context / 64K output; the 5-series is 1M / 128K.\n    - Fable 5.1's adaptive thinking cannot be turned off.\n  - Then vs now\n    - Exam questions naming 'Opus / Sonnet / Haiku' tiers are about trade-offs (quality vs latency vs cost), which are unchanged. If a stem uses older IDs (claude-3-5-…, claude-sonnet-4-…), answer on the tier logic; all Claude 3.x models are retired as of 2026.\n- [Pricing](https://platform.claude.com/docs/en/about-claude/pricing)\n  - Key facts\n    - USD per million tokens — input / 5-min cache write / 1-h cache write / cache read / output: Fable 5.1 $10 / 12.50 / 20 / 0.25 / 50 · Opus 5 (and 4.5–4.8) $5 / 6.25 / 10 / 0.50 / 25 · Sonnet 5 $2 / 2.50 / 4 / 0.20 / 10 · Sonnet 4.5–4.6 $3 / 3.75 / 6 / 0.30 / 15 · Haiku 4.5 $1 / 1.25 / 2 / 0.10 / 5.\n    - Multipliers: 5-min cache write 1.25×, 1-hour write 2×, cache read 0.1× (0.025× on Fable/Mythos 5.1). Batch API: 50% off input AND output (Opus 5 $2.50/$12.50; Sonnet 5 $1/$5; Haiku 4.5 $0.50/$2.50).\n    - No long-context premium above 200K — the full 1M window is billed at standard rates. Data residency inference\\_geo 'us' = 1.1×.\n    - Fast mode (Opus 5/4.8, preview): $10/$50; stacks with caching; not available in Batch.\n    - Server tools: web search $10 per 1,000 searches (+ tokens, errors free); web fetch free beyond tokens; code execution free alongside web search/fetch, otherwise 1,550 free container-hours/month then $0.05/hour (5-min minimum).\n    - Tool-use system prompt overhead: Opus 5 286 tokens (auto/none) / 406 (any/tool); Sonnet 5 354/474; Haiku 4.5 496/588.\n  - ⚠ Exam traps\n    - Cache write costs MORE than base input (1.25× or 2×); reads cost 0.1× — caching pays only with reuse (break-even ≈ 2 reads).\n    - Batch discount is 50% on input and output but cannot combine with fast mode.\n    - Output tokens are ~5× input price; thinking tokens are output.\n- [Model deprecations](https://platform.claude.com/docs/en/about-claude/model-deprecations)\n  - Key facts\n    - Minimum 60 days' notice before retiring a publicly released model; email to orgs with active usage plus docs updates.\n    - States: Active → Legacy (no updates) → Deprecated (still serves, retirement date set) → Retired (requests fail).\n    - All Claude 3.x models are retired (3.5 Haiku and 3.7 Sonnet retired Feb 2026; 3 Haiku Apr 2026); Opus 4 / Sonnet 4 retired Jun 2026; Opus 4.1 retired Aug 2026. Oldest still-active: Sonnet 4.5 and Haiku 4.5.\n    - Parameter deprecation: temperature/top\\_p/top\\_k → 400 on Opus 4.7+.\n    - Audit your usage by model: Console Usage page → export CSV by API key and model.\n  - ⚠ Exam traps\n    - Deprecated models still work; only Retired ones fail.\n    - Notice period is 60 days, not 30 or 90.\n    - Migrate by re-running your evals on the replacement snapshot before switching IDs.\n- [Token counting](https://platform.claude.com/docs/en/build-with-claude/token-counting)\n  - Key facts\n    - POST /v1/messages/count\\_tokens; SDK client.messages.count\\_tokens(...) → {input\\_tokens: N}. Free, but rate-limited separately (Start 5,000 RPM, Build 10,000, Scale 20,000).\n    - Counts system, messages, tools, images, PDFs and thinking blocks — it is not text-only; input tokens only, no output estimate.\n    - Claude 4.7+ uses a new tokenizer yielding ~30% more tokens for the same text — don't reuse older counts.\n    - Result is an estimate; billing excludes system-added tokens. Request cap 32 MB.\n  - ⚠ Exam traps\n    - Token counting is free but has its own RPM limit.\n    - Counts input only — never an output estimate.\n    - 4.7+ tokenizer counts ≈30% higher than 4.5/4.6 for identical text.\n- [Prompt engineering overview](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview)\n  - Key facts\n    - Prerequisites before prompt engineering: clear success criteria, empirical evals against them, a first-draft prompt.\n    - Prompt engineering beats fine-tuning for most needs: faster, cheaper, preserves general knowledge, transparent, easy to iterate.\n    - Prompting does not fix latency or cost — choose a different model or architecture for those.\n    - Technique order (broad → specialised): be clear and direct → examples (few-shot) → XML structure → role via system prompt → let Claude think → chain prompts → long-context tips.\n    - Resources: prompt generator/improver in the Console Workbench, the interactive GitHub tutorial, model-specific best-practice pages.\n  - ⚠ Exam traps\n    - Cost/latency problems → change model, not prompt.\n    - Success criteria and evals must exist before you start iterating on prompts.\n    - Clarity comes before examples; examples before thinking.\n- [Claude prompting best practices (clarity, examples, XML, roles, thinking, long context)](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices)\n  - Key facts\n    - Golden rule: show the prompt to a colleague with minimal context — if they'd be confused, so will Claude. Treat Claude as a brilliant new employee who lacks your context.\n    - Be specific about output format and constraints; use numbered lists when order matters; explain WHY ('a text-to-speech engine will read this, so no ellipses' beats 'NEVER use ellipses'). Tell Claude what to do rather than what not to do.\n    - Examples: 3–5, relevant and diverse, wrapped in <example> inside <examples>; include <thinking> inside examples to demonstrate reasoning style.\n    - XML: consistent descriptive tag names; nest for hierarchy (<documents> → <document index='n'>); separate <instructions>, <context>, <input>.\n    - Role: set it in the system parameter — even one sentence makes a difference; put task-specific data in the user turn.\n    - Thinking: prefer general instructions ('think thoroughly') over prescriptive steps; adaptive thinking on 4.6+ (always on for Fable/Mythos 5.x); when thinking is off, use manual chain of thought with <thinking> and <answer> tags.\n    - Long context (20k+ tokens): documents at the TOP, query at the END — up to 30% better; wrap each in <document> with <source> and <document\\_content>; ask Claude to quote relevant parts first.\n    - Prefill on the last assistant turn is unsupported from Claude 4.6 (400 error); use explicit format instructions, XML output tags or structured outputs.\n    - Prompt chaining remains useful when you must inspect intermediate outputs or enforce a pipeline (draft → review → refine).\n    - Tool-use prompting: be explicit ('Change this function' vs 'Can you suggest'); require confirmation before destructive or irreversible actions.\n  - ⚠ Exam traps\n    - Long documents go ABOVE the question, not below.\n    - Recommended few-shot count is 3–5, not 'as many as possible'.\n    - Role goes in system; prefill on the last assistant turn is a 400 on Claude 4.6+.\n- [Extended thinking](https://platform.claude.com/docs/en/build-with-claude/extended-thinking)\n  - Key facts\n    - Manual mode: thinking={type:'enabled', budget\\_tokens:N} — N ≥ 1,024 and < max\\_tokens; budget is a target, max\\_tokens the hard ceiling. Adaptive mode: thinking={type:'adaptive'} plus output\\_config.effort.\n    - Support: manual only on 4.5 and earlier (and Haiku 4.5); deprecated on 4.6; rejected (400) on 4.7+, Opus 5, Sonnet 5, Fable 5.1 — those are adaptive-only.\n    - Thinking tokens are billed as OUTPUT; breakdown in usage.output\\_tokens\\_details.thinking\\_tokens.\n    - Response: thinking block (summarised) then text; redacted\\_thinking may appear; blocks carry a signature and must be passed back unmodified with tool results.\n    - Interleaved thinking (thinking between tool calls) is automatic in adaptive mode (beta header in manual mode).\n    - Incompatible with prefill and with max\\_tokens:0 cache pre-warm; changing thinking config between requests misses the cache. Claude 4.6+ keeps prior-turn thinking in context (billed as input); 4.5 and earlier strip it.\n    - Use Batches for budgets above ~32k to avoid timeouts; stream for large max\\_tokens.\n  - ⚠ Exam traps\n    - budget\\_tokens < 1,024 → error; budget\\_tokens ≥ max\\_tokens → error.\n    - Thinking tokens are output tokens for billing.\n    - Manual enabled + budget\\_tokens is a 400 on 4.7+ — use adaptive + effort.\n  - Then vs now\n    - The blueprint's 'extended thinking / budget tokens' wording matches the manual mode. Expect questions framed that way; know both the manual rules (≥1024, < max\\_tokens, billed as output) and the modern adaptive + effort replacement.\n- [Effort parameter](https://platform.claude.com/docs/en/build-with-claude/effort)\n  - Key facts\n    - output\\_config={effort: low | medium | high | xhigh | max}; default high. Supported on Opus 4.5+, Sonnet 4.6+, Fable/Mythos; not Haiku 4.5.\n    - Effort shapes all output — text length, number of tool calls, thinking depth; it is a behavioural signal, not a strict budget. thinking controls whether thinking happens; effort controls how much.\n    - Lower effort → fewer/combined tool calls, terse output; xhigh for long-horizon work; max unconstrained. On Opus 5, xhigh/max require thinking enabled.\n    - Changing top-level effort between requests invalidates the message cache; a per-message effort via a system turn (beta) preserves it. No separate pricing — cost changes only through tokens.\n  - ⚠ Exam traps\n    - Five levels, default high — not three.\n    - Effort is set under output\\_config, not inside thinking.\n    - Changing effort mid-conversation at the top level busts the cache.\n- [Context windows](https://platform.claude.com/docs/en/build-with-claude/context-windows)\n  - Key facts\n    - 1M-token window with 128K max output on the 5-series and 4.6+ Opus/Sonnet; 200K on Sonnet 4.5 and older, and Haiku 4.5. 1M is the default (no beta header, no surcharge).\n    - Everything counts: system, all messages, tool definitions, tool results, images/documents, generated output; cached tokens still count.\n    - Input alone > window → 400 'prompt is too long'. Input + max\\_tokens > window → generation stops with stop\\_reason 'model\\_context\\_window\\_exceeded' (Claude 4.5+).\n    - Thinking: models that strip prior thinking (Opus <4.5, Sonnet <4.6, all Haiku) bill it once as output; models that keep it (Opus 4.5+, Sonnet 4.6+, 5.x) count prior thinking as input each turn — clear with context editing.\n    - Tool-use turns must return the unmodified thinking block (signature validated).\n    - Context awareness: Sonnet 4.5+/Haiku 4.5 receive token-budget warnings after tool calls; server-side compaction (beta, 4.6+) summarises earlier turns to continue past the limit. 'Context rot' degrades accuracy as tokens grow even below the limit.\n    - Max 600 images/PDF pages per request (100 on 200K models).\n  - ⚠ Exam traps\n    - Input too long = 400; input + max\\_tokens too long = truncated response with model\\_context\\_window\\_exceeded.\n    - Cached tokens count toward the window; caching changes billing only.\n    - On Opus 4.5+/Sonnet 4.6+ prior thinking persists and is billed as input.\n- [Context editing (server-side clearing)](https://platform.claude.com/docs/en/build-with-claude/context-editing)\n  - Key facts\n    - Beta header context-management-2025-06-27; request param context\\_management={edits:\\[…\\]}; use client.beta.messages.create.\n    - Strategy clear\\_tool\\_uses\\_20250919: clears old tool results (replaced by a placeholder) once context grows. Fields: trigger (default input\\_tokens 100,000; or tool\\_uses N), keep (default tool\\_uses 3), clear\\_at\\_least (input\\_tokens N), exclude\\_tools, clear\\_tool\\_inputs (default false).\n    - Strategy clear\\_thinking\\_20251015: keep {thinking\\_turns: N} or 'all'. When combining, list clear\\_thinking first.\n    - Response includes context\\_management.applied\\_edits (type, cleared\\_tool\\_uses, cleared\\_input\\_tokens). Edits are server-side; your stored history is untouched.\n    - Clearing tool results invalidates the prompt cache from that point — use clear\\_at\\_least to make it worthwhile. Pair with the memory tool to persist critical facts before clearing; count\\_tokens accepts context\\_management to preview.\n  - ⚠ Exam traps\n    - Default trigger 100,000 input tokens; default keep 3 tool uses.\n    - Server-side: the client's conversation history is unchanged.\n    - Thinking-clearing must precede tool-clearing in the edits list.\n- [Effective context engineering for AI agents (engineering blog)](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents)\n  - Key facts\n    - Context engineering = curating the whole context state (system prompt, tools, external data, history) — a superset of prompt engineering.\n    - Context rot: performance degrades as tokens grow; attention is a finite budget (n² pairwise); a gradient, not a cliff.\n    - System prompt at the right altitude: not brittle if/else rules, not vague; specific heuristics in organised sections; minimal high-signal tokens.\n    - Tools: self-contained, non-overlapping, token-efficient — 'if a human engineer can't say which tool to use, an agent can't either'.\n    - Few-shot: diverse canonical examples, not laundry lists of edge cases.\n    - Just-in-time context: lightweight references (paths, URLs, queries) loaded at runtime; hybrid with upfront context (Claude Code loads CLAUDE.md then greps).\n    - Long-horizon techniques: compaction (summarise history — maximise recall first, then precision), structured note-taking (persistent notes outside context, e.g. Claude Code memory), sub-agent architectures (clean context per subagent, 1–2k-token summaries back).\n  - ⚠ Exam traps\n    - Compaction: maximise recall first, then tune precision.\n    - Few-shot ≠ exhaustive edge cases.\n    - Sub-agents return condensed summaries, not transcripts.\n- Claude application design: schemas, sessions, interface hygiene — blueprint 8.6%\n  - Key facts\n    - Interface interpretation: read a Messages request/response like a contract — which blocks are present (text, tool\\_use, thinking), what stop\\_reason implies, what usage costs; never assume content\\[0\\] is text.\n    - Schema design for tools and outputs: small, flat objects; explicit enums instead of free text; required vs optional deliberate; descriptions on every property; unambiguous names (user\\_id); avoid deeply nested or union-heavy schemas (structured outputs has limits on unions/optionals); version schemas when you change them.\n    - Session hygiene: the API is stateless — your app owns the history. Store it server-side keyed by session id; cap history length; summarise or drop old turns; keep the system prompt stable (cacheable) and put per-request data last; never leak one user's context into another's; clear or rephrase after a refusal; strip tool results that are no longer needed (context editing).\n    - Conversation state vs application state: the model sees only what you send — keep authoritative state (orders, balances) in your database and pass snapshots, not the other way round.\n    - Defensive parsing (blueprint 'Output Handling'): check stop\\_reason first; validate JSON against a schema; handle max\\_tokens truncation; retry once with the error message; fail closed on unparsable output; log the raw response with request id.\n    - Multi-tenant design: one workspace/key per tenant for Files and spend isolation; opaque metadata.user\\_id for abuse tracking; per-tenant rate-limit budgets.\n    - Configuration management (blueprint 4.1%): model ID, max\\_tokens, effort, tool list and prompt versions live in config (not scattered in code); CLAUDE.md and settings.json versioned with the repo; environment-specific settings (dev/staging/prod keys and models).\n  - ⚠ Exam traps\n    - The API is stateless: session state is your responsibility, keyed and isolated per user.\n    - Check stop\\_reason before parsing; treat max\\_tokens and refusal as distinct failure paths.\n    - Flat schemas with enums and good descriptions beat clever nested ones — for both tools and structured outputs.\n- Technical fundamentals: SDK integration, streaming transports, websockets — blueprint 6.1%\n  - Key facts\n    - Transport reality: the Messages API is HTTPS request/response; streaming uses server-sent events (SSE) over that same HTTP response — one-way, text/event-stream, reconnect by resending. There is no WebSocket endpoint on the Messages API; WebSockets appear in YOUR app tier (browser ↔ your server) to relay SSE tokens to a UI, or in voice/realtime products.\n    - Pattern: browser ⇄ (WebSocket or SSE) ⇄ your backend ⇄ (SSE) ⇄ Claude. Keep the API key on the backend only; never call the API from the browser.\n    - SDK integration: sync client for scripts/batch, async client for servers; configure max\\_retries and timeout; use with\\_options per call; catch typed exceptions; use messages.stream() helper for token streaming; read \\_request\\_id for support.\n    - Timeouts: non-streaming calls have a ~10-minute limit; stream long outputs; use Batches for long offline work; set TCP keep-alive on long connections.\n    - Idempotency and retries: the SDK retries transient errors (408/409/429/5xx); design tool side effects to be safe under retry.\n    - Environment: ANTHROPIC\\_API\\_KEY from env/secret manager; separate keys per environment; spend limits per workspace; region/data residency via inference\\_geo where required.\n  - ⚠ Exam traps\n    - Claude streams via SSE; WebSockets are something your app adds between browser and backend.\n    - Never expose the API key to a browser client — proxy through your backend.\n    - Streaming is for perceived latency and long outputs; it doesn't change token cost.\n\n## ❓ Self-check\n\n- A support bot answers FAQs from a 30-page policy doc, 10k calls/day. Model and optimisations?\n  - → Haiku (or Sonnet if eval demands), policy doc cached as a system-prompt prefix, short max\\_tokens, temperature 0, eval to confirm quality.\n- Which prompting technique should you try first?\n  - → Clear, direct instructions with success criteria — before examples or thinking.\n- Opus answers correctly but costs too much for a classification task. Next step?\n  - → Run the eval on Haiku; if it passes, switch; if borderline, route only low-confidence items to a bigger model.\n- Where do long documents go relative to the question?\n  - → Documents at the top in XML tags, question at the bottom; ask for relevant quotes first.\n- budget\\_tokens=8000 and max\\_tokens=4000 — what happens?\n  - → Invalid: budget\\_tokens must be less than max\\_tokens.\n- Why prefer a dated model ID in production?\n  - → Behaviour and evals stay stable; an alias silently upgrades to a new snapshot.\n- A chat's input tokens climb every turn until a 400 error. Fix?\n  - → Context management: summarise older turns, keep the last N verbatim, or use context editing/compaction; cache the stable prefix.\n- Which parameter does NOT reduce cost: max\\_tokens, temperature, model, caching?\n  - → temperature — it only changes randomness.\n- When is extended thinking a waste?\n  - → Simple lookups, classification, formatting — pay for it only on multi-step reasoning.\n- Which is cheaper per token: input or output?\n  - → Input by roughly 5×; cached input reads are cheaper still (~0.1× base input).\n\n## ⚠ Traps to drill\n\n- Cheapest quick win for a high-volume prompt with a big stable system prompt?\n  - → Prompt caching (then batch if offline, then a smaller model). Not temperature.\n- Thinking tokens are billed as…\n  - → Output tokens, at output price; budget\\_tokens < max\\_tokens.\n- First prompt-engineering technique to try?\n  - → Be clear and direct with success criteria — before few-shot, CoT or role.\n- Long document placement?\n  - → Top of the prompt in <document> tags; question last; ask for quotes first.\n- Alias vs dated model ID in prod?\n  - → Dated ID. Aliases move to new snapshots without warning.\n- Which tier for classification at scale?\n  - → Haiku — smallest model that passes the eval; route hard cases upward.\n- Temperature changes cost or length?\n  - → Neither. Randomness only.\n\n## 🗒 Cheat sheet\n\n- Haiku = volume/classify/route · Sonnet = default apps/coding/agents · Opus = hardest reasoning/orchestration. Smallest model that passes the eval.\n- Cost ladder: trim → cache → batch → smaller model → less thinking. Measure with usage + count\\_tokens. Output ≈ 5× input price.\n- Technique order: clear & direct → examples → let it think → XML tags → role (system) → prefill → chain prompts → long-context tips\n- Thinking: manual budget\\_tokens ≥1024 and < max\\_tokens (Haiku 4.5) · adaptive + effort low/medium/high/xhigh/max on 4.6+ (default high) · billed as output · no prefill · pass thinking blocks back with tools\n- Long context: docs first in tags, question last, ask for quotes; lost-in-the-middle → important stuff at start/end\n- Context mgmt: summarise old turns, keep last N, RAG for facts, stable prefix cached, volatile last; context editing/compaction on newer models\n- Pin IDs in prod (dated pre-4.6, dateless-but-pinned 4.6+); aliases for experiments; ≥60 days deprecation notice; 3.x retired; same models on Bedrock / Vertex / Foundry with platform IDs\n\n## ☑ Chapter checklist\n\n- Can justify Haiku vs Sonnet vs Opus for five different workloads\n- Know the cost-optimisation ladder in order\n- Used XML tags and few-shot examples in a real prompt\n- Know when extended thinking is worth paying for and when not\n- Summarisation strategy implemented in chat.py\n- notes/models-prompting.md written\n\n","ch4":"# Chapter 4 — Agents and workflows\n\n## 🎯 Goal\n\n- Choose between a single call, a workflow and an agent for any scenario; name the five patterns; build a guarded agent with the Agent SDK.\n\n## Exam domains\n\n- Agents & Workflows — 14.7%\n\n## 📅 Daily plan\n\n- 09-28 · Workflows vs agents; the agent loop (model → tool → observe → repeat); when not to build an agent\n  - Build: Implement a 3-step prompt chain in Python\n    - Read the article twice; write its definitions of workflow and agent into notes/agents.md in your own words.\n    - ch4/chain.py: step 1 extract facts from a PR diff → step 2 write a changelog entry → step 3 check the entry against the facts (gate) and reject/redo if mismatched.\n    - Log tokens per step; note that chaining costs more calls but each is cheaper and testable.\n    - List three tasks from your day job that are workflows and one that truly needs an agent.\n  - ✔ Done when: Chain runs with a programmatic gate between steps; notes hold the definitions and your examples.\n  - Read\n    - [Building effective agents (Anthropic engineering)](https://www.anthropic.com/engineering/building-effective-agents)\n- 09-29 · Patterns: prompt chaining, routing, parallelisation, orchestrator–workers, evaluator–optimizer\n  - Build: Build a router that sends tickets to different prompts\n    - ch4/router.py: Haiku classifies a ticket as billing / outage / how-to; each class goes to a different system prompt and model (outage → Sonnet).\n    - Add parallelisation: send the same ticket to three graders concurrently (asyncio.gather) and take the majority vote (voting) — then split a long doc into sections summarised concurrently (sectioning).\n    - Sketch orchestrator–workers and evaluator–optimizer on paper; note which needs the model to decide the sub-tasks dynamically (orchestrator) versus code doing it (parallelisation).\n    - Fill a table: pattern → when → cost profile → failure mode.\n  - ✔ Done when: Router and both parallel variants run; the pattern table is in notes.\n  - Read\n    - [Building effective agents — workflow patterns section](https://www.anthropic.com/engineering/building-effective-agents)\n    - [Anthropic cookbook: agent patterns](https://github.com/anthropics/anthropic-cookbook/tree/main/patterns/agents)\n    - Library: agentpatterns\n- 09-30 · Agent SDK: what it adds over the raw API (tool loop, context management, subagents, permissions)\n  - Build: Run the Agent SDK quickstart\n    - pip install claude-agent-sdk (or npm i @anthropic-ai/claude-agent-sdk); run the quickstart: query() with a prompt that reads a file in your repo and reports on it.\n    - List what the SDK gave you for free: built-in tools (Read, Edit, Bash, Grep…), the loop, permission prompts, context compaction, CLAUDE.md loading, MCP support, subagents, hooks.\n    - Set allowed\\_tools to a read-only set and watch a write attempt get denied; then try permission\\_mode options.\n    - Compare with your hand-written loop from Chapter 2 — write down three things the SDK handles that you would have had to build.\n  - ✔ Done when: Quickstart runs against your repo with a restricted tool set; notes list what the SDK adds.\n  - Read\n    - [Agent SDK overview](https://docs.claude.com/en/api/agent-sdk/overview)\n    - [Agent SDK Python](https://docs.claude.com/en/api/agent-sdk/python)\n- 10-01 · Subagents and delegation; memory and state; stopping conditions and max turns\n  - Build: Orchestrator + one worker agent on a real task from your dev project\n    - Define a 'reviewer' subagent (own system prompt, read-only tools) and have the orchestrator delegate 'review these 3 files for error handling' to it.\n    - Set max\\_turns and a token budget; make the run stop cleanly and report what it finished.\n    - Persist and resume a session (session id) so the agent continues a task after a restart.\n    - Note the trade-off: a subagent gets a fresh, isolated context (good for focus, no pollution) but costs extra tokens and only returns a summary.\n  - ✔ Done when: Orchestrator delegates to a worker, respects max\\_turns, and resumes from a saved session.\n  - Read\n    - [Agent SDK: subagents](https://docs.claude.com/en/api/agent-sdk/subagents)\n    - [Agent SDK: sessions and state](https://docs.claude.com/en/api/agent-sdk/sessions)\n    - [How we built our multi-agent research system](https://www.anthropic.com/engineering/multi-agent-research-system)\n- 10-02 · Built-in server tools: web search, web fetch, code execution; Skills concept\n  - Build: Call web search from the API and cite results\n    - Add tools=\\[{type:\"web\\_search\\_20250305\", name:\"web\\_search\", max\\_uses:3}\\] and ask about a recent Kubernetes CVE; print the citations from the response blocks.\n    - Try the code execution tool to compute statistics from a CSV you upload via the Files API.\n    - Read what a Skill is (a folder with SKILL.md + resources, loaded progressively when relevant) and how it differs from a tool (instructions/knowledge vs an action).\n    - Write a 'client tool vs server tool vs MCP vs Skill' comparison in notes.\n  - ✔ Done when: Web search call returns cited results; comparison table written.\n  - Read\n    - [Web search tool](https://docs.claude.com/en/docs/agents-and-tools/tool-use/web-search-tool)\n    - [Web fetch tool](https://docs.claude.com/en/docs/agents-and-tools/tool-use/web-fetch-tool)\n    - [Code execution tool](https://docs.claude.com/en/docs/agents-and-tools/tool-use/code-execution-tool)\n    - [Agent Skills](https://docs.claude.com/en/docs/agents-and-tools/agent-skills/overview)\n- 10-03 · Failure modes: loops, runaway cost, hallucinated tools, lost context — and guards for each\n  - Build: Add max-turn and cost guards to your agent\n    - Give your agent a broken tool that always errors; watch for a retry loop; add loop detection (same tool+args 3× → stop and ask).\n    - Add a cost guard: sum usage across turns; stop at a USD threshold.\n    - Add a human checkpoint: any tool flagged destructive requires approval before execution (hook or permission callback).\n    - Improve one tool description and result format following the 'writing tools for agents' article; measure fewer wasted calls.\n  - ✔ Done when: Agent stops itself on loops and budget, and asks before destructive actions.\n  - Read\n    - [Building effective agents — 'when to use agents' and appendix](https://www.anthropic.com/engineering/building-effective-agents)\n    - [Writing tools for agents](https://www.anthropic.com/engineering/writing-tools-for-agents)\n- 10-04 · Review day\n  - Build: Write notes/agents.md\n    - Finish notes/agents.md: definitions, pattern table, agent loop, SDK features, guards, tool/server-tool/MCP/Skill comparison.\n    - Self-check; then the Agents & Workflows quiz in the Question bank.\n    - Weekly retrospective.\n  - ✔ Done when: Notes committed; quiz recorded; retrospective filled.\n  - Read\n    - Study material below\n\n## 📖 Study material\n\n- Definitions (Anthropic's framing)\n  - Augmented LLM: one model call with retrieval, tools and memory — the building block.\n  - Workflow: LLM calls orchestrated by code along predefined paths. Predictable, testable, cheap, easy to debug. Prefer this whenever the steps are known.\n  - Agent: the model decides the path — choosing tools in a loop, observing results, until done. Use only when the task genuinely needs open-ended decisions and the number of steps is unknown. Costs more, harder to test, needs guardrails.\n  - Rule: find the simplest solution possible; increase complexity only when it demonstrably improves outcomes. Many \"agent\" requests are really a single well-crafted prompt.\n- The five workflow patterns\n  - Prompt chaining · A → gate → B → C · task decomposes into fixed steps; add programmatic checks between steps · more latency; each step must be verifiable\n  - Routing · classify → specialised prompt/model · distinct input categories handled differently (support tiers, cheap vs expensive model) · misroutes; keep the classifier cheap and evaluated\n  - Parallelisation · sectioning (split work) or voting (same task N times) · independent subtasks; need multiple perspectives or confidence · cost × N; aggregation logic\n  - Orchestrator–workers · lead model plans sub-tasks dynamically, delegates, merges · sub-tasks not predictable in advance (multi-file code change, research) · token cost; workers need clear briefs and return summaries\n  - Evaluator–optimizer · generator ↔ critic loop · clear evaluation criteria and iteration measurably helps (translation, code with tests) · infinite loops — cap iterations\n- The agent loop\n  - Receive task → (model reasons → picks tool → your code runs it → result appended) × N → model signals done. Ground truth comes from tool results, so tool result quality drives agent quality.\n  - Always give the agent: a clear goal and stopping condition, a small well-described tool set, max turns, a budget, and checkpoints for human approval before side effects.\n  - Failure modes and guards: loops → loop detection + max turns; runaway cost → token/USD budget; hallucinated tools/args → strict schemas, is\\_error feedback; lost context → compaction, memory/scratchpad files, subagents; destructive actions → permission callbacks/hooks, dry-run tools.\n- Claude Agent SDK\n  - The framework behind Claude Code, exposed as a library (Python and TypeScript). You describe the task; it runs the loop with built-in tools (file read/edit, bash, grep, web), permission handling, automatic context compaction, CLAUDE.md/project context, MCP servers, subagents, hooks and session persistence.\n  - Key knobs: allowed\\_tools / disallowed tools, permission\\_mode, max\\_turns, system prompt, MCP config, custom tools (in-process MCP), subagent definitions.\n  - Use it when you want an agent that acts on files/systems; use the raw Messages API when you want tight control or a simple workflow.\n- Subagents, memory, state\n  - A subagent runs in its own context window with its own system prompt and tool set and returns a result to the parent. Benefits: isolation, parallelism, specialised roles. Cost: extra tokens; the parent only sees a summary — brief it well.\n  - Short-term memory = the context window; long-term = files, a memory tool, a database, or a retrieval store the agent reads and writes.\n  - Sessions can be persisted and resumed; design tasks to be resumable and idempotent.\n- Server tools and Skills\n  - Server tools (web search, web fetch, code execution, computer use, text editor, bash) execute on Anthropic's infrastructure; you add them to tools and get results and citations back without running anything.\n  - Skills: folders of instructions (SKILL.md) plus scripts/resources that Claude loads progressively when the task matches — knowledge and procedures, not actions. Tools do things; Skills teach how.\n  - MCP (Chapter 5): a standard way to plug external tools/resources into any client.\n- ⚠ Exam traps\n  - Simplest solution wins — a single prompt or a workflow before an agent.\n  - If steps are predictable, it's a workflow.\n  - Subagents get their own context window (isolation, but extra cost and only a summary returns).\n  - Human approval belongs before destructive actions.\n  - Parallelisation is code-driven; orchestrator–workers is model-driven.\n  - Evaluator–optimizer needs a cap.\n- Agent SDK minimal (Python)\n\n## 📚 Library digests\n\n- [Building effective agents (Anthropic engineering)](https://www.anthropic.com/engineering/building-effective-agents)\n  - Key facts\n    - Workflows = LLMs and tools orchestrated through predefined code paths. Agents = LLMs dynamically direct their own process and tool use.\n    - Building block: the augmented LLM (LLM + retrieval + tools + memory); MCP is one way to wire in tools.\n    - Five workflow patterns: prompt chaining (sequential steps with programmatic gates; trades latency for accuracy); routing (classify → specialised prompt/model); parallelisation — sectioning (independent subtasks) and voting (same task several times); orchestrator–workers (central LLM dynamically decomposes and delegates; for unpredictable subtasks); evaluator–optimizer (generator + feedback loop; needs clear evaluation criteria).\n    - Autonomous agent: LLM in a loop using tools on environmental feedback ('ground truth' each step), pausing for human checkpoints; stops on completion or a stopping condition (e.g. max iterations).\n    - Start with the simplest solution; add agentic complexity only when it demonstrably improves outcomes — agents bring higher cost and compounding errors.\n    - Three principles: simplicity, transparency (show planning), a well-crafted agent–computer interface (thorough tool docs, tested).\n    - Frameworks are fine to start but add abstraction that obscures prompts and responses.\n    - Tool-design appendix: formats close to natural text; avoid formatting overhead; docstring-quality descriptions; poka-yoke arguments (e.g. require absolute paths).\n  - ⚠ Exam traps\n    - Orchestrator–workers decides subtasks dynamically; parallelisation uses predefined splits.\n    - Voting belongs to parallelisation, not evaluator–optimizer.\n    - The recommendation is the simplest system that works, not the most autonomous.\n- [Claude Agent SDK overview](https://code.claude.com/docs/en/agent-sdk/overview)\n  - Key facts\n    - Agent SDK = Claude Code as a library: same tools, agent loop and context management, in Python and TypeScript only. Other languages: run the CLI with -p and --output-format json.\n    - Positioning: Agent SDK (runs the loop in your process) vs Claude Code CLI (interactive) vs Client SDK (raw API — you write the tool loop) vs Managed Agents (hosted; Anthropic runs the sandbox).\n    - Capabilities: built-in tools (read/write/edit files, run commands, web search), hooks, subagents, MCP, permissions, sessions (resume/fork), skills/commands/memory from .claude/ and ~/.claude/, plugins.\n    - Install: pip install claude-agent-sdk / npm install @anthropic-ai/claude-agent-sdk; Python 3.10+ / Node 18+; bundles the Claude Code binary.\n    - Auth: ANTHROPIC\\_API\\_KEY in the process environment (the SDK does not load .env); CLAUDE\\_CODE\\_USE\\_BEDROCK / VERTEX / FOUNDRY for cloud platforms.\n    - Branding: 'Powered by Claude' allowed; 'Claude Code' branding not permitted for third-party products.\n  - ⚠ Exam traps\n    - Agent SDK ≠ Client SDK: with the client SDK you implement the tool loop yourself.\n    - Python and TypeScript only.\n    - ANTHROPIC\\_API\\_KEY must be in the environment; .env files are not auto-loaded.\n- [Agent SDK — Python reference](https://code.claude.com/docs/en/agent-sdk/python)\n  - Key facts\n    - query() = new session per call, single exchange, no interrupts. ClaudeSDKClient = persistent multi-turn session with interrupt(); use async with.\n    - ClaudeAgentOptions: allowed\\_tools=\\[\\], disallowed\\_tools, permission\\_mode (default | acceptEdits | plan | dontAsk | bypassPermissions | auto), system\\_prompt, mcp\\_servers={}, max\\_turns, max\\_budget\\_usd, cwd, setting\\_sources (None = user+project+local; \\[\\] = none), continue\\_conversation, resume, fork\\_session, model, output\\_format (json\\_schema), hooks.\n    - allowed\\_tools AUTO-APPROVES the listed tools — it does not restrict Claude to them; use disallowed\\_tools to remove tools.\n    - can\\_use\\_tool callback fires only when permission evaluation falls through to a prompt; to intercept every call use a PreToolUse hook.\n    - Precedence: managed policy > programmatic options > local > project > user settings.\n    - Custom in-process tools: @tool(name, description, input\\_schema) + create\\_sdk\\_mcp\\_server(name, tools=\\[…\\]) passed via mcp\\_servers.\n    - Message types: AssistantMessage, UserMessage, ResultMessage (subtype, session\\_id, total\\_cost\\_usd), SystemMessage, StreamEvent; blocks TextBlock/ThinkingBlock/ToolUseBlock/ToolResultBlock.\n  - ⚠ Exam traps\n    - allowed\\_tools=\\['Bash'\\] does not block other tools — it only pre-approves Bash.\n    - can\\_use\\_tool is skipped for auto-approved tools; PreToolUse hooks are not.\n    - query() cannot be interrupted; only ClaudeSDKClient supports interrupt().\n- [Agent SDK — subagents](https://code.claude.com/docs/en/agent-sdk/subagents)\n  - Key facts\n    - Define via the agents={…} option (recommended), .claude/agents/\\*.md files, or the built-in general-purpose agent. Programmatic definitions override same-named files.\n    - AgentDefinition: description and prompt required; optional tools (omit = inherit), disallowedTools, model (opus | sonnet | haiku | fable | inherit | full ID), skills, memory, mcpServers, maxTurns, background, effort, permissionMode.\n    - Invoked through the Agent tool; include 'Agent' in allowed\\_tools to auto-approve delegation.\n    - Context isolation: a subagent starts fresh — its own prompt, project CLAUDE.md and tool definitions; NOT the parent's history or system prompt. Only the final message returns to the parent (marked with parent\\_tool\\_use\\_id).\n    - Subagents run in the background by default and can nest: default max depth 3 (CLAUDE\\_CODE\\_MAX\\_SUBAGENT\\_SPAWN\\_DEPTH), max concurrent 20.\n    - Completed subagents can be resumed by agentId with the same definitions; built-in Explore/Plan are one-shot.\n    - Subagent output is scanned to neutralise system-reminder-style tags and fake turn markers.\n  - ⚠ Exam traps\n    - Subagents do NOT inherit the parent's conversation or system prompt.\n    - Programmatic definition beats a same-named .claude/agents file.\n    - Default spawn depth 3, concurrency 20.\n- [Agent SDK — sessions (continue, resume, fork)](https://code.claude.com/docs/en/agent-sdk/sessions)\n  - Key facts\n    - A session = conversation history persisted to disk automatically; it persists the conversation, not the filesystem (use file checkpointing for that).\n    - continue\\_conversation=True → most recent session in the cwd, no ID. resume=<id> → a specific session. resume + fork\\_session=True → new session ID with a copy of history; the original is unchanged.\n    - Session ID comes on ResultMessage.session\\_id (present even on error results).\n    - Storage: ~/.claude/projects/<encoded-cwd>/<session-id>.jsonl; CLAUDE\\_CONFIG\\_DIR overrides. Cross-host resume needs a session store adapter or moving the file.\n    - Resume after error\\_max\\_turns / error\\_max\\_budget\\_usd with higher limits. Helpers: list\\_sessions(), get\\_session\\_messages(), rename\\_session(), tag\\_session().\n  - ⚠ Exam traps\n    - Forking branches history, not files — a fork's edits are real on disk.\n    - continue needs no ID but only finds the most recent session in that cwd.\n    - Session IDs are on ResultMessage even when the run errored.\n- [Writing effective tools for agents (engineering blog)](https://www.anthropic.com/engineering/writing-tools-for-agents)\n  - Key facts\n    - Tools are a contract between deterministic systems and non-deterministic agents.\n    - Workflow: prototype → wrap in a local MCP server → realistic multi-step evals → agentic loop evals → read transcripts → let Claude analyse transcripts and rewrite tool descriptions.\n    - More tools don't mean better outcomes: consolidate multi-step flows (schedule\\_event instead of list\\_users + list\\_events + create\\_event); prefer search over list.\n    - Namespace names by service/resource (asana\\_projects\\_search). Return semantic context (names over UUIDs); offer a response\\_format enum (detailed / concise) — concise cut ~⅔ of tokens in the example.\n    - Token efficiency: pagination, filtering, truncation with sensible defaults; actionable error messages instead of opaque codes.\n    - Descriptions are prompt engineering: state query formats, terminology, relationships; unambiguous parameter names (user\\_id, not user).\n  - ⚠ Exam traps\n    - Wrapping every API endpoint as a tool is discouraged — target high-impact workflows.\n    - Prefer semantic identifiers (names) in responses over technical IDs.\n    - user\\_id beats user — parameter naming changes accuracy.\n- [Web search tool (server tool)](https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool)\n  - Key facts\n    - Tool name web\\_search; type web\\_search\\_20250305 (newer types add dynamic filtering and response\\_inclusion). Must be enabled by an org admin in the Console, else 400.\n    - Params: max\\_uses; allowed\\_domains / blocked\\_domains — mutually exclusive (400 if both); user\\_location {type:'approximate', city, region, country, timezone}.\n    - Response: server\\_tool\\_use (srvtoolu\\_…) → web\\_search\\_tool\\_result with web\\_search\\_result items (url, title, encrypted\\_content, page\\_age); citations via web\\_search\\_result\\_location. encrypted\\_content must be passed back unchanged in multi-turn.\n    - Errors: too\\_many\\_requests, invalid\\_tool\\_input, max\\_uses\\_exceeded, query\\_too\\_long, request\\_too\\_large, unavailable.\n    - Pricing $10 per 1,000 searches plus tokens; failed searches aren't billed; usage.server\\_tool\\_use.web\\_search\\_requests. May return stop\\_reason pause\\_turn on long searches — send the response back to continue.\n    - Supports streaming, caching, Batches; Claude 4.6+ on the Claude API, Vertex and Foundry (not Bedrock). Web fetch is a companion server tool (web\\_fetch) that retrieves a URL's content.\n  - ⚠ Exam traps\n    - allowed\\_domains and blocked\\_domains cannot be combined.\n    - pause\\_turn means 'send it back to continue', not an error.\n    - Each search counts as one use regardless of result count.\n- [Code execution tool (server tool)](https://platform.claude.com/docs/en/agents-and-tools/tool-use/code-execution-tool)\n  - Key facts\n    - name code\\_execution; types code\\_execution\\_20250825 / 20260120 (REPL state, programmatic tool calling). No beta header needed now.\n    - Sandbox: Python 3.11, Linux, 1 CPU, 5 GiB RAM, 5 GiB disk, NO internet; 90 s per REPL cell. Pre-installed: pandas, numpy, scipy, scikit-learn, matplotlib, openpyxl, python-docx, python-pptx, pypdf, reportlab…\n    - Container: response.container.id; reuse via top-level container=; expires 30 days after creation.\n    - Files in via the Files API (container\\_upload); outputs written to $OUTPUT\\_DIR come back as file\\_ids (downloadable).\n    - Pricing: free with web search/fetch; otherwise 1,550 free container-hours per org per month, then $0.05/hour (5-minute minimum). Haiku 4.5: no REPL persistence.\n  - ⚠ Exam traps\n    - No internet in the sandbox — pip install at runtime fails.\n    - Only files at the top level of $OUTPUT\\_DIR are returned.\n    - Container hard expiry is 30 days.\n- [Agent Skills overview](https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview)\n  - Key facts\n    - A Skill = a folder with SKILL.md (YAML frontmatter + instructions) plus optional scripts/resources.\n    - Frontmatter: name (≤64 chars, lowercase/digits/hyphens, no 'anthropic'/'claude') and description (≤1,024 chars; must say what it does AND when to use it) — both required.\n    - Progressive disclosure: L1 metadata always loaded (~100 tokens per skill); L2 SKILL.md body on trigger (<5k tokens recommended); L3 bundled files only when accessed.\n    - Surfaces: Claude API (pre-built pptx/xlsx/docx/pdf + custom via /v1/skills; REQUIRES the code execution tool), Claude Code (custom only, ~/.claude/skills/ or .claude/skills/), claude.ai (per-user).\n    - API: container={skills:\\[{type:'anthropic', skill\\_id:'pptx', version:'latest'}\\]}; max 20 skills per request; upload ≤30 MB; Skills API endpoints under /v1/skills.\n    - Sandbox has no network and no runtime package install. Treat third-party skills like installing software.\n  - ⚠ Exam traps\n    - Skills in the API need the code execution tool in tools, or they won't run.\n    - The description must say WHEN to use the skill — that is the trigger.\n    - Pre-built document skills are not in Claude Code; only custom skills are.\n- [Agent frameworks and memory management (LangGraph and friends) — blueprint 4.9%](https://docs.claude.com/en/api/agent-sdk/overview)\n  - Key facts\n    - Framework landscape: Claude Agent SDK (Anthropic; Claude Code's loop as a library), LangGraph (graph of nodes/edges with explicit state, checkpoints, human-in-the-loop interrupts), LangChain agents, CrewAI (role-based crews), AutoGen (conversational multi-agent), plus DIY loops on the Messages API.\n    - Anthropic's guidance: frameworks are fine to start but add abstraction that hides prompts and responses; understand the underlying calls; prefer the simplest thing that works.\n    - LangGraph concepts worth recognising: state (typed dict), nodes (functions/LLM calls), edges (conditional routing), checkpointer (persist state between steps → resumability and time travel), interrupt() for human approval — maps to the workflow patterns (routing = conditional edge; orchestrator = node that fans out).\n    - Memory management: short-term = the context window (manage with summarisation, context editing/compaction); working memory = scratchpad files or state objects; long-term = retrieval store (vector/keyword DB), a memory tool, or Claude Code's auto memory; episodic = session logs. Write durable facts to persistent storage before compaction.\n    - Deployment models: in-process library (Agent SDK), headless CLI in CI (claude -p), hosted Managed Agents (Anthropic-run sandbox, session-hour pricing), your own container with the SDK; choose by control vs operations burden.\n    - Manager hierarchies: orchestrator delegates to workers (subagents) with narrow briefs and restricted tools; results summarised back; depth and concurrency limits prevent runaway trees.\n  - ⚠ Exam traps\n    - A framework doesn't change the fundamentals: stateless API, tool loop, context budget.\n    - Checkpointing/persistence is what makes long-running agents resumable — in the Agent SDK that is sessions; in LangGraph a checkpointer.\n    - Long-term memory lives outside the context window (files, DB, memory tool).\n\n## ❓ Self-check\n\n- Nightly job: summarise each PR, label it, post to Slack. Agent or workflow?\n  - → Workflow (chaining + maybe routing). Steps are fixed and known.\n- An agent keeps calling the same tool forever. First fix?\n  - → Max-turn / loop-detection guard; then improve tool result messages so the model sees the outcome.\n- Support tickets in three categories need different handling. Pattern?\n  - → Routing — cheap classifier, then specialised prompt (and model) per class.\n- You need a quality score you can trust for an essay grader. Pattern?\n  - → Parallelisation (voting) — several independent graders, aggregate.\n- Refactor touching an unknown number of files. Pattern?\n  - → Orchestrator–workers — the lead decides sub-tasks dynamically.\n- Translation must be polished until a critic is satisfied. Pattern and guard?\n  - → Evaluator–optimizer with an iteration cap.\n- What does a subagent share with its parent?\n  - → Nothing but the brief and the returned summary — it has its own context window.\n- Where should human approval sit for a 'delete namespace' tool?\n  - → Before execution — a permission callback or hook, not a post-hoc review.\n- Tool vs Skill?\n  - → A tool performs an action via a schema; a Skill is packaged instructions/resources Claude loads to know how to do something.\n- What does the Agent SDK give you over the Messages API?\n  - → The tool loop, built-in file/bash tools, permissions, context compaction, MCP, subagents, hooks, sessions.\n\n## ⚠ Traps to drill\n\n- Predictable multi-step task — agent or workflow?\n  - → Workflow. Agents only when the path is unknown in advance.\n- Five workflow patterns?\n  - → Chaining, routing, parallelisation (sectioning/voting), orchestrator–workers, evaluator–optimizer.\n- Subagent context?\n  - → Its own window — isolation and focus, but extra tokens and only a summary returns.\n- Human-in-the-loop placement?\n  - → Before destructive/irreversible actions.\n- Who decides sub-tasks in orchestrator–workers vs parallelisation?\n  - → Orchestrator: the model. Parallelisation: your code.\n- Agent loops forever — first guard?\n  - → Max turns / loop detection; then better tool results.\n\n## 🗒 Cheat sheet\n\n- Workflow = code-defined path (predictable, testable, cheap). Agent = model-chosen path in a loop (open-ended only). Simplest thing first.\n- Patterns: chaining (gates between steps) · routing (classify→specialist) · parallel (sectioning / voting) · orchestrator–workers (model plans) · evaluator–optimizer (cap it)\n- Agent guards: clear stop condition, max\\_turns, cost budget, loop detection, strict tool schemas + is\\_error, approval before side effects, compaction\n- Agent SDK = Claude Code's loop as a library: built-in tools, permissions, compaction, MCP, subagents, hooks, sessions; allowed\\_tools / permission\\_mode / max\\_turns\n- Subagent = own context window, own prompt/tools, returns summary; costs more; good for isolation and parallelism\n- Server tools (web search/fetch, code exec) run on Anthropic's side; Skills = SKILL.md folders of know-how, loaded progressively; MCP = standard plug for external tools\n\n## ☑ Chapter checklist\n\n- Can name and sketch the five
