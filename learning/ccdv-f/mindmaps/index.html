const MAPS = {"master":"# CCDV-F — Claude Certified Developer, Foundations\n\n## Exam facts\n\n- 53 questions · 120 min\n- Pass 720 / 1000 scaled\n- USD 125 · valid 12 months\n- Retakes: 14 / 30 / 90 days · max 4 in 12 months\n- Reschedule ≥ 24 h before\n- Tue 3 Nov 2026 · check-in 10:00 · start 10:30 IST\n\n## Exam domains (weights)\n\n- Applications & Integration — 33.1%\n  - Ch 1: Messages API foundations\n  - Ch 2: Tool use, prompt caching, batches and production plumbing\n- Model Selection & Optimisation — 16.8%\n  - Ch 3: Model selection, cost optimisation, prompt and context engineering\n- Agents & Workflows — 14.7%\n  - Ch 4: Agents and workflows\n- Prompt & Context Engineering — 11%\n  - Ch 3: Model selection, cost optimisation, prompt and context engineering\n- Tools & MCPs — 10.6%\n  - Ch 2: Tool use, prompt caching, batches and production plumbing\n  - Ch 5: Tools and MCP\n- Security & Safety — 8.1%\n  - Ch 7: Security, safety, evals, testing and debugging\n- Claude Code — 3.1%\n  - Ch 6: Claude Code mastery (on your real project)\n- Eval, Testing & Debugging — 2.6%\n  - Ch 7: Security, safety, evals, testing and debugging\n\n## Chapters (9 weeks)\n\n- 0 · Setup, accounts and the eligibility gate (09-05 → 09-06)\n  - Everything administrative is out of the way so that from Chapter 1 every session is pure learning.\n  - 53 Qs · 120 min · pass 720/1000 scaled · valid 12 months · USD 125 · retakes 14/30/90 days, max 4 in 12 months · reschedule ≥24 h before\n  - Weights: AI 33.1 · MSO 16.8 · AW 14.7 · PCE 11.0 · TM 10.6 · SS 8.1 · CC 3.1 · ETD 2.6\n  - Check-in 10:00 IST, start 10:30 IST, Tue 3 Nov 2026 — ID on desk, phone away, single monitor\n- 1 · Messages API foundations (09-07 → 09-13)\n  - Read any Messages request or response and explain every field; build a streaming, multi-turn, multimodal chat client.\n  - Required: model, max\\_tokens, messages. system is top-level. Roles alternate, first is user.\n  - stop\\_reason: end\\_turn · max\\_tokens (truncated) · stop\\_sequence · tool\\_use · refusal (HTTP 200) · pause\\_turn (send back) · model\\_context\\_window\\_exceeded\n  - usage: input\\_tokens, output\\_tokens, cache\\_creation\\_input\\_tokens, cache\\_read\\_input\\_tokens\n  - Stream events: message\\_start → content\\_block\\_start/delta/stop → message\\_delta (stop\\_reason, output usage) → message\\_stop\n  - Force shape: instruction < prefill '{' + stop\\_sequences (legacy, 400 on 4.6+) < forced tool with input\\_schema < structured outputs output\\_config.format (check stop\\_reason before parsing)\n  - Images: base64/URL/file blocks, JPEG/PNG/GIF/WebP, ≤10 MB, tokens ≈ (w/28)×(h/28); PDFs as document blocks (text + page images), 32 MB, 600 pages (100 on 200K models)\n  - Stateless API: resend full history each call → context grows → cache the prefix, summarise old turns\n- 2 · Tool use, prompt caching, batches and production plumbing (09-14 → 09-20)\n  - Run the tool-use loop from memory, cut cost with caching and batches, and make a client that survives 429s and 529s.\n  - Tool loop: tools + messages → stop\\_reason tool\\_use → run it yourself → user msg with tool\\_result(tool\\_use\\_id, content, is\\_error?) → repeat until end\\_turn\n  - tool\\_choice: auto (default) · any (must use some) · tool:{name} (must use that) · none; disable\\_parallel\\_tool\\_use for one-at-a-time\n  - Parallel calls: several tool\\_use blocks → all results in ONE user message\n  - Cache: cache\\_control ephemeral on a block; prefix = tools→system→messages up to it; min 512–4,096 tokens by model (Sonnet 5 = 1,024, Haiku 4.5 = 4,096); TTL 5 min (refreshes) or 1 h; write 1.25×/2×, read 0.1×; ≤4 breakpoints; reads free vs ITPM\n  - Batches: custom\\_id per request, up to 100k reqs, ≤24 h, 50% off, results 29 days, join on custom\\_id, types succeeded/errored/canceled/expired\n  - Errors: 400 yours · 401 key · 413 too large · 429 rate limit (retry-after) · 500 api · 529 overloaded; SDK retries 408/409/429/5xx ×2\n  - Rate limits per org per model: RPM, ITPM, OTPM; tiers grow with spend\n- 3 · Model selection, cost optimisation, prompt and context engineering (09-21 → 09-27)\n  - Pick the right model and the cheapest configuration for a workload, and write prompts the Anthropic way. This chapter is ~28% of the exam.\n  - Haiku = volume/classify/route · Sonnet = default apps/coding/agents · Opus = hardest reasoning/orchestration. Smallest model that passes the eval.\n  - Cost ladder: trim → cache → batch → smaller model → less thinking. Measure with usage + count\\_tokens. Output ≈ 5× input price.\n  - Technique order: clear & direct → examples → let it think → XML tags → role (system) → prefill → chain prompts → long-context tips\n  - Thinking: manual budget\\_tokens ≥1024 and < max\\_tokens (Haiku 4.5) · adaptive + effort low/medium/high/xhigh/max on 4.6+ (default high) · billed as output · no prefill · pass thinking blocks back with tools\n  - Long context: docs first in tags, question last, ask for quotes; lost-in-the-middle → important stuff at start/end\n  - Context mgmt: summarise old turns, keep last N, RAG for facts, stable prefix cached, volatile last; context editing/compaction on newer models\n  - Pin IDs in prod (dated pre-4.6, dateless-but-pinned 4.6+); aliases for experiments; ≥60 days deprecation notice; 3.x retired; same models on Bedrock / Vertex / Foundry with platform IDs\n- 4 · Agents and workflows (09-28 → 10-04)\n  - Choose between a single call, a workflow and an agent for any scenario; name the five patterns; build a guarded agent with the Agent SDK.\n  - Workflow = code-defined path (predictable, testable, cheap). Agent = model-chosen path in a loop (open-ended only). Simplest thing first.\n  - Patterns: chaining (gates between steps) · routing (classify→specialist) · parallel (sectioning / voting) · orchestrator–workers (model plans) · evaluator–optimizer (cap it)\n  - Agent guards: clear stop condition, max\\_turns, cost budget, loop detection, strict tool schemas + is\\_error, approval before side effects, compaction\n  - Agent SDK = Claude Code's loop as a library: built-in tools, permissions, compaction, MCP, subagents, hooks, sessions; allowed\\_tools / permission\\_mode / max\\_turns\n  - Subagent = own context window, own prompt/tools, returns summary; costs more; good for isolation and parallelism\n  - Server tools (web search/fetch, code exec) run on Anthropic's side; Skills = SKILL.md folders of know-how, loaded progressively; MCP = standard plug for external tools\n- 5 · Tools and MCP (10-05 → 10-11)\n  - Explain MCP's architecture and primitives, build and register your own server, and know when plain tool use is the better choice.\n  - MCP = JSON-RPC protocol; host (app) → client (1 per server) → server. Lifecycle: initialize (version + capabilities) → operate → shutdown\n  - Transports: stdio (local child process) · Streamable HTTP (remote, OAuth 2.1, SSE streaming). Old HTTP+SSE deprecated\n  - Primitives: tools (model-controlled; tools/list, tools/call) · resources (app-controlled; URIs; resources/read) · prompts (user-controlled; prompts/get). Client side: roots, sampling, elicitation\n  - Claude Code: claude mcp add; scopes local (~/.claude.json) < project (.mcp.json, committed) < user; /mcp; tools = mcp\\_\\_server\\_\\_tool\n  - API MCP connector: mcp\\_servers=\\[{type:url,...}\\] beta; remote HTTP only; tools only; executed server-side\n  - Plain tools: one app, you run the loop. MCP: reuse across clients, discovery, third-party. Skills: know-how, not actions\n  - Security: tool poisoning, rug pull, confused deputy, token passthrough; least privilege, roots, consent, validation, approval for side effects\n- 6 · Claude Code mastery (on your real project) (10-12 → 10-18)\n  - Turn daily Claude Code use into exam-grade knowledge of memory, settings, hooks, subagents, headless mode and CI. Only ~3% of the exam — keep it to the schedule and do not over-invest.\n  - Memory: ~/.claude/CLAUDE.md (user) → ./CLAUDE.md (project, committed) → ./CLAUDE.local.md (personal); @imports; /memory; /init\n  - Settings precedence: managed > CLI flags > .claude/settings.local.json > .claude/settings.json > ~/.claude/settings.json\n  - Extend: commands (.claude/commands, user-invoked, $ARGUMENTS) · skills (.claude/skills/\\*/SKILL.md, model-invoked) · hooks (settings, enforcement) · subagents (.claude/agents, own context) · MCP · plugins\n  - Hooks: PreToolUse/PostToolUse/Stop/UserPromptSubmit/SessionStart/PreCompact…; JSON on stdin; exit 0 ok, exit 2 block (+stderr to Claude), exit 1 non-blocking; default timeout 600 s\n  - Modes: default · acceptEdits · plan (read-only) · bypassPermissions (sandbox only); deny rules win\n  - Headless: claude -p, --output-format json|stream-json, --allowedTools, --max-turns, --resume; GitHub Action anthropics/claude-code-action\n  - /compact summarise · /clear wipe · /cost (=/usage) tokens+USD · /context · /model · /effort · /permissions · /mcp · /agents · /review (=/code-review) · /resume · /fork\n- 7 · Security, safety, evals, testing and debugging (10-19 → 10-25)\n  - Threat-model any Claude application and name the defence; build an eval you trust; debug from stop\\_reason, usage and traces. First timed practice exam.\n  - Threats: direct/indirect injection · exfiltration · excessive agency · prompt leak · jailbreak · insecure output handling (OWASP LLM Top 10)\n  - Defence in depth: model safety → prompt design → validation in/out → tool least privilege + hooks → human approval → logging. Prompt ≠ security boundary\n  - External content (docs, web, tool results, MCP descriptions) = untrusted data; fence in tags; allow-list destinations; scoped creds; no secrets in context\n  - Safety: stop\\_reason refusal → handle, don't retry; usage policy → high-risk uses need human oversight; moderation = Haiku few-shot temp 0 pre/post screen\n  - Evals: criteria first → cases (input, expected, edge + adversarial) → graders: code (exact/regex) · LLM judge + rubric (subjective, temp 0) · human (gold) → run on every change, Batches for cost\n  - Debug: stop\\_reason → usage vs window → tool trace (ids, is\\_error, loops) → prompt; reproduce at temp 0; log request ids; add regression case\n- 8 · Practice exams and final revision (10-26 → 11-02)\n  - Three practice exams at 80%+, every domain above 75%, cheat sheet internalised, logistics done.\n  - Answer keys: cheapest → cache/batch/Haiku · structure → forced tool/schema · team-shared → project scope · must-always → hook · unknown steps → agent · external content → untrusted · destructive → approve first\n  - Eliminate wrong-problem answers: temperature≠length, streaming≠cost, batch≠chat, bigger model≠prompt fix\n  - 2:15 per question; flag at 3 min; count selections on multi-response\n- ★ · Exam day — Tue 3 Nov 2026 (11-03 → 11-03)\n\n## Method\n\n- 1.5 h/day: 45 min read, 45 min build\n- Build every lab with Claude Code on the real project\n- Sunday: notes file, self-check, domain quiz, retrospective\n- Every morning: clear due traps (2–5 min)\n- Weakest domain gets the gap day (28 Oct)\n- Go / no-go by 2 Nov morning: ≥80% weighted, no domain <70%\n\n## Answer keys (scenario questions)\n\n- cheapest → cache / batch / Haiku\n- structure → forced tool / structured outputs\n- team-shared → project scope (.mcp.json, settings.json)\n- must always → hook, not CLAUDE.md\n- unknown number of steps → agent / orchestrator\n- external content → untrusted data\n- destructive action → human approval first\n- temperature ≠ length · streaming ≠ cost · batch ≠ chat\n\n## All traps\n\n- Ch 0\n  - The pass mark is 720 — is that 72% of questions right?\n    - → No. 720 is a scaled score on 100–1000; raw percentage needed is unknown, so target 80%+ on practice exams.\n  - Retake waits after a 1st, 2nd, 3rd fail?\n    - → 14, 30, 90 days; max four attempts in a rolling 12 months; USD 125 each. Reschedule ≥24 h before.\n  - Which domain deserves the most study time?\n    - → Applications & Integration at 33.1% — Messages API, tools, caching, batches, streaming, errors.\n- Ch 1\n  - Answer cut off mid-sentence.\n    - → stop\\_reason=max\\_tokens — raise max\\_tokens; temperature has nothing to do with length.\n  - Where is the system prompt sent?\n    - → Top-level system parameter — never as a message with role 'system'.\n  - Does streaming reduce cost or total latency?\n    - → No. It improves perceived latency only; tokens billed are identical.\n  - Prefill lives in which role and position?\n    - → Assistant role, as the final message; Claude continues from it (legacy — 400 on Claude 4.6+; use structured outputs).\n  - response.content is a string?\n    - → No — a list of blocks (text, tool\\_use, thinking). Iterate, don't index blindly.\n  - Which parameter is required besides model and messages?\n    - → max\\_tokens.\n- Ch 2\n  - Who runs a client-side tool?\n    - → Your code. Claude only returns a tool\\_use block with name and input.\n  - Which role carries tool\\_result blocks?\n    - → user. One message, one tool\\_result per tool\\_use, ids must match.\n  - Order of content in the cached prefix?\n    - → tools → system → messages. Change anything before the breakpoint and the cache is invalidated.\n  - Does caching cut output tokens?\n    - → No — only input cost and time-to-first-token. Output is priced the same.\n  - Batch API for a chatbot?\n    - → Never — asynchronous, up to 24 h. Batch = bulk, offline, 50% cheaper.\n  - Minimum cacheable prefix length?\n    - → Model-dependent: 512 (Opus 5) · 1,024 (Sonnet 5/4.5) · 2,048 (Opus 4.7) · 4,096 (Haiku 4.5, Opus 4.5/4.6); shorter is silently not cached.\n  - tool\\_choice value that forces one specific tool?\n    - → {type:'tool', name:'...'}; 'any' forces some tool; 'auto' is default; 'none' disables.\n  - 429 vs 529?\n    - → 429 rate limit (your volume, honour retry-after); 529 overloaded (Anthropic side, back off with jitter).\n- Ch 3\n  - Cheapest quick win for a high-volume prompt with a big stable system prompt?\n    - → Prompt caching (then batch if offline, then a smaller model). Not temperature.\n  - Thinking tokens are billed as…\n    - → Output tokens, at output price; budget\\_tokens < max\\_tokens.\n  - First prompt-engineering technique to try?\n    - → Be clear and direct with success criteria — before few-shot, CoT or role.\n  - Long document placement?\n    - → Top of the prompt in <document> tags; question last; ask for quotes first.\n  - Alias vs dated model ID in prod?\n    - → Dated ID. Aliases move to new snapshots without warning.\n  - Which tier for classification at scale?\n    - → Haiku — smallest model that passes the eval; route hard cases upward.\n  - Temperature changes cost or length?\n    - → Neither. Randomness only.\n- Ch 4\n  - Predictable multi-step task — agent or workflow?\n    - → Workflow. Agents only when the path is unknown in advance.\n  - Five workflow patterns?\n    - → Chaining, routing, parallelisation (sectioning/voting), orchestrator–workers, evaluator–optimizer.\n  - Subagent context?\n    - → Its own window — isolation and focus, but extra tokens and only a summary returns.\n  - Human-in-the-loop placement?\n    - → Before destructive/irreversible actions.\n  - Who decides sub-tasks in orchestrator–workers vs parallelisation?\n    - → Orchestrator: the model. Parallelisation: your code.\n  - Agent loops forever — first guard?\n    - → Max turns / loop detection; then better tool results.\n- Ch 5\n  - Resources vs tools?\n    - → Tools = model-called actions. Resources = data the application reads into context. Prompts = user-invoked templates.\n  - Which MCP scope do you commit?\n    - → Project (.mcp.json). Local is per-user per-project; user is all projects.\n  - Transport for a remote server?\n    - → Streamable HTTP (with OAuth). stdio is local child processes only.\n  - Host / client / server?\n    - → Host = app; client = one connection per server inside the host; server = capability provider.\n  - MCP tool result trust level?\n    - → Untrusted input — possible prompt injection; validate, fence, never let it change permissions.\n  - API MCP connector executes tools where?\n    - → Server-side by the API; you get mcp\\_tool\\_use/mcp\\_tool\\_result blocks and run nothing.\n- Ch 6\n  - 'Must always run the linter after edits' — CLAUDE.md or hook?\n    - → Hook (PostToolUse). CLAUDE.md is guidance; hooks are enforcement.\n  - /compact vs /clear?\n    - → /compact summarises and continues; /clear wipes the context.\n  - Which settings file is committed for the team?\n    - → .claude/settings.json. settings.local.json is personal; ~/.claude/settings.json is user-wide.\n  - Hook exit code that blocks?\n    - → 2 — stderr goes back to Claude. 0 continues.\n  - Subagent cost?\n    - → Extra tokens — separate context window; only a summary returns.\n  - bypassPermissions where?\n    - → Sandboxed containers only.\n- Ch 7\n  - Fetched web content / tool results are…\n    - → Untrusted data — fence it, restrict tools, approve side effects. Not fixed by a stronger system prompt alone.\n  - LLM-as-judge for exact values?\n    - → No — code graders for exact/format checks; judge for subjective quality.\n  - Secrets in the system prompt?\n    - → Never — prompts can leak; use env/secret manager.\n  - When to run evals?\n    - → On every prompt/model/tool change, same case set, track pass rate; use Batches for cost.\n  - Debug order?\n    - → stop\\_reason → usage → tool trace → prompt.\n  - Human approval timing?\n    - → Before destructive/irreversible actions.\n- Ch 8\n  - Time per question?\n    - → ≈2 min 15 s; flag at 3 min; first pass 75 min, review 30.\n  - Reschedule rule?\n    - → If practice < 80% on 31 Oct, reschedule ≥24 h before the appointment; a fail = USD 125 + 14-day wait (then 30, then 90; max 4 attempts/12 months).\n","ch0":"# Chapter 0 — Setup, accounts and the eligibility gate\n\n## 🎯 Goal\n\n- Everything administrative is out of the way so that from Chapter 1 every session is pure learning.\n\n## 📅 Daily plan\n\n- 09-05 · Partner Academy account with your UST email (amit.phadke@ust.com); download the official Exam Guide PDF\n  - Build: Copy the 8 domain weights into your notes\n    - Register with your UST email amit.phadke@ust.com (partner-organisation status unlocks the exam guide and the free prep course — if UST is not listed as a partner, register anyway and use the public Claude Academy course instead).\n    - Download the Exam Guide PDF and store it in the lab repo under docs/.\n    - Copy the domain table into notes/00-exam-guide.md: domain, weight, and the task statements under each.\n    - Highlight every verb in the task statements (\"select\", \"implement\", \"troubleshoot\") — these tell you how questions are framed.\n  - ✔ Done when: notes/00-exam-guide.md exists with all 8 domains, their weights and task statements.\n  - Read\n    - [Official CCDV-F Exam Guide (Anthropic PDF)](https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542875%2FClaude+Certified+Developer+%E2%80%93+Foundations+Exam+Guide.pdf)\n    - [Partner Academy — register and find the prep course](https://anthropic-partners.skilljar.com)\n    - [Community blueprint page (weights, sub-skills)](https://claudecertificationguide.com/ccdv-f)\n- 09-05 · Claude Console: create API key, load $10–20 credit, find the usage dashboard\n  - Build: Store key in .env, never commit\n    - Create an organisation and a workspace named ccdvf-lab so spend is isolated.\n    - Create one API key; name it by machine (macbook-air) so you can revoke it later.\n    - Add $10–20 of credit; set a monthly spend limit on the workspace.\n    - Open Usage and Cost pages — note where per-model token counts appear; you will reconcile against them in Chapter 2.\n  - ✔ Done when: Key in .env, .env in .gitignore, spend limit set, you can point at the usage dashboard.\n  - Read\n    - [Claude Console](https://platform.claude.com)\n    - [API getting started](https://docs.claude.com/en/api/overview)\n- 09-06 · Local lab: git repo, Python venv, pip install anthropic mcp python-dotenv\n  - Build: hello.py — first client.messages.create() call\n    - mkdir ccdvf-lab && git init; python3 -m venv .venv && source .venv/bin/activate\n    - pip install anthropic mcp python-dotenv pytest; pip freeze > requirements.txt\n    - Write hello.py: load .env, create Anthropic(), send one message, print response.content\\[0\\].text, stop\\_reason and usage.\n    - Commit. Open the repo in Claude Code (claude) and ask it to add a README describing the lab layout.\n  - ✔ Done when: hello.py prints a reply plus stop\\_reason=end\\_turn and a usage object; first commit pushed.\n  - Read\n    - [Python SDK quickstart](https://docs.claude.com/en/api/client-sdks)\n- 09-06 · Confirm Pearson VUE booking details: name matches ID, phone is +91, run OnVUE system test\n  - Build: Screenshot the confirmation\n    - Log in to Pearson VUE; open the appointment; check the candidate name is exactly as printed on the ID you will show.\n    - Correct the phone number to +91 format.\n    - Run the OnVUE system test on the same laptop, same room, same network you will use on exam day.\n    - Save the confirmation email as PDF into docs/ and note the check-in link.\n  - ✔ Done when: System test passed; confirmation screenshot saved; name and phone verified.\n  - Read\n    - [Pearson VUE — Anthropic testing](https://www.pearsonvue.com/us/en/anthropic.html)\n\n## 📖 Study material\n\n- Exam facts\n  - 53 questions, multiple-choice and multiple-response (each item says how many to select). Scenario-heavy: most stems describe a situation and ask for the best next step.\n  - 120 minutes of exam time; the 135-minute booking includes NDA and tutorial.\n  - Pass = 720 scaled on a 100–1000 scale (not a raw 72%). Scaling means some items count more than others; you cannot game it, so aim for 80%+ on practice.\n  - USD 125 per attempt; credential valid 12 months. Retake waits: 14 days after the 1st fail, 30 after the 2nd, 90 after the 3rd; maximum four attempts in a rolling 12 months.\n  - Reschedule or cancel at least 24 hours before the appointment. Renewal is a free, non-proctored Partner Academy assessment; a lapsed credential means a full retake.\n  - Target audience per the guide: 1–5 years software experience, 6+ months hands-on Claude, Python/TypeScript, REST, CLI, MCP — i.e. it tests engineering judgement as much as API trivia.\n- Domain weights and sub-skills (from the official exam guide)\n  - Applications & Integration · 33.1% · 17–18 · Understanding Requirements 3.4 · Systems Life Cycle 2.8 · Claude API Mechanics 6.8 · Software Engineering Foundations 7.4 · Claude Application Design 8.6 · Configuration Management 4.1 · Ch 1, 2 + Library gap entries\n  - Model Selection & Optimisation · 16.8% · 9 · LLM Fundamentals 5.2 · Technical Fundamentals (SDK integration, websockets) 6.1 · Model Selection & Trade-offs 2.7 · Cost & Token Management 2.8 · Ch 3\n  - Agents & Workflows · 14.7% · 8 · Agent Architecture 4.5 · Agent Construction (Agent SDK, custom loops, deployment) 5.3 · Agent Patterns (LangGraph etc., memory) 4.9 · Ch 4\n  - Prompt & Context Engineering · 11.0% · 6 · Context Engineering 3.8 · Prompt Engineering 4.6 · Output Handling (structured output, validation, defensive parsing) 2.6 · Ch 3\n  - Tools & MCPs · 10.6% · 5–6 · Tool Implementation 4.4 · MCP Server Development 2.1 · Agentic Customization (tools vs Skills vs MCP) 4.1 · Ch 2, 5\n  - Security & Safety · 8.1% · 4 · AI Application Security 3.2 · Guardrails & Safe Deployment 2.3 · Claude Hooks 1.0 · Identity & Secrets 1.6 · Ch 7 (+6)\n  - Claude Code · 3.1% · 1–2 · Rules, Skills, Commands, Agents, Agent Memory; sessions, slash commands, headless/streaming · Ch 6\n  - Eval, Testing & Debugging · 2.6% · 1–2 · Error identification, recovery strategies, trace analysis · Ch 7\n- 💡 Tip\n  - Effort allocation: Chapters 1–3 cover about 61% of the exam.\n  - If you fall behind, protect those and compress Chapter 6 (Claude Code is ~2 questions, and you use it daily).\n  - Note that roughly 22 points of the biggest domain are general engineering (requirements, life cycle, SE foundations, application design) — the five \"blueprint gap\" entries in the Library cover them; read them in Chapters 1 and 3.\n- The three official sample questions\n  - Domain 2 — 10,000 documents to process overnight cost-effectively → Message Batches API (asynchronous, within 24 h, reduced cost).\n  - Domain 7 — hidden text in a document tries to redirect the model → treat content as untrusted, isolate it from trusted instructions, use guardrails/hooks.\n  - Domain 8 — make an inventory REST API reusable across several apps → build an MCP server exposing the operations as tools.\n  - Pattern: every sample rewards the Anthropic-recommended architecture, not the cleverest one.\n- Daily routine (1.5 h)\n  - 45 min learn from the docs or course → 45 min build the day's lab. Each day below has a Read list, numbered Steps and a Done when line — tick the day only when that line is true.\n  - Build every lab with Claude Code, not by hand — end each session with /cost and note tokens used.\n  - Keep one notes/<domain>.md per chapter; it becomes your revision sheet in Chapter 8.\n  - Sunday = review day: finish the notes file, do the chapter Self-check, take the domain quiz in the Question bank tab, fill the Weekly retrospective.\n  - Every day, before anything else: open the Trap review tab and clear what is due (2–5 minutes).\n- Lab repo layout\n\n## 📚 Library digests\n\n- [Official CCDV-F Exam Guide (Anthropic)](https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542875%2FClaude+Certified+Developer+%E2%80%93+Foundations+Exam+Guide.pdf)\n  - Key facts\n    - Credential: Claude Certified Developer – Foundations, code CCDV-F. 53 items (multiple-choice and multiple-response), 120 minutes, proctored online or test centre, pass 720 on a 100–1,000 scale, USD 125, valid 12 months from award.\n    - Target audience: technical professionals who build, integrate and ship production-grade AI solutions; 1–5 years software experience, 6+ months hands-on Claude/LLM experience, Python and/or TypeScript, REST APIs, CLI tools, LLM fundamentals, agents, context management, MCP. No mandatory prerequisites.\n    - Domain 1 Agents and Workflows 14.7%: Agent Architecture 4.5% (patterns, manager hierarchies, workflow-vs-agent decisions); Agent Construction 5.3% (Claude Agent SDK, custom loops, deployment models); Agent Patterns 4.9% (design patterns, frameworks such as LangGraph, memory management).\n    - Domain 2 Applications and Integration 33.1%: Understanding Requirements 3.4%; Systems Life Cycle 2.8%; Claude API Mechanics 6.8% (messages, tools, streaming, vision, caching, batch); Software Engineering Foundations 7.4% (REST APIs, JSON, version control, refactoring); Claude Application Design 8.6% (interface interpretation, schema design, session hygiene); Configuration Management 4.1% (CLAUDE.md, settings.json, model versioning).\n    - Domain 3 Claude Code 3.1%: core components — rules, skills, commands, agents, agent memory; features — session management, slash commands, headless/streaming modes.\n    - Domain 4 Eval, Testing and Debugging 2.6%: error identification, recovery strategies, trace analysis for failure modes.\n    - Domain 5 Model Selection and Optimization 16.8%: LLM Fundamentals 5.2% (tokens, context windows, sampling, prompting techniques); Technical Fundamentals 6.1% (SDK integration, websockets); Model Selection and Trade-offs 2.7% (Opus/Sonnet/Haiku, quality vs latency vs cost); Cost and Token Management 2.8% (token tracking, caching strategies).\n    - Domain 6 Prompt and Context Engineering 11.0%: Context Engineering 3.8% (context drift prevention, subagent isolation); Prompt Engineering 4.6% (instruction clarity, few-shot, iterative refinement); Output Handling 2.6% (structured output, validation, defensive parsing).\n    - Domain 7 Security and Safety 8.1%: AI Application Security 3.2% (prompt injection, jailbreak defence, PII); Guardrails and Safe Deployment 2.3% (content policy, secure-by-design); Claude Hooks 1.0% (guardrails preventing destructive actions); Identity and Secrets Management 1.6%.\n    - Domain 8 Tools and MCPs 10.6%: Tool Implementation 4.4% (function calling, tool descriptions, agentic patterns); MCP Server Development 2.1% (authoring, deployment, communication patterns); Agentic Customization 4.1% (trade-offs among tools, Skills and MCPs).\n    - Preparation: self-assess against the blueprint; review official docs (API, models, prompt engineering, Claude Code, Skills, MCP); build and operate a real Claude application with tools, prompt/context engineering and security practices; practise prompts, agents, Claude Code configuration, token management, guardrails, custom tools/MCPs; study the sample questions.\n    - Sample 1 (Domain 2): 10,000 documents overnight, cost-effectively → Message Batches API (asynchronous, within 24 h, reduced cost). Sample 2 (Domain 7): hidden prompt-injection text → treat content as untrusted, isolate from trusted instructions, use guardrails/hooks. Sample 3 (Domain 8): make an inventory REST API reusable across apps → build an MCP server exposing the operations as tools.\n    - Retakes: wait 14 days after the 1st fail, 30 days after the 2nd, 90 days after the 3rd; maximum four attempts in a rolling 12 months; USD 125 per attempt.\n    - Conduct: valid government photo ID with name matching registration; no phones, notes, second monitors or recording; stay in webcam view; 24-hour cancellation/reschedule deadline; confidentiality agreement before the exam; cheating or content disclosure = invalidation, revocation and ban.\n    - Maintenance: renewal is a free, non-proctored assessment on the Partner Academy covering changes since certification; a lapsed credential needs a full retake at full fee. Name corrections: certifications-support@anthropic.com; scheduling/accommodations/results: Pearson VUE; appeals within 14 days.\n  - ⚠ Exam traps\n    - The 24-hour reschedule deadline is the real go/no-go cut-off — decide by the morning of 2 Nov at the latest, not on 3 Nov.\n    - Second and third fails cost 30 and 90 days of waiting — the first attempt is the cheap one to get right.\n    - Roughly a quarter of the exam (Requirements, Life Cycle, SE Foundations, App Design) is general engineering judgement, not Claude API trivia.\n- [Courses: Claude Academy, Partner Academy, Skilljar MCP course, cookbook](https://academy.claude.com)\n  - Key facts\n    - Claude Academy (academy.claude.com): free video courses with quizzes — 'Claude Platform 101' (models, console, pricing, prompting basics) and 'Building with the Claude API' (messages, streaming, tools, caching, batches, vision, evals). Run every sample in your own lab instead of the notebook.\n    - Partner Academy (anthropic-partners.skilljar.com): partner-organisation portal — exam guide, official CCDV-F prep course and quizzes, renewal assessment. Register with your UST email; if UST is not a listed partner, fall back to the public Academy.\n    - Introduction to MCP (anthropic.skilljar.com): architecture, primitives, building a server with the Python SDK, Inspector, connecting to Claude Desktop/Code.\n    - GitHub: anthropics/courses (API fundamentals, prompt engineering, tool use, evaluations notebooks); anthropic-cookbook patterns/agents (chaining, routing, parallelisation, orchestrator, evaluator code); prompt-eng-interactive-tutorial (9 chapters with exercises).\n    - Console (platform.claude.com): Workbench (prompt generator/improver, compare runs), Usage and Cost pages (per model, per key), spend limits, API keys, workspaces.\n    - Community: claudecertificationguide.com (blueprint mirror, free practice questions); Udemy practice tests (optional, quality varies — treat as timing practice, verify answers against the docs).\n  - ⚠ Exam traps\n    - Official prep = Partner Academy course + docs; community practice sets are for timing, not truth.\n    - Run the course code in your lab with /cost open — the exam asks about token/cost behaviour you only notice by measuring.\n- [Pearson VUE / OnVUE logistics](https://www.pearsonvue.com/us/en/anthropic.html)\n  - Key facts\n    - Booking: name on the Pearson VUE profile must match the government photo ID exactly; keep the phone in +91 format; confirmation email carries the check-in link.\n    - OnVUE (online proctored): run the system test on the same laptop, room and network you will use; install the OnVUE app the day before; check-in opens 30 minutes before (10:00 IST for a 10:30 start) — photo of ID, room scan, no second monitor, phone out of reach, nobody enters the room.\n    - Reschedule/cancel at least 24 hours before the appointment (per the exam guide); Pearson VUE support handles scheduling, accommodations and results; appeals within 14 days.\n  - ⚠ Exam traps\n    - Decide go/no-go by the morning of 2 Nov — the 24-hour window is the hard line.\n    - Same laptop + same room + same network for the system test and the exam.\n\n## ❓ Self-check\n\n- What is the passing score and how is it expressed?\n  - → 720 on a scaled 100–1000 range — a scaled score, not a raw percentage.\n- How many questions and how long?\n  - → 53 questions in 120 minutes; the booking is 135 minutes including NDA and tutorial.\n- Which two domains together are roughly half the exam?\n  - → Applications & Integration (33.1%) and Model Selection & Optimisation (16.8%).\n- How long is the credential valid and what is the retake wait?\n  - → 12 months; 14 days after a failed attempt.\n\n## ⚠ Traps to drill\n\n- The pass mark is 720 — is that 72% of questions right?\n  - → No. 720 is a scaled score on 100–1000; raw percentage needed is unknown, so target 80%+ on practice exams.\n- Retake waits after a 1st, 2nd, 3rd fail?\n  - → 14, 30, 90 days; max four attempts in a rolling 12 months; USD 125 each. Reschedule ≥24 h before.\n- Which domain deserves the most study time?\n  - → Applications & Integration at 33.1% — Messages API, tools, caching, batches, streaming, errors.\n\n## 🗒 Cheat sheet\n\n- 53 Qs · 120 min · pass 720/1000 scaled · valid 12 months · USD 125 · retakes 14/30/90 days, max 4 in 12 months · reschedule ≥24 h before\n- Weights: AI 33.1 · MSO 16.8 · AW 14.7 · PCE 11.0 · TM 10.6 · SS 8.1 · CC 3.1 · ETD 2.6\n- Check-in 10:00 IST, start 10:30 IST, Tue 3 Nov 2026 — ID on desk, phone away, single monitor\n\n## ☑ Chapter checklist\n\n- Exam registered and paid (Tue 3 Nov 2026, 10:30 IST)\n- Pearson VUE profile: name exactly as on ID, phone corrected to +91\n- OnVUE system test passed on the laptop you will use\n- Claude Console API key working (hello.py returned a response)\n- Lab repo created on GitHub with .gitignore for .env\n- Claude Code installed and logged in (claude --version)\n- Bookmarked: docs.claude.com, academy.claude.com, Partner Academy\n\n","ch1":"# Chapter 1 — Messages API foundations\n\n## 🎯 Goal\n\n- Read any Messages request or response and explain every field; build a streaming, multi-turn, multimodal chat client.\n\n## Exam domains\n\n- Applications & Integration — 33.1%\n\n## 📅 Daily plan\n\n- 09-07 · Python for API work: dicts/JSON, f-strings, async/await, type hints, exceptions\n  - Build: Rewrite hello.py as a function with typed args\n    - Create ch1/client.py with def ask(prompt: str, system: str = \"\", model: str = \"claude-sonnet-4-5\", max\\_tokens: int = 512) -> str.\n    - Add an async twin using AsyncAnthropic and asyncio.gather to send three prompts concurrently; time both.\n    - Serialise the response with r.model\\_dump() and print it as pretty JSON — read every key.\n    - Wrap the call in try/except anthropic.APIError and print e.status\\_code and e.message.\n  - ✔ Done when: Sync and async versions both run; you can name every top-level key in the dumped response.\n  - Read\n    - [Python SDK README (sync vs async clients)](https://github.com/anthropics/anthropic-sdk-python)\n    - Library: sefoundations\n    - Library: requirements\n    - Python docs: asyncio basics, json module, dataclasses (30 min max)\n- 09-08 · Messages API anatomy: model, max\\_tokens, system, messages, roles, stop\\_reason, usage\n  - Build: chat.py — multi-turn loop that keeps message history\n    - chat.py: keep a messages list; append {role:user} from input, call the API, append the assistant reply, loop.\n    - Print stop\\_reason and usage after each turn; watch input\\_tokens grow every turn (stateless API).\n    - Set max\\_tokens=20 for one call and observe stop\\_reason=max\\_tokens and the truncated text.\n    - Try two user messages in a row without an assistant between — read the error, then fix by merging.\n  - ✔ Done when: A 5-turn conversation works and you can explain why input\\_tokens increase each turn.\n  - Read\n    - [Messages API reference](https://docs.claude.com/en/api/messages)\n    - [Working with messages (multi-turn, prefill)](https://docs.claude.com/en/docs/build-with-claude/working-with-messages)\n- 09-09 · Streaming: client.messages.stream, event types, text deltas, final message\n  - Build: Add streaming to chat.py; print token by token\n    - Use with client.messages.stream(...) as s: for text in s.text\\_stream: print(text, end=\"\").\n    - Then call s.get\\_final\\_message() and print usage — note that usage only arrives at the end.\n    - Log the raw events once (for event in s: print(event.type)) and record the order: message\\_start, content\\_block\\_start, content\\_block\\_delta…, content\\_block\\_stop, message\\_delta, message\\_stop.\n    - Handle a mid-stream error: set a tiny timeout and catch the exception cleanly.\n  - ✔ Done when: Streaming chat prints incrementally and still shows final usage; you can list the event sequence.\n  - Read\n    - [Streaming Messages](https://docs.claude.com/en/docs/build-with-claude/streaming)\n- 09-10 · Structured output: JSON instructions, structured outputs (output\\_config.format / strict tools), legacy prefill and stop\\_sequences, validating and retrying\n  - Build: Script that returns validated JSON and retries on parse failure\n    - ch1/extract.py: ask Claude to extract {name, severity, component} from an incident description as JSON only.\n    - Version A: instruction only (Sonnet 5). Version B: structured outputs — client.messages.parse(output\\_format=PydanticModel). Version C: a forced tool whose input\\_schema is the JSON shape (tool\\_choice type tool). Compare failure rates over 10 runs.\n    - Version D (legacy, on Haiku 4.5 which still allows it): assistant prefill \"{\" plus stop\\_sequences — note that prefill is a 400 on Claude 4.6+ but still appears in exam questions.\n    - Validate with json.loads plus a pydantic model; on failure, retry once with the error message appended; check stop\\_reason first (refusal / max\\_tokens).\n  - ✔ Done when: Script returns validated JSON 10/10 times; you can rank instruction < prefill (legacy) < forced tool < structured outputs and say why.\n  - Read\n    - [Structured outputs (JSON schema, strict tools)](https://docs.claude.com/en/docs/build-with-claude/structured-outputs)\n    - [Prompting best practices (format control, prefill status)](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices)\n    - [Working with messages (prefill, roles)](https://docs.claude.com/en/docs/build-with-claude/working-with-messages)\n- 09-11 · Vision and documents: image content blocks (base64 vs URL), PDF input, size limits\n  - Build: Send a screenshot of your dev project and ask Claude to describe it\n    - Send a PNG as {type:\"image\", source:{type:\"base64\", media\\_type:\"image/png\", data:...}} together with a text block asking for a description.\n    - Send the same image by URL source; note both forms.\n    - Send a 3-page PDF as a document block and ask for a summary with page references.\n    - Note the limits from the docs (max image size/pixels, max PDF pages) into notes/api-basics.md.\n  - ✔ Done when: Image (base64 and URL) and PDF requests both succeed; limits are written down.\n  - Read\n    - [Vision](https://docs.claude.com/en/docs/build-with-claude/vision)\n    - [PDF support](https://docs.claude.com/en/docs/build-with-claude/pdf-support)\n    - [Files API](https://docs.claude.com/en/docs/build-with-claude/files)\n- 09-12 · Academy: Building with the Claude API — modules 1–2 with quizzes\n  - Build: Fix anything the quiz exposed\n    - Watch modules 1–2 at 1.25× speed; pause and run every code sample in your own lab instead of the notebook.\n    - Take the module quizzes; for each wrong answer, find the sentence in the docs that settles it and paste the link into notes.\n    - Add three questions of your own to the Self-check list below (in My notes).\n  - ✔ Done when: Both module quizzes passed; every miss has a docs link in notes.\n  - Read\n    - [Course: Building with the Claude API](https://academy.claude.com/courses/building-with-the-claude-api)\n    - [Course: Claude Platform 101](https://academy.claude.com/courses/claude-platform-101)\n- 09-13 · Review day\n  - Build: Write notes/api-basics.md\n    - Write notes/api-basics.md: request fields, response fields, stop\\_reason table, streaming events, content block types, prefill and stop\\_sequences, limits.\n    - Do the Self-check below with answers hidden; re-read anything you got wrong.\n    - Take the Applications & Integration quiz in the Question bank tab (timed).\n    - Fill the Weekly retrospective for this chapter.\n  - ✔ Done when: Notes file committed; quiz taken and score recorded; retrospective filled.\n  - Read\n    - Your own notes and the Study material section of this chapter\n\n## 📖 Study material\n\n- The request, field by field\n  - model · yes · Model ID. Dated IDs (claude-sonnet-4-5-20250929) are pinned; aliases (claude-sonnet-4-5) move to the latest snapshot.\n  - max\\_tokens · yes · Hard cap on output tokens only. Hitting it sets stop\\_reason: max\\_tokens. It does not affect input.\n  - messages · yes · Array of {role, content}. Roles alternate user/assistant; first must be user. Content is a string or a list of content blocks.\n  - system · no · Top-level string or list of text blocks. Not a message role. Best place for role, rules, stable context (and a cache breakpoint).\n  - temperature · no · 0–1 randomness (classic: 0 for extraction/classification, higher for creative). Does not change length or cost. Now: non-default temperature/top\\_p/top\\_k return 400 on Claude 4.7+ and were removed from the Python SDK v1 — omit them on current models.\n  - top\\_p, top\\_k · no · Alternative sampling controls (legacy); adjust temperature or top\\_p, never both.\n  - stop\\_sequences · no · Custom strings that end generation; sets stop\\_reason: stop\\_sequence and reports which one in stop\\_sequence.\n  - stream · no · true → server-sent events.\n  - tools, tool\\_choice · no · Chapter 2.\n  - metadata.user\\_id · no · Opaque ID for abuse tracking; never put PII in it.\n  - thinking · no · {type:enabled, budget\\_tokens} on models with manual thinking; {type:adaptive} on 4.6+ (Chapter 3).\n  - output\\_config · no · effort (low…max) and format = {type:json\\_schema, schema} for structured outputs.\n- The response\n  - id, type: \"message\", role: \"assistant\", model.\n  - content: a list of blocks — text, tool\\_use, thinking. Never assume content\\[0\\] is text once tools or thinking are on.\n  - stop\\_reason: end\\_turn (natural finish), max\\_tokens (truncated), stop\\_sequence (hit your string), tool\\_use (wants a tool), refusal (safety classifier — still HTTP 200), pause\\_turn (long server-tool turns — send it back to continue), model\\_context\\_window\\_exceeded (input + max\\_tokens over the window).\n  - usage: input\\_tokens, output\\_tokens, and with caching cache\\_creation\\_input\\_tokens, cache\\_read\\_input\\_tokens. This is how you cost a call.\n- Statelessness and conversation history\n  - The API keeps nothing between calls. Every request carries the whole history, so input tokens grow every turn — the reason context management (Chapter 3) and caching (Chapter 2) exist.\n  - Consecutive same-role messages are an error on most models; merge them into one message with several content blocks.\n- Streaming\n  - Event order: message\\_start → (content\\_block\\_start → content\\_block\\_delta\\* → content\\_block\\_stop)\\* → message\\_delta (carries stop\\_reason and output usage) → message\\_stop.\n  - Delta types: text\\_delta, input\\_json\\_delta (tool arguments arrive as partial JSON), thinking\\_delta.\n  - Streaming improves perceived latency and lets you show progress; it does not change cost or total time. Use it for anything user-facing; also recommended for long outputs to avoid HTTP timeouts.\n  - The SDK helper messages.stream() accumulates the final message for you; the raw stream=True form gives you events.\n- Controlling the output shape\n  - Instruction in system: \"Respond only with JSON matching…\". Cheap, not guaranteed.\n  - Prefill (legacy): put a partial assistant message last (e.g. { or <answer>) — Claude continues from it; removes preambles. Never worked with extended thinking, and is a 400 error on Claude 4.6+. The exam may still present it as a valid technique — know how it worked.\n  - stop\\_sequences: stop at </answer> or a closing brace to avoid trailing chatter.\n  - Tool use as a schema: define a tool whose input\\_schema is your desired JSON and force it with tool\\_choice — the classic guaranteed-structure trick.\n  - Structured outputs: output\\_config.format = {type:\"json\\_schema\", schema} (or strict: true on a tool) constrains generation to the schema — GA on Sonnet 4.5+/Opus 4.5+/Haiku 4.5. Output can still be off-schema when stop\\_reason is refusal or max\\_tokens, so check stop\\_reason first.\n  - Always validate and retry anyway; treat model output as untrusted input.\n- Vision and documents\n  - Images are content blocks: {\"type\":\"image\",\"source\":{\"type\":\"base64\"|\"url\", ...}}. Formats JPEG/PNG/GIF/WebP; several images per request; put images before the question text.\n  - PDFs go in as document blocks (base64, URL or file\\_id via the Files API); Claude sees both extracted text and page images, so tables and charts work. Page limits exist — check the docs for your model.\n  - Image tokens ≈ ceil(width/28) × ceil(height/28) (older docs said width×height/750 — same order of magnitude: a 1000×1000 image ≈ 1,300 tokens). Max 10 MB (5 MB on Bedrock/Vertex), auto-downscaled to a 1568 px long edge; resize before sending.\n- ⚠ Exam traps\n  - \"Which parameter controls response length?\" → max\\_tokens, not temperature.\n  - \"Why did the answer cut off mid-sentence?\" → stop\\_reason=max\\_tokens.\n  - System prompt is not a message.\n  - Streaming does not reduce cost.\n  - Prefill goes in the assistant role, as the last message (legacy on 4.6+). content is a list, not a string.\n  - A refusal is HTTP 200 with stop\\_reason refusal.\n- Minimal call\n- Streaming with the SDK helper\n\n## 📚 Library digests\n\n- [Messages API reference](https://platform.claude.com/docs/en/api/messages)\n  - Key facts\n    - POST /v1/messages. Required: model, messages (array of {role, content}; role ∈ user | assistant), max\\_tokens. Optional: system, stop\\_sequences, metadata.user\\_id (≤512 chars, opaque — no identifying info), tools, tool\\_choice, thinking, output\\_config, container.\n    - tool\\_choice types: auto (default), any (must call some tool), tool + name (must call that tool), none. auto/any/tool accept disable\\_parallel\\_tool\\_use.\n    - thinking: {type:'enabled', budget\\_tokens ≥ 1024 and < max\\_tokens} on models that support manual thinking; {type:'adaptive'} on Claude 4.6+; {type:'disabled'}. output\\_config: effort ∈ low | medium | high | xhigh | max; format = {type:'json\\_schema', schema}.\n    - cache\\_control: {type:'ephemeral', ttl?: '5m' | '1h'} — allowed on text, image, document, tool\\_use, tool\\_result blocks and on tool definitions.\n    - Content sources: base64 (image media\\_type jpeg/png/gif/webp; PDF application/pdf), url, file (file\\_id from the Files API), text (text/plain documents).\n    - Response: id, type 'message', role 'assistant', content\\[\\] (blocks: text, thinking, redacted\\_thinking, tool\\_use, server\\_tool\\_use, web\\_search\\_result…), model, stop\\_reason, stop\\_sequence (null unless hit), usage.\n    - stop\\_reason enum: end\\_turn, max\\_tokens, stop\\_sequence, tool\\_use, pause\\_turn, refusal, model\\_context\\_window\\_exceeded. A refusal carries stop\\_details with a category.\n    - usage: input\\_tokens, output\\_tokens, cache\\_creation\\_input\\_tokens, cache\\_read\\_input\\_tokens, cache\\_creation.{ephemeral\\_5m\\_input\\_tokens, ephemeral\\_1h\\_input\\_tokens}, server\\_tool\\_use.{web\\_search\\_requests, web\\_fetch\\_requests}, output\\_tokens\\_details.thinking\\_tokens.\n    - Tool names must match ^\\[a-zA-Z0-9\\_-\\]{1,256}$; server-tool ids start srvtoolu\\_. Citations are off by default (citations: {enabled:false}).\n    - Related endpoints: POST /v1/messages/count\\_tokens; /v1/messages/batches (create, list, get, cancel, delete, results).\n  - ⚠ Exam traps\n    - max\\_tokens is required and has no default; system is a top-level field, never a message with role 'system' at index 0.\n    - budget\\_tokens must be ≥1024 and < max\\_tokens; tool\\_choice 'any' forces some tool, 'tool' forces a named one.\n    - stop\\_sequence is populated only when stop\\_reason == 'stop\\_sequence'; cache\\_read\\_input\\_tokens is reported separately from input\\_tokens.\n- [Working with messages (multi-turn, roles, prefill)](https://platform.claude.com/docs/en/build-with-claude/working-with-messages)\n  - Key facts\n    - The API is stateless — send the full conversation history on every call.\n    - Messages alternate user/assistant; consecutive same-role messages are combined into one turn. The first message must be user.\n    - A role 'system' message may appear mid-conversation on the newest models (4.8+, Opus 5, Fable 5) but never first; use top-level system for from-the-start instructions. Mid-conversation system turns don't invalidate the cached prefix.\n    - Prefill (a partial assistant message as the final turn, e.g. '{' or 'The answer is (') is NOT supported on Claude 4.6 and later — use structured outputs or explicit format instructions. Older models still accept it.\n    - temperature, top\\_p, top\\_k return HTTP 400 on Claude 4.7+ when set to non-default values; omit them. (Python SDK v1.0+ removed the parameters.)\n    - You may inject synthetic assistant turns to shape the flow of a conversation.\n    - Image sources: base64, url, file; formats jpeg/png/gif/webp.\n  - ⚠ Exam traps\n    - First message role must be user.\n    - Prefilling the assistant turn is legacy: on 4.6+ it is a 400 error and the replacement is output\\_config.format (structured outputs).\n    - Sampling parameters (temperature/top\\_p/top\\_k) are rejected on 4.7+, not silently ignored.\n  - Then vs now\n    - The exam blueprint predates these changes, so a question may still present prefill or temperature as valid techniques. Answer such questions with the classic behaviour (prefill forces format; temperature controls randomness) unless the stem names a Claude 4.6+/4.7+ model.\n- [Streaming Messages](https://platform.claude.com/docs/en/build-with-claude/streaming)\n  - Key facts\n    - Set stream: true; transport is server-sent events (SSE).\n    - Event order: message\\_start → (content\\_block\\_start → content\\_block\\_delta\\* → content\\_block\\_stop)\\* → message\\_delta → message\\_stop. ping can appear anywhere; an error event (e.g. overloaded\\_error) can arrive mid-stream after a 200.\n    - Delta types: text\\_delta (text), input\\_json\\_delta (partial\\_json — accumulate then parse), thinking\\_delta, signature\\_delta (just before a thinking block stops), citations\\_delta.\n    - message\\_start usage shows input\\_tokens (and output\\_tokens: 1); message\\_delta carries cumulative output usage and the stop\\_reason.\n    - Streaming is required when max\\_tokens exceeds 128,000; non-streaming requests time out at about 10 minutes.\n    - Python helpers: client.messages.stream() context manager, .text\\_stream, .get\\_final\\_message(). TS: .finalMessage().\n    - Recovering an interrupted stream: on 4.6+ send a user message 'Your previous response was interrupted and ended with \\[…\\]. Continue from where you left off.' Tool-use and thinking blocks cannot be partially recovered — resume from the last text block.\n  - ⚠ Exam traps\n    - Tool inputs arrive as input\\_json\\_delta.partial\\_json strings that must be concatenated — never as complete objects.\n    - Final usage and stop\\_reason come in message\\_delta, not message\\_stop.\n    - An SSE error event can arrive after HTTP 200 — handle overloaded\\_error inside the stream.\n- [Structured outputs (JSON schema + strict tools)](https://platform.claude.com/docs/en/build-with-claude/structured-outputs)\n  - Key facts\n    - Two features: JSON outputs via output\\_config.format = {type:'json\\_schema', schema} (replaces the deprecated output\\_format name), and strict tool use via strict: true on a tool definition. GA — no beta header needed.\n    - Supported: Opus 4.5+, Sonnet 4.5+, Haiku 4.5, Fable/Mythos 5.x.\n    - Schema support: standard types, enum, const, required, anyOf, type arrays (\\['string','null'\\]), nested objects/arrays, additionalProperties:false (required — SDK adds it), limited format/pattern. Not supported: minimum/maximum, minLength/maxLength, minItems/maxItems, not, allOf, most oneOf, $ref, if/then/else — the SDK strips them and appends the constraint to descriptions.\n    - Limits: 20 strict tools per request; 24 optional parameters combined; 16 union-type parameters; 180 s grammar compile timeout. Grammar is cached 24 h; invalidated by schema structure or tool-set changes, not by name/description edits.\n    - Changing output\\_config.format invalidates the prompt cache; a small input-token overhead is added by an injected system prompt.\n    - Output may NOT match the schema when stop\\_reason is refusal (still HTTP 200, still billed) or max\\_tokens — always check stop\\_reason before parsing.\n    - Enum casing may drift — compare case-insensitively; required properties are emitted before optional ones.\n    - Incompatible with citations (400) and with prefill; the grammar constrains only the final output, not tool calls or thinking. Works with streaming, Batches (50% off) and token counting.\n    - Python SDK: client.messages.parse(output\\_format=PydanticModel) → response.parsed\\_output; anthropic.transform\\_schema() helper.\n  - ⚠ Exam traps\n    - The raw API parameter is output\\_config.format — not response\\_format, not top-level output\\_format.\n    - Structured output + citations → 400.\n    - stop\\_reason 'refusal' returns HTTP 200 with non-conforming output — check stop\\_reason, don't just json.loads.\n  - Then vs now\n    - Classic exam answers for 'guaranteed JSON' were prefill + validation, or a forced tool with input\\_schema. Both still count as correct reasoning; structured outputs is the modern, stronger answer where the options include it.\n- [Vision (images)](https://platform.claude.com/docs/en/build-with-claude/vision)\n  - Key facts\n    - Formats: image/jpeg, image/png, image/gif (first frame only), image/webp. Sources: base64, url, file (Files API — recommended when reusing an image across turns).\n    - Max size 10 MB base64 on the Claude API (5 MB on Bedrock/Vertex); max 8000×8000 px; with more than 20 images per request each is capped at 2000×2000.\n    - Auto-downscaled preserving aspect ratio to a long edge of 1568 px (standard) or 2576 px (high-res, Claude 4.7+). 'oversized\\_image': 'error' rejects instead of resizing.\n    - Per request: 100 images on 200K-context models, 600 on 1M models; claude.ai 20 per message.\n    - Token cost ≈ ceil(width/28) × ceil(height/28): 200×200 = 64 tokens; 1000×1000 ≈ 1,296; 1920×1080 ≈ 1,560 (standard). Example: Haiku 4.5 at $1/MTok → about $1.30 per 1,000 1000×1000 images.\n    - Limitations: cannot identify people; weak on <200 px, rotated or low-quality images; approximate spatial coordinates; poor at counting many small objects; cannot detect AI-generated images; not for medical scans; no image generation.\n  - ⚠ Exam traps\n    - The token formula is now width/28 × height/28 (28-px patches); the old (w×h)/750 rule is out of date — both give the same order of magnitude.\n    - Bedrock/Vertex cap images at 5 MB vs 10 MB on the Claude API.\n    - More than 20 images in a request lowers the per-image cap to 2000×2000.\n- [PDF support (document blocks)](https://platform.claude.com/docs/en/build-with-claude/pdf-support)\n  - Key facts\n    - Content block type 'document', media\\_type application/pdf; sources url, base64, file (file\\_id). Plain text (.txt/.csv/.md) uses text/plain; .docx/.xlsx must be converted first.\n    - Limits: 32 MB per request; 600 pages (100 pages on models with a 200K window); no encrypted/password PDFs.\n    - Each page is rasterised to an image AND its text extracted; both go to the model (so charts and tables work). Cost = 1,500–3,000 text tokens per page plus image tokens; no extra PDF fee.\n    - Put document blocks before the text in the user message; refer to logical page numbers; split very large PDFs.\n    - Supports cache\\_control on the document block, citations, and Message Batches.\n  - ⚠ Exam traps\n    - 600 pages on 1M-context models but only 100 on 200K models such as Haiku 4.5.\n    - PDFs are billed as text AND image tokens per page.\n    - Block type is 'document', not 'image'.\n- [Files API](https://platform.claude.com/docs/en/build-with-claude/files)\n  - Key facts\n    - GA. Endpoints: POST /v1/files (upload), GET /v1/files, GET /v1/files/{id}, GET /v1/files/{id}/content, DELETE /v1/files/{id}.\n    - Limits: 500 MB per file, 1 TB per organisation, ~500 requests/min.\n    - Mapping: PDF → document; text/plain → document; jpeg/png/gif/webp → image; other files → container\\_upload (for code execution).\n    - Reference with source {type:'file', file\\_id}. Uploaded files are not downloadable (400) — only files produced by code execution/skills are.\n    - Optional expires\\_in\\_seconds at upload: 1 hour to 90 days. Files are workspace-scoped — any key in the workspace can read them; never accept file\\_ids from untrusted users; use one workspace per tenant.\n    - Upload/storage is free; content is billed as input tokens every time it is referenced. Not ZDR-eligible.\n  - ⚠ Exam traps\n    - Files are workspace-scoped, not per key or per user.\n    - Uploading is free; you pay tokens each time the file is used in a request.\n    - You cannot download a file you uploaded — only tool-generated outputs.\n- [Client SDKs (Python)](https://platform.claude.com/docs/en/cli-sdks-libraries/sdks/python)\n  - Key facts\n    - Official SDKs: Python, TypeScript, C#, Go, Java, PHP, Ruby (+ CLI, Swift, OpenAI-compat layer). Python: pip install anthropic, Python ≥3.10, reads ANTHROPIC\\_API\\_KEY.\n    - Clients: Anthropic, AsyncAnthropic, AnthropicBedrock, AnthropicVertex, AnthropicFoundry (and AWS variants).\n    - Defaults: max\\_retries=2 (exponential backoff, honours retry-after); timeout 10 minutes. Retried automatically: connection errors, 408, 409, 429, ≥500. Per-call override: client.with\\_options(max\\_retries=5, timeout=20.0).\n    - Exceptions: APIStatusError base → BadRequestError 400, AuthenticationError 401, PermissionDeniedError 403, NotFoundError 404, ConflictError 409, UnprocessableEntityError 422, RateLimitError 429, InternalServerError ≥500; plus APIConnectionError, APITimeoutError.\n    - Helpers: messages.stream(), messages.parse(), messages.count\\_tokens(), files.upload(), client.beta.messages with betas=\\[...\\], auto-pagination on .list(), message.to\\_dict(), message.\\_request\\_id.\n    - SDK v1.0+ removed temperature/top\\_p/top\\_k (TypeError if passed).\n  - ⚠ Exam traps\n    - Default retries = 2 (three attempts total); default timeout = 10 minutes.\n    - Beta features go through client.beta.messages with a betas=\\[...\\] list.\n    - 429 and 5xx are auto-retried; 400/401/403/404 are not.\n- Software engineering foundations for Claude apps (REST, JSON, git, refactoring) — blueprint 7.4%\n  - Key facts\n    - REST essentials the API relies on: HTTPS POST /v1/messages with headers x-api-key, anthropic-version (e.g. 2023-06-01), content-type: application/json; status classes 2xx success / 4xx client / 5xx server; idempotency matters for retries (a retried POST can double-charge — make your own writes idempotent).\n    - JSON discipline: content is a list of typed blocks, not a string; parse with a strict parser, validate with a schema (pydantic / zod), never eval; handle unicode, escaping and large numbers; treat model output as untrusted input.\n    - Version control: keep prompts, tool schemas, CLAUDE.md, settings.json and eval cases in the repo; pin model IDs and SDK versions (requirements.txt / package-lock); tag releases; never commit .env or keys (.gitignore, secret scanning); review prompt changes like code changes (diff + eval run).\n    - Refactoring for LLM code: isolate the API call behind one function (client, model, retries, logging in one place); separate prompt templates from code; make tools small pure functions with typed inputs; add tests around parsing and tool handlers; remove dead prompt text — every token costs.\n    - Async and concurrency: use the async client with bounded concurrency (semaphore) to respect rate limits; stream for user-facing paths; batch for offline paths.\n    - Observability: log request id, model, stop\\_reason, usage, latency, tool calls; emit metrics (cost per request, cache hit rate, refusal rate, p95 latency); keep traces for debugging.\n  - ⚠ Exam traps\n    - A retried POST is not automatically safe — make downstream writes idempotent.\n    - Pin model IDs and SDK versions in version control; treat prompt edits like code (review + eval).\n    - Model output is untrusted input — schema-validate before use.\n- Understanding requirements and the systems life cycle — blueprint 6.2%\n  - Key facts\n    - Requirements for an LLM feature: user goal and success criteria (measurable, see evals); input types (text, images, PDFs, tool data); latency budget (interactive → stream, small model; batch → Batches); cost ceiling per request/month; quality bar and failure tolerance; privacy/PII constraints and data residency; safety/compliance domain (high-risk → human oversight); who is accountable for outputs.\n    - Decide the architecture from the requirements: single prompt → workflow → agent, in that order; choose the smallest model that meets the bar; decide state handling (stateless request, server-side session store, retrieval).\n    - Life cycle: define criteria → prototype in the Workbench → build eval set → implement with logging → red-team → staged rollout (shadow / canary / percentage) → monitor (quality, cost, latency, refusals, injection attempts) → iterate on prompt/model with regression evals → plan for model deprecations (60-day notice) and version pinning.\n    - Operational readiness: rate-limit headroom and backoff, spend limits per workspace, secrets rotation, fallbacks when 529/overloaded (degrade to smaller model or queue), runbooks for tool failures.\n    - Change management: every prompt/model/tool change goes through the eval suite and a diff review; keep a changelog of prompt versions with their eval scores.\n  - ⚠ Exam traps\n    - The first design question is 'what does success look like and how will we measure it?', not 'which model?'.\n    - Interactive latency requirement rules out Batches; cost requirement pushes toward caching and Haiku.\n    - Plan for deprecation from day one: pin IDs, keep evals ready to validate the successor model.\n\n## ❓ Self-check\n\n- A response ends with stop\\_reason = max\\_tokens. What happened and what do you do?\n  - → Output hit the cap. Raise max\\_tokens or ask for a shorter answer; optionally send a follow-up 'continue' with the partial text as the assistant turn.\n- Where does the system prompt go in a Messages request?\n  - → In the top-level system parameter, not inside messages.\n- How do you force JSON output without a schema feature?\n  - → Prefill the assistant turn with '{', instruct JSON-only in system, validate and retry on failure — or define a tool with the schema and force it via tool\\_choice.\n- Why do input\\_tokens grow on every turn of a chat?\n  - → The API is stateless; you resend the whole history each call.\n- Name the streaming events in order.\n  - → message\\_start, content\\_block\\_start, content\\_block\\_delta (repeated), content\\_block\\_stop, message\\_delta, message\\_stop.\n- When does usage arrive in a streamed response?\n  - → Input tokens in message\\_start; output tokens in message\\_delta near the end — so cost is only known at the end.\n- Two user messages in a row — what happens?\n  - → Error on most models (roles must alternate). Merge into one user message with multiple content blocks.\n- A user sends a 12 MB PNG. What should your app do?\n  - → Resize/compress before sending — image cost scales with pixel area and there is a size cap.\n- What does temperature=0 buy you?\n  - → Near-deterministic, most-likely output — good for extraction and classification. It does not shorten the answer.\n- Which response field tells you a tool call is requested?\n  - → stop\\_reason = tool\\_use, with a tool\\_use block in content.\n\n## ⚠ Traps to drill\n\n- Answer cut off mid-sentence.\n  - → stop\\_reason=max\\_tokens — raise max\\_tokens; temperature has nothing to do with length.\n- Where is the system prompt sent?\n  - → Top-level system parameter — never as a message with role 'system'.\n- Does streaming reduce cost or total latency?\n  - → No. It improves perceived latency only; tokens billed are identical.\n- Prefill lives in which role and position?\n  - → Assistant role, as the final message; Claude continues from it (legacy — 400 on Claude 4.6+; use structured outputs).\n- response.content is a string?\n  - → No — a list of blocks (text, tool\\_use, thinking). Iterate, don't index blindly.\n- Which parameter is required besides model and messages?\n  - → max\\_tokens.\n\n## 🗒 Cheat sheet\n\n- Required: model, max\\_tokens, messages. system is top-level. Roles alternate, first is user.\n- stop\\_reason: end\\_turn · max\\_tokens (truncated) · stop\\_sequence · tool\\_use · refusal (HTTP 200) · pause\\_turn (send back) · model\\_context\\_window\\_exceeded\n- usage: input\\_tokens, output\\_tokens, cache\\_creation\\_input\\_tokens, cache\\_read\\_input\\_tokens\n- Stream events: message\\_start → content\\_block\\_start/delta/stop → message\\_delta (stop\\_reason, output usage) → message\\_stop\n- Force shape: instruction < prefill '{' + stop\\_sequences (legacy, 400 on 4.6+) < forced tool with input\\_schema < structured outputs output\\_config.format (check stop\\_reason before parsing)\n- Images: base64/URL/file blocks, JPEG/PNG/GIF/WebP, ≤10 MB, tokens ≈ (w/28)×(h/28); PDFs as document blocks (text + page images), 32 MB, 600 pages (100 on 200K models)\n- Stateless API: resend full history each call → context grows → cache the prefix, summarise old turns\n\n## ☑ Chapter checklist\n\n- Can explain every field in a Messages request and response from memory\n- Know the difference between stop\\_reason values: end\\_turn, max\\_tokens, stop\\_sequence, tool\\_use (and refusal / pause\\_turn where they apply)\n- Streaming chat works and handles the final message event\n- JSON-output script validates and retries\n- Sent an image and a PDF successfully\n- notes/api-basics.md written\n\n","ch2":"# Chapter 2 — Tool use, prompt caching, batches and production plumbing\n\n## 🎯 Goal\n\n- Run the tool-use loop from memory, cut cost with caching and batches, and make a client that survives 429s and 529s.\n\n## Exam domains\n\n- Applications & Integration — 33.1%\n- Tools & MCPs — 10.6%\n\n## 📅 Daily plan\n\n- 09-14 · Tool use: tools schema (name, description, input\\_schema), tool\\_use block, tool\\_result block, tool\\_choice\n  - Build: tools.py — a get\\_time / get\\_weather tool the model calls\n    - Define tools=\\[{name:\"get\\_time\", description:\"Current time for an IANA timezone\", input\\_schema:{type:\"object\", properties:{tz:{type:\"string\"}}, required:\\[\"tz\"\\]}}\\].\n    - Call the API; when stop\\_reason==\"tool\\_use\", find the tool\\_use block, run your Python function with block.input, and append two messages: the assistant message (as returned) and a user message containing {type:\"tool\\_result\", tool\\_use\\_id:block.id, content:\"...\"}.\n    - Loop until stop\\_reason==\"end\\_turn\"; print the final text.\n    - Break it on purpose: omit the tool\\_result and read the error; send a wrong tool\\_use\\_id and read that error.\n  - ✔ Done when: Claude asks for get\\_time, you return the result, Claude answers in natural language; you have seen both error messages.\n  - Read\n    - [Tool use overview](https://docs.claude.com/en/docs/agents-and-tools/tool-use/overview)\n    - [How to implement tool use](https://docs.claude.com/en/docs/agents-and-tools/tool-use/implement-tool-use)\n- 09-15 · Multi-tool and parallel tool calls; missing or invalid arguments; is\\_error on tool\\_result\n  - Build: Add a second tool; log every tool round-trip\n    - Add get\\_weather(city). Ask \"What time is it in Pune and what's the weather?\" — observe two tool\\_use blocks in one response; answer both in ONE user message.\n    - Make get\\_weather raise for an unknown city; return tool\\_result with is\\_error:true and the message; watch Claude recover.\n    - Try tool\\_choice={type:\"any\"} and {type:\"tool\", name:\"get\\_time\"} and note how behaviour changes.\n    - Write a generic run\\_tools(messages, tools, registry) loop with logging of every round-trip and a max\\_iterations guard.\n  - ✔ Done when: Parallel calls handled in one message; is\\_error recovery observed; generic loop with logging committed.\n  - Read\n    - [Tool use: parallel calls and tool\\_choice](https://docs.claude.com/en/docs/agents-and-tools/tool-use/implement-tool-use)\n    - [Tool use: handling errors](https://docs.claude.com/en/docs/agents-and-tools/tool-use/implement-tool-use#handling-tool-use-and-tool-result-content-blocks)\n- 09-16 · Prompt caching: cache\\_control breakpoints, minimum cacheable length, read vs write pricing, TTL\n  - Build: Cache a long system prompt; compare usage before and after\n    - Build a system prompt of ~3,000 tokens (paste your project's README + conventions). Send it as a list of text blocks with cache\\_control:{type:\"ephemeral\"} on the last block.\n    - Call twice within 5 minutes; print usage: first call shows cache\\_creation\\_input\\_tokens, second shows cache\\_read\\_input\\_tokens.\n    - Change one character before the breakpoint and call again — observe a new cache write.\n    - Compute cost for 100 calls with and without caching using the pricing page; put the table in notes.\n  - ✔ Done when: cache\\_read\\_input\\_tokens > 0 on the second call; cost comparison table written.\n  - Read\n    - [Prompt caching](https://docs.claude.com/en/docs/build-with-claude/prompt-caching)\n    - [Pricing (cache multipliers)](https://docs.claude.com/en/docs/about-claude/pricing)\n- 09-17 · Message Batches API: create, poll, retrieve results, 50% discount, up to 24 h\n  - Build: Submit 20 prompts as a batch; fetch results\n    - Create 20 requests each with a custom\\_id (e.g. ticket-001) and a full Messages params object.\n    - client.messages.batches.create(requests=\\[...\\]); print the batch id and processing\\_status.\n    - Poll batches.retrieve(id) every 30 s until processing\\_status==\"ended\"; then iterate batches.results(id) and match custom\\_id to your inputs.\n    - Note the result types: succeeded, errored, canceled, expired. Save results as JSONL.\n  - ✔ Done when: 20 results retrieved and matched by custom\\_id; you can name the four result types.\n  - Read\n    - [Batch processing](https://docs.claude.com/en/docs/build-with-claude/batch-processing)\n- 09-18 · Errors and limits: 400/401/429/500/529, retry-after, SDK retries and timeouts, rate-limit tiers\n  - Build: Wrap client with backoff; simulate a 429\n    - Read the error table; write it into notes with 'whose fault' column (client vs server).\n    - Construct Anthropic(max\\_retries=5, timeout=60) and read what the SDK retries by default (408/409/429/5xx, connection errors).\n    - Simulate a 429 by firing 50 concurrent requests with asyncio; catch anthropic.RateLimitError and read the retry-after header from e.response.headers.\n    - Write a decorator with exponential backoff + jitter for cases the SDK does not cover (e.g. your own tool failures).\n  - ✔ Done when: You triggered and handled a real 429; the notes error table has all codes and who is responsible.\n  - Read\n    - [Errors](https://docs.claude.com/en/api/errors)\n    - [Rate limits](https://docs.claude.com/en/api/rate-limits)\n- 09-19 · Academy course modules on tools and caching; Console usage dashboard walk-through\n  - Build: Reconcile your usage dashboard with your own token log\n    - Complete the tool-use and caching modules with quizzes.\n    - Sum the usage objects you have logged this week; compare to the Console usage page by model — explain any gap (cache tokens, retries).\n    - Add a tiny cost() helper to your lab that prices a usage object per model; you will reuse it in Chapter 3.\n  - ✔ Done when: Module quizzes passed; your logged totals match the Console within a few percent.\n  - Read\n    - [Course: Building with the Claude API (tools & caching modules)](https://academy.claude.com/courses/building-with-the-claude-api)\n    - [Console usage](https://platform.claude.com/usage)\n- 09-20 · Review day\n  - Build: Write notes/tools-caching-batch.md\n    - Write notes/tools-caching-batch.md with: the tool loop diagram, tool\\_choice table, cache rules (order, minimum, TTL, pricing), batch lifecycle, error table.\n    - Self-check below; then the Applications & Integration and Tools & MCPs quizzes in the Question bank.\n    - Weekly retrospective.\n  - ✔ Done when: Notes committed; both quizzes recorded; retrospective filled.\n  - Read\n    - Study material below; your logs from the week\n\n## 📖 Study material\n\n- Tool use — the loop\n  - You send tools (name, description, JSON input\\_schema) with the messages.\n  - Claude replies with stop\\_reason: tool\\_use and one or more tool\\_use blocks: {id, name, input}.\n  - Your code runs the function. Claude never executes anything for client tools.\n  - You append the assistant message unchanged, then a user message whose content is tool\\_result blocks: {type:\"tool\\_result\", tool\\_use\\_id, content, is\\_error?} — one per tool\\_use, same ids, all in one message, and the tool\\_result blocks must come first in that message before any text. strict: true on a tool definition makes arguments conform exactly to the schema.\n  - Repeat until stop\\_reason: end\\_turn.\n  - Descriptions are the most important part of a tool definition — say what it does, when to use it, what it returns, and what the arguments mean. Anthropic recommends 3–4+ sentences.\n  - tool\\_choice: {\"type\":\"auto\"} (default, may answer without tools), {\"type\":\"any\"} (must call some tool), {\"type\":\"tool\",\"name\":\"x\"} (must call that one — the JSON-schema trick), {\"type\":\"none\"} (no tools this turn). disable\\_parallel\\_tool\\_use: true forces one call at a time.\n  - Parallel tool use: several tool\\_use blocks in one response — return all results in a single user message, in the same order.\n  - Mark failures with is\\_error: true so Claude retries or explains instead of hallucinating a result.\n  - Tool results can contain text and image blocks; keep them small — they are input tokens on every later turn.\n  - Server tools (web search, web fetch, code execution, MCP connector) run on Anthropic's side; their results come back directly — you never send a tool\\_result for them. Text editor, bash, computer use and memory are Anthropic-defined client tools you still execute.\n- Prompt caching\n  - Add cache\\_control: {\"type\":\"ephemeral\"} to a block; the cached prefix is everything up to and including that block, in this order: tools → system → messages. Up to 4 breakpoints.\n  - Pricing: cache write ≈ 1.25× base input (5-min TTL) or 2× (1-hour TTL); cache read ≈ 0.1× base input. Break-even after roughly two reads.\n  - Minimum cacheable prefix depends on the model: 512 tokens (Opus 5, Fable 5.x), 1,024 (Sonnet 5, Sonnet 4.5/4.6, Opus 4.8), 2,048 (Opus 4.7), 4,096 (Opus 4.5/4.6, Haiku 4.5). Shorter prefixes are silently not cached.\n  - TTL 5 minutes by default, refreshed on every hit; optional ttl: \"1h\".\n  - Any change before the breakpoint (including tool definitions, images, or the model) invalidates the cache — stable content first, volatile content last. For chat, put the breakpoint on the latest message so the growing history is cached incrementally.\n  - You confirm hits via usage.cache\\_read\\_input\\_tokens. Caching cuts cost and time-to-first-token; it never reduces output tokens.\n- Message Batches\n  - Asynchronous: submit up to 100,000 requests (or ~256 MB), each with a custom\\_id; results within 24 h, usually much faster; 50% off input and output. Works with caching and tools.\n  - Lifecycle: in\\_progress → ended; then per-request result type succeeded / errored / canceled / expired. Results are available for 29 days. Order is not guaranteed — always join on custom\\_id.\n  - Use for evals, backfills, bulk classification, nightly summaries. Never for anything interactive.\n- Errors, limits and resilience\n  - 400 · invalid\\_request\\_error · you · fix the request (roles, max\\_tokens, schema)\n  - 401 · authentication\\_error · you · check key/env\n  - 403 · permission\\_error · you · key lacks access\n  - 404 · not\\_found\\_error · you · wrong model id / resource\n  - 413 · request\\_too\\_large · you · shrink input\n  - 429 · rate\\_limit\\_error · volume · honour retry-after; backoff; batch\n  - 500 · api\\_error · Anthropic · retry with backoff\n  - 529 · overloaded\\_error · Anthropic · retry with backoff + jitter, degrade gracefully\n  - Rate limits are per organisation per model: requests/min, input tokens/min, output tokens/min; tiers rise with spend. Headers report remaining quota.\n  - The SDK retries 408/409/429/5xx and connection errors twice by default with backoff; tune max\\_retries and timeout. Make writes idempotent; log request ids (request-id header / \\_request\\_id) for support.\n  - Long requests: stream, or the SDK may reject non-streaming calls expected to exceed ~10 minutes.\n- ⚠ Exam traps\n  - Who executes a client tool? Always your code (server tools need no tool\\_result). tool\\_result goes in a user message, first in the content list, and must match every tool\\_use id.\n  - Caching reduces cost and latency but not output tokens.\n  - Batch cannot power a live chat UI. 429 is not a bug in your code — back off or move to batch.\n  - Cache prefix order is tools → system → messages.\n  - Cache reads don't count against ITPM rate limits.\n- Tool loop skeleton\n- Caching a system prompt\n\n## 📚 Library digests\n\n- [
