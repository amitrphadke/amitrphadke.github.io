<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCDV-F Study Tracker — Amit Phadke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213d; --ink-2:#3b4763; --ink-3:#6b7590;
    --paper:#f3f5f9; --panel:#ffffff; --line:#d9dee8;
    --sea:#0b7a75; --sea-soft:#dff3f1;
    --amber:#c2711c; --amber-soft:#fbeedc;
    --red:#8a2f2f; --red-soft:#fbeaea;
    --done:#0b7a75; --exam:#8a2f2f;
    --r:6px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important}}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
  a{color:var(--sea)}
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
  code{background:#eef1f6;padding:1px 5px;border-radius:4px}
  pre{background:#1b2540;color:#e8edf7;padding:12px 14px;border-radius:var(--r);overflow:auto;font-size:13px;line-height:1.5}
  pre code{background:none;padding:0;color:inherit}
  h3{font-size:16px;margin:18px 0 6px}
  h4{font-size:14px;margin:12px 0 4px}

  /* ---------- header ---------- */
  header{background:var(--ink);color:#fff;padding:22px 20px 0}
  .hwrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}
  header h1{margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-.01em}
  header p{margin:0;color:#b9c3d9;font-size:14px}
  .stats{display:flex;gap:26px;flex-wrap:wrap}
  .stat{text-align:right}
  .stat b{display:block;font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:#b9c3d9}
  .stat.exam b{color:#ffd28a}
  .overall{grid-column:1/-1;margin-top:6px}
  .bar{height:8px;background:#2a3757;border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#1fb8ae,#59d6cc);width:0;transition:width .35s ease}
  .overall small{display:block;margin-top:5px;color:#b9c3d9;font-size:12px}
  .tabs{max-width:1180px;margin:14px auto 0;display:flex;gap:2px;flex-wrap:wrap}
  .tab{background:transparent;border:0;color:#b9c3d9;padding:10px 14px;border-radius:6px 6px 0 0;font-size:14px;cursor:pointer}
  .tab:hover{color:#fff}
  .tab.on{background:var(--paper);color:var(--ink);font-weight:600}
  .tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--amber);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center}
  .tab.on .badge{background:var(--amber)}

  /* ---------- layout ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:270px 1fr;gap:24px}
  .wrap.single{grid-template-columns:1fr}
  nav.side{position:sticky;top:16px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
  nav.side h2{font-size:12px;font-weight:600;color:var(--ink-3);margin:6px 8px 8px}
  .navitem{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:5px;text-decoration:none;color:var(--ink);font-size:13.5px}
  .navitem:hover{background:#eef1f6}
  .navitem .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
  .navitem .pct{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .navitem.now{background:var(--amber-soft)}
  .navitem.full .pct{color:var(--done);font-weight:600}
  .tools{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:6px}
  button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 10px;border-radius:5px;cursor:pointer}
  button:hover{border-color:var(--ink-3)}
  button.primary{background:var(--sea);border-color:var(--sea);color:#fff}
  button.primary:hover{background:#08625e}
  button.ghost{background:transparent}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
  .storenote{font-size:11.5px;color:var(--ink-3);margin:6px 8px 0}
  .view{display:none}
  .view.on{display:block}

  /* ---------- chapters ---------- */
  main{min-width:0}
  section.ch, .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px;overflow:hidden}
  .card{padding:18px 20px}
  .card h2{margin:0 0 6px;font-size:19px;font-weight:600}
  .card .sub{color:var(--ink-3);font-size:13.5px;margin-bottom:12px}
  .chhead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
  .chhead h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .chhead .dates{color:var(--ink-3);font-size:13.5px;margin-top:3px}
  .chhead .domain{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--sea);background:var(--sea-soft);padding:2px 8px;border-radius:999px}
  .chhead .goal{margin-top:8px;font-size:13.5px;color:var(--ink-2)}
  .chprog{min-width:150px;text-align:right}
  .chprog b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .chprog .bar{margin-top:6px;background:#e6eaf1}
  .chprog .bar i{background:var(--done)}
  section.ch.now .chhead{border-left:4px solid var(--amber)}
  section.ch.exam .chhead{background:#fbf1f1}

  .chbody{padding:6px 20px 18px}
  details{border-top:1px solid var(--line);padding:10px 0}
  details:first-child{border-top:0}
  summary{cursor:pointer;font-weight:600;font-size:14.5px;padding:4px 0;list-style:none;display:flex;align-items:center;gap:8px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s;flex:none}
  details[open] > summary::before{transform:rotate(45deg)}
  summary .cnt{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:auto}

  /* schedule table */
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
  th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid #eceff5;vertical-align:top}
  td.d{white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);width:76px}
  tr.today td{background:var(--amber-soft)}
  tr.done td{color:var(--ink-3)}
  tr.done td.t .learn{text-decoration:line-through}
  td.c{width:34px;text-align:center}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--done);cursor:pointer;margin:0;vertical-align:middle}
  .learn{display:block;font-weight:500}
  .build{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
  .build::before{content:"Build: ";font-weight:600;color:var(--sea)}
  .daydetail{margin-top:6px}
  .daydetail summary{font-weight:500;font-size:13px;color:var(--sea);padding:2px 0}
  .daydetail summary::before{border-color:var(--sea)}
  .daydetail .dd{font-size:13.5px;color:var(--ink-2);padding:6px 0 2px}
  .daydetail .dd b{color:var(--ink);display:block;margin-top:6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
  .daydetail .dd ol,.daydetail .dd ul{margin:3px 0 0 18px;padding:0}
  .daydetail .dd li{margin:2px 0}
  .daydetail .dd .dw{background:var(--sea-soft);padding:6px 10px;border-radius:4px;margin-top:6px;display:block}
  .daydetail .dd .dw::before{content:"Done when: ";font-weight:600;color:var(--sea)}

  /* checklists & notes */
  ul.ck{list-style:none;padding:0;margin:8px 0 0}
  ul.ck li{display:grid;grid-template-columns:26px 1fr;gap:6px;padding:6px 0;border-bottom:1px solid #eceff5;align-items:start}
  ul.ck li:last-child{border-bottom:0}
  ul.ck li.done label{color:var(--ink-3);text-decoration:line-through}
  ul.ck label{cursor:pointer}
  .notes h4{margin:14px 0 4px;font-size:14.5px;color:var(--ink)}
  .notes ul{margin:4px 0 8px 18px;padding:0}
  .notes li{margin:3px 0}
  .notes table{font-size:13.5px;margin:6px 0 10px}
  .notes th,.notes td{padding:5px 8px}
  .trap{background:#fff7ee;border-left:3px solid var(--amber);padding:8px 12px;border-radius:0 5px 5px 0;margin:8px 0}
  .tip{background:var(--sea-soft);border-left:3px solid var(--sea);padding:8px 12px;border-radius:0 5px 5px 0;margin:8px 0}
  .links a{display:block;margin:4px 0;font-size:14px;word-break:break-all}
  textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:5px;padding:8px;font:inherit;font-size:14px;resize:vertical;margin-top:8px}
  input[type=number],input[type=text]{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:5px;padding:5px 8px}
  .qa{margin:6px 0 0 0;padding:0;list-style:none}
  .qa li{padding:6px 0;border-bottom:1px solid #eceff5;cursor:pointer}
  .qa li b{display:block;font-weight:500}
  .qa li span{display:none;color:var(--ink-2);font-size:13.5px}
  .qa li.show span{display:block;margin-top:3px}
  .hint{font-size:12.5px;color:var(--ink-3)}
  .retro label{display:block;font-weight:500;margin-top:10px;font-size:14px}
  .retro textarea{min-height:52px;margin-top:4px}
  .cheatlist{margin:6px 0 0 18px;padding:0}
  .cheatlist li{margin:3px 0}

  /* ---------- quiz ---------- */
  .quizgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
  .qcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:6px}
  .qcard h3{margin:0;font-size:15px}
  .qcard .w{font-size:12.5px;color:var(--ink-3)}
  .qcard .best{font-size:13px}
  .qcard .best b{color:var(--done)}
  .qcard button{margin-top:auto;align-self:flex-start}
  .quizrun .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .quizrun .timer{font-family:"IBM Plex Mono",monospace;font-size:15px;padding:4px 10px;border-radius:5px;background:#eef1f6}
  .quizrun .timer.low{background:var(--red-soft);color:var(--red)}
  .qitem{border-top:1px solid var(--line);padding:14px 0}
  .qitem .qn{font-size:12.5px;color:var(--ink-3)}
  .qitem .qt{font-weight:500;margin:4px 0 8px}
  .qitem .opt{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:5px;cursor:pointer}
  .qitem .opt:hover{background:#eef1f6}
  .qitem.graded .opt{cursor:default}
  .qitem.graded .opt.right{background:var(--sea-soft)}
  .qitem.graded .opt.wrong{background:var(--red-soft)}
  .qitem .why{display:none;margin-top:8px;font-size:13.5px;color:var(--ink-2);background:#f6f8fb;padding:8px 12px;border-radius:5px}
  .qitem.graded .why{display:block}
  .qitem .why::before{content:"Why: ";font-weight:600;color:var(--ink)}
  .result{background:var(--ink);color:#fff;padding:16px 18px;border-radius:var(--r);margin:12px 0;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .result b{font-size:30px}
  .result.pass{background:var(--sea)}
  .result.fail{background:var(--red)}

  /* ---------- dashboard ---------- */
  .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .dtable{font-size:13.5px}
  .dtable td,.dtable th{padding:7px 8px}
  .dtable .bar{height:6px;background:#e6eaf1}
  .dtable .bar i{background:var(--done)}
  .dtable .bar.q i{background:#4c6ef5}
  .dtable input[type=number]{width:62px;padding:3px 6px;font-size:13px}
  .weightbar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:8px 0 4px}
  .weightbar span{display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;overflow:hidden;white-space:nowrap}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:#f6f8fb;border-radius:5px;padding:10px 12px}
  .kpi b{display:block;font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
  .kpi span{font-size:12px;color:var(--ink-3)}
  .kpi.warn b{color:var(--amber)}
  .kpi.bad b{color:var(--red)}
  .kpi.good b{color:var(--done)}

  /* ---------- trap review ---------- */
  .srcard{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:#fff;margin:12px 0}
  .srcard .src{font-size:12.5px;color:var(--ink-3)}
  .srcard .q{font-size:16px;font-weight:500;margin:6px 0 10px}
  .srcard .a{display:none;color:var(--ink-2);padding:10px 12px;background:#f6f8fb;border-radius:5px;margin-bottom:10px}
  .srcard.show .a{display:block}
  .srcard .btns{display:flex;gap:8px;flex-wrap:wrap}
  .boxes{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .box{background:#f6f8fb;border-radius:5px;padding:6px 10px;font-size:13px}
  .box b{font-variant-numeric:tabular-nums}

  /* ---------- cheat sheet ---------- */
  .cheat h2{font-size:16px;margin:16px 0 4px;padding-bottom:3px;border-bottom:2px solid var(--ink)}
  .cheat ul{margin:4px 0 0 18px;padding:0;columns:2;column-gap:28px}
  .cheat li{margin:2px 0;font-size:13.5px;break-inside:avoid}
  .cheat .trapline{color:var(--amber);font-weight:500}

  /* ---------- library ---------- */
  .libnav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .libnav a{font-size:12.5px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink-2);background:#fff}
  .libnav a:hover{border-color:var(--sea);color:var(--sea)}
  .libsearch{width:100%;margin-top:10px}
  .libgroup h2{font-size:17px;margin:22px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
  .libentry{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:14px 18px;margin:10px 0}
  .libentry h3{margin:0 0 2px;font-size:15.5px}
  .libentry .src{font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
  .libentry .src a{margin-right:10px}
  .libentry ul{margin:6px 0 4px 18px;padding:0}
  .libentry li{margin:4px 0;font-size:14px}
  .libentry pre{margin:8px 0}
  .libentry .traps{background:#fff7ee;border-left:3px solid var(--amber);padding:6px 12px;border-radius:0 5px 5px 0;margin:8px 0 0}
  .libentry .traps b{display:block;font-size:12.5px;color:var(--amber);text-transform:uppercase;letter-spacing:.03em}
  .libentry .traps ul{margin:2px 0 0 18px}
  .libentry .now{background:#eef2ff;border-left:3px solid #4c6ef5;padding:6px 12px;border-radius:0 5px 5px 0;margin:8px 0 0;font-size:13.5px}
  .libentry .now b{color:#3b5bdb}
  .libentry.hit{outline:2px solid var(--sea)}
  .readlist a.lib{font-weight:500}
  .readlist .orig{font-size:12px;color:var(--ink-3);margin-left:6px}

  @media (max-width:860px){
    .wrap{grid-template-columns:1fr;padding:14px}
    nav.side{position:static;order:0}
    .hwrap{grid-template-columns:1fr}
    .stats{gap:18px}
    .stat{text-align:left}
    .chhead{grid-template-columns:1fr}
    .chprog{text-align:left}
    td.d{width:64px}
    .cheat ul{columns:1}
  }
  @media print{
    header{background:#fff;color:#000;border-bottom:2px solid #000}
    header p,.stat span,.overall small{color:#333}
    nav.side,.tools,textarea,.tabs,button{display:none!important}
    .wrap{display:block;padding:0}
    .view{display:none} .view.on{display:block}
    details{page-break-inside:avoid}
    section.ch{page-break-inside:avoid}
    .cheat h2{page-break-after:avoid}
    body{font-size:12px}
  }
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div>
      <h1>CCDV-F Study Tracker</h1>
      <p>Claude Certified Developer – Foundations · Amit Phadke · 1.5 hrs/day · exam Tue 3 Nov 2026, 10:30 IST (check-in 10:00) · <a href="/learning/ccdv-f/" style="color:#ffd28a">back to the journey page</a> · <a href="/learning/ccdv-f/mindmaps/" style="color:#ffd28a">mind maps</a></p>
    </div>
    <div class="stats">
      <div class="stat exam"><b id="daysLeft">–</b><span>days to exam</span></div>
      <div class="stat"><b id="doneCount">0</b><span>items done</span></div>
      <div class="stat"><b id="behind">0</b><span>past-due items open</span></div>
      <div class="stat"><b id="srDue">0</b><span>traps due today</span></div>
    </div>
    <div class="overall">
      <div class="bar"><i id="overallBar"></i></div>
      <small id="overallText">0% complete</small>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab on" data-view="plan" role="tab">Study plan</button>
    <button class="tab" data-view="quiz" role="tab">Question bank</button>
    <button class="tab" data-view="traps" role="tab">Trap review <span class="badge" id="srBadge">0</span></button>
    <button class="tab" data-view="dash" role="tab">Domain dashboard</button>
    <button class="tab" data-view="cheat" role="tab">Cheat sheet</button>
    <button class="tab" data-view="lib" role="tab">Library</button>
  </div>
</header>

<div class="wrap" id="wrap">
  <nav class="side" aria-label="Chapters" id="sidenav">
    <h2>Chapters</h2>
    <div id="navlist"></div>
    <div class="tools">
      <button id="btnToday">Jump to today</button>
      <button id="btnExport">Export progress (copy JSON)</button>
      <button id="btnImport">Import progress (paste JSON)</button>
      <button id="btnReset">Reset all progress</button>
      <div class="storenote" id="storeNote"></div>
    </div>
  </nav>

  <main id="main">
    <div class="view on" id="view-plan"></div>
    <div class="view" id="view-quiz"></div>
    <div class="view" id="view-traps"></div>
    <div class="view" id="view-dash"></div>
    <div class="view" id="view-cheat"></div>
    <div class="view" id="view-lib"></div>
  </main>
</div>

<script>
/* ============================================================
   DATA — exam domains (official weights), chapters, lessons,
   study material, per-day detail, self-checks, traps, cheat lines
   ============================================================ */
const EXAM_DATE = "2026-11-03";

const DOMAINS = {
  AI:  {name:"Applications & Integration",     weight:33.1, color:"#0b7a75"},
  MSO: {name:"Model Selection & Optimisation",  weight:16.8, color:"#1d6fb8"},
  AW:  {name:"Agents & Workflows",               weight:14.7, color:"#6b4fbb"},
  PCE: {name:"Prompt & Context Engineering",     weight:11.0, color:"#c2711c"},
  TM:  {name:"Tools & MCPs",                     weight:10.6, color:"#2e8b57"},
  SS:  {name:"Security & Safety",                weight:8.1,  color:"#8a2f2f"},
  CC:  {name:"Claude Code",                      weight:3.1,  color:"#5c6b8a"},
  ETD: {name:"Eval, Testing & Debugging",        weight:2.6,  color:"#9a7b1c"}
};
const CHAPTERS = [
{
 id:"ch0", num:"0", title:"Setup, accounts and the eligibility gate", domain:"Getting ready", keys:[],
 goal:"Everything administrative is out of the way so that from Chapter 1 every session is pure learning.",
 start:"2026-09-05", end:"2026-09-06",
 lessons:[

 notes:`<h4>Exam facts</h4>
<ul><li>53 questions, multiple-choice and multiple-response (each item says how many to select). Scenario-heavy: most stems describe a situation and ask for the best next step.</li>
<li>120 minutes of exam time; the 135-minute booking includes NDA and tutorial.</li>
<li>Pass = 720 scaled on a 100–1000 scale (not a raw 72%). Scaling means some items count more than others; you cannot game it, so aim for 80%+ on practice.</li>
<li>USD 125 per attempt; credential valid 12 months. Retake waits: 14 days after the 1st fail, 30 after the 2nd, 90 after the 3rd; maximum four attempts in a rolling 12 months.</li>
<li>Reschedule or cancel at least 24 hours before the appointment. Renewal is a free, non-proctored Partner Academy assessment; a lapsed credential means a full retake.</li>
<li>Target audience per the guide: 1–5 years software experience, 6+ months hands-on Claude, Python/TypeScript, REST, CLI, MCP — i.e. it tests engineering judgement as much as API trivia.</li></ul>
<h4>Domain weights and sub-skills (from the official exam guide)</h4>
<table><thead><tr><th>Domain</th><th>Weight</th><th>≈ Qs</th><th>Sub-skills (weight)</th><th>Where</th></tr></thead><tbody>
<tr><td>Applications &amp; Integration</td><td>33.1%</td><td>17–18</td><td>Understanding Requirements 3.4 · Systems Life Cycle 2.8 · Claude API Mechanics 6.8 · Software Engineering Foundations 7.4 · Claude Application Design 8.6 · Configuration Management 4.1</td><td>Ch 1, 2 + Library gap entries</td></tr>
<tr><td>Model Selection &amp; Optimisation</td><td>16.8%</td><td>9</td><td>LLM Fundamentals 5.2 · Technical Fundamentals (SDK integration, websockets) 6.1 · Model Selection &amp; Trade-offs 2.7 · Cost &amp; Token Management 2.8</td><td>Ch 3</td></tr>
<tr><td>Agents &amp; Workflows</td><td>14.7%</td><td>8</td><td>Agent Architecture 4.5 · Agent Construction (Agent SDK, custom loops, deployment) 5.3 · Agent Patterns (LangGraph etc., memory) 4.9</td><td>Ch 4</td></tr>
<tr><td>Prompt &amp; Context Engineering</td><td>11.0%</td><td>6</td><td>Context Engineering 3.8 · Prompt Engineering 4.6 · Output Handling (structured output, validation, defensive parsing) 2.6</td><td>Ch 3</td></tr>
<tr><td>Tools &amp; MCPs</td><td>10.6%</td><td>5–6</td><td>Tool Implementation 4.4 · MCP Server Development 2.1 · Agentic Customization (tools vs Skills vs MCP) 4.1</td><td>Ch 2, 5</td></tr>
<tr><td>Security &amp; Safety</td><td>8.1%</td><td>4</td><td>AI Application Security 3.2 · Guardrails &amp; Safe Deployment 2.3 · Claude Hooks 1.0 · Identity &amp; Secrets 1.6</td><td>Ch 7 (+6)</td></tr>
<tr><td>Claude Code</td><td>3.1%</td><td>1–2</td><td>Rules, Skills, Commands, Agents, Agent Memory; sessions, slash commands, headless/streaming</td><td>Ch 6</td></tr>
<tr><td>Eval, Testing &amp; Debugging</td><td>2.6%</td><td>1–2</td><td>Error identification, recovery strategies, trace analysis</td><td>Ch 7</td></tr></tbody></table>
<div class="tip"><b>Effort allocation:</b> Chapters 1–3 cover about 61% of the exam. If you fall behind, protect those and compress Chapter 6 (Claude Code is ~2 questions, and you use it daily). Note that roughly 22 points of the biggest domain are general engineering (requirements, life cycle, SE foundations, application design) — the five "blueprint gap" entries in the Library cover them; read them in Chapters 1 and 3.</div>
<h4>The three official sample questions</h4>
<ul><li>Domain 2 — 10,000 documents to process overnight cost-effectively → <b>Message Batches API</b> (asynchronous, within 24 h, reduced cost).</li>
<li>Domain 7 — hidden text in a document tries to redirect the model → <b>treat content as untrusted, isolate it from trusted instructions, use guardrails/hooks</b>.</li>
<li>Domain 8 — make an inventory REST API reusable across several apps → <b>build an MCP server exposing the operations as tools</b>.</li>
<li>Pattern: every sample rewards the Anthropic-recommended architecture, not the cleverest one.</li></ul>
<h4>Daily routine (1.5 h)</h4>
<ul><li>45 min learn from the docs or course → 45 min build the day's lab. Each day below has a <b>Read</b> list, numbered <b>Steps</b> and a <b>Done when</b> line — tick the day only when that line is true.</li>
<li>Build every lab <b>with Claude Code</b>, not by hand — end each session with <code>/cost</code> and note tokens used.</li>
<li>Keep one <code>notes/&lt;domain&gt;.md</code> per chapter; it becomes your revision sheet in Chapter 8.</li>
<li>Sunday = review day: finish the notes file, do the chapter Self-check, take the domain quiz in the Question bank tab, fill the Weekly retrospective.</li>
<li>Every day, before anything else: open the <b>Trap review</b> tab and clear what is due (2–5 minutes).</li></ul>
<h4>Lab repo layout</h4>
<pre><code>ccdvf-lab/
  .env                # ANTHROPIC_API_KEY=...  (git-ignored)
  CLAUDE.md           # written properly in Chapter 6
  docs/               # exam guide, confirmation
  notes/              # one .md per chapter → cheat sheet
  ch1/ ch2/ ... ch7/  # one folder per chapter's scripts
  evals/              # Chapter 7
  mcp_server/         # Chapter 5
  tests/</code></pre>`,

 notes:`<h4>The request, field by field</h4>
<table><thead><tr><th>Field</th><th>Required</th><th>What it does / what to remember</th></tr></thead><tbody>
<tr><td><code>model</code></td><td>yes</td><td>Model ID. Dated IDs (claude-sonnet-4-5-20250929) are pinned; aliases (claude-sonnet-4-5) move to the latest snapshot.</td></tr>
<tr><td><code>max_tokens</code></td><td>yes</td><td>Hard cap on <b>output</b> tokens only. Hitting it sets <code>stop_reason: max_tokens</code>. It does not affect input.</td></tr>
<tr><td><code>messages</code></td><td>yes</td><td>Array of {role, content}. Roles alternate user/assistant; first must be user. Content is a string or a list of content blocks.</td></tr>
<tr><td><code>system</code></td><td>no</td><td>Top-level string or list of text blocks. Not a message role. Best place for role, rules, stable context (and a cache breakpoint).</td></tr>
<tr><td><code>temperature</code></td><td>no</td><td>0–1 randomness (classic: 0 for extraction/classification, higher for creative). Does not change length or cost. <b>Now:</b> non-default temperature/top_p/top_k return 400 on Claude 4.7+ and were removed from the Python SDK v1 — omit them on current models.</td></tr>
<tr><td><code>top_p</code>, <code>top_k</code></td><td>no</td><td>Alternative sampling controls (legacy); adjust temperature <i>or</i> top_p, never both.</td></tr>
<tr><td><code>stop_sequences</code></td><td>no</td><td>Custom strings that end generation; sets <code>stop_reason: stop_sequence</code> and reports which one in <code>stop_sequence</code>.</td></tr>
<tr><td><code>stream</code></td><td>no</td><td>true → server-sent events.</td></tr>
<tr><td><code>tools</code>, <code>tool_choice</code></td><td>no</td><td>Chapter 2.</td></tr>
<tr><td><code>metadata.user_id</code></td><td>no</td><td>Opaque ID for abuse tracking; never put PII in it.</td></tr>
<tr><td><code>thinking</code></td><td>no</td><td>{type:enabled, budget_tokens} on models with manual thinking; {type:adaptive} on 4.6+ (Chapter 3).</td></tr>
<tr><td><code>output_config</code></td><td>no</td><td><code>effort</code> (low…max) and <code>format</code> = {type:json_schema, schema} for structured outputs.</td></tr></tbody></table>
<h4>The response</h4>
<ul><li><code>id</code>, <code>type: "message"</code>, <code>role: "assistant"</code>, <code>model</code>.</li>
<li><code>content</code>: a <b>list</b> of blocks — <code>text</code>, <code>tool_use</code>, <code>thinking</code>. Never assume content[0] is text once tools or thinking are on.</li>
<li><code>stop_reason</code>: <code>end_turn</code> (natural finish), <code>max_tokens</code> (truncated), <code>stop_sequence</code> (hit your string), <code>tool_use</code> (wants a tool), <code>refusal</code> (safety classifier — still HTTP 200), <code>pause_turn</code> (long server-tool turns — send it back to continue), <code>model_context_window_exceeded</code> (input + max_tokens over the window).</li>
<li><code>usage</code>: <code>input_tokens</code>, <code>output_tokens</code>, and with caching <code>cache_creation_input_tokens</code>, <code>cache_read_input_tokens</code>. This is how you cost a call.</li></ul>
<h4>Statelessness and conversation history</h4>
<ul><li>The API keeps nothing between calls. Every request carries the whole history, so input tokens grow every turn — the reason context management (Chapter 3) and caching (Chapter 2) exist.</li>
<li>Consecutive same-role messages are an error on most models; merge them into one message with several content blocks.</li></ul>
<h4>Streaming</h4>
<ul><li>Event order: <code>message_start</code> → (<code>content_block_start</code> → <code>content_block_delta</code>* → <code>content_block_stop</code>)* → <code>message_delta</code> (carries stop_reason and output usage) → <code>message_stop</code>.</li>
<li>Delta types: <code>text_delta</code>, <code>input_json_delta</code> (tool arguments arrive as partial JSON), <code>thinking_delta</code>.</li>
<li>Streaming improves <b>perceived</b> latency and lets you show progress; it does not change cost or total time. Use it for anything user-facing; also recommended for long outputs to avoid HTTP timeouts.</li>
<li>The SDK helper <code>messages.stream()</code> accumulates the final message for you; the raw <code>stream=True</code> form gives you events.</li></ul>
<h4>Controlling the output shape</h4>
<ul><li><b>Instruction</b> in system: "Respond only with JSON matching…". Cheap, not guaranteed.</li>
<li><b>Prefill</b> (legacy): put a partial assistant message last (e.g. <code>{</code> or <code>&lt;answer&gt;</code>) — Claude continues from it; removes preambles. Never worked with extended thinking, and is a <b>400 error on Claude 4.6+</b>. The exam may still present it as a valid technique — know how it worked.</li>
<li><b>stop_sequences</b>: stop at <code>&lt;/answer&gt;</code> or a closing brace to avoid trailing chatter.</li>
<li><b>Tool use as a schema</b>: define a tool whose input_schema is your desired JSON and force it with tool_choice — the classic guaranteed-structure trick.</li>
<li><b>Structured outputs</b>: <code>output_config.format = {type:"json_schema", schema}</code> (or <code>strict: true</code> on a tool) constrains generation to the schema — GA on Sonnet 4.5+/Opus 4.5+/Haiku 4.5. Output can still be off-schema when stop_reason is refusal or max_tokens, so check stop_reason first.</li>
<li>Always validate and retry anyway; treat model output as untrusted input.</li></ul>
<h4>Vision and documents</h4>
<ul><li>Images are content blocks: <code>{"type":"image","source":{"type":"base64"|"url", ...}}</code>. Formats JPEG/PNG/GIF/WebP; several images per request; put images before the question text.</li>
<li>PDFs go in as <code>document</code> blocks (base64, URL or file_id via the Files API); Claude sees both extracted text and page images, so tables and charts work. Page limits exist — check the docs for your model.</li>
<li>Image tokens ≈ ceil(width/28) × ceil(height/28) (older docs said width×height/750 — same order of magnitude: a 1000×1000 image ≈ 1,300 tokens). Max 10 MB (5 MB on Bedrock/Vertex), auto-downscaled to a 1568 px long edge; resize before sending.</li></ul>
<div class="trap"><b>Exam traps:</b> "Which parameter controls response length?" → max_tokens, not temperature. "Why did the answer cut off mid-sentence?" → stop_reason=max_tokens. System prompt is not a message. Streaming does not reduce cost. Prefill goes in the <i>assistant</i> role, as the last message (legacy on 4.6+). content is a list, not a string. A refusal is HTTP 200 with stop_reason refusal.</div>
<h4>Minimal call</h4>
<pre><code>from anthropic import Anthropic
client = Anthropic()          # reads ANTHROPIC_API_KEY
r = client.messages.create(
    model="claude-sonnet-5",
    max_tokens=512,
    system="You are a concise DevOps assistant.",
    messages=[{"role":"user","content":"Explain a Kubernetes liveness probe in 2 lines."}],
)
print(r.content[0].text, r.stop_reason, r.usage)</code></pre>
<h4>Streaming with the SDK helper</h4>
<pre><code>with client.messages.stream(model="claude-sonnet-5", max_tokens=800,
        messages=[{"role":"user","content":"Write a haiku about Terraform state."}]) as s:
    for text in s.text_stream:
        print(text, end="", flush=True)
final = s.get_final_message()
print("\\n", final.stop_reason, final.usage.output_tokens)</code></pre>`,

 notes:`<h4>Tool use — the loop</h4>
<ol><li>You send <code>tools</code> (name, description, JSON <code>input_schema</code>) with the messages.</li>
<li>Claude replies with <code>stop_reason: tool_use</code> and one or more <code>tool_use</code> blocks: <code>{id, name, input}</code>.</li>
<li><b>Your code</b> runs the function. Claude never executes anything for client tools.</li>
<li>You append the assistant message unchanged, then a <b>user</b> message whose content is <code>tool_result</code> blocks: <code>{type:"tool_result", tool_use_id, content, is_error?}</code> — one per tool_use, same ids, all in one message, and the tool_result blocks must come <b>first</b> in that message before any text. <code>strict: true</code> on a tool definition makes arguments conform exactly to the schema.</li>
<li>Repeat until <code>stop_reason: end_turn</code>.</li></ol>
<ul><li>Descriptions are the most important part of a tool definition — say what it does, when to use it, what it returns, and what the arguments mean. Anthropic recommends 3–4+ sentences.</li>
<li><b>tool_choice</b>: <code>{"type":"auto"}</code> (default, may answer without tools), <code>{"type":"any"}</code> (must call some tool), <code>{"type":"tool","name":"x"}</code> (must call that one — the JSON-schema trick), <code>{"type":"none"}</code> (no tools this turn). <code>disable_parallel_tool_use: true</code> forces one call at a time.</li>
<li>Parallel tool use: several tool_use blocks in one response — return all results in a single user message, in the same order.</li>
<li>Mark failures with <code>is_error: true</code> so Claude retries or explains instead of hallucinating a result.</li>
<li>Tool results can contain text and image blocks; keep them small — they are input tokens on every later turn.</li>
<li><b>Server tools</b> (web search, web fetch, code execution, MCP connector) run on Anthropic's side; their results come back directly — you never send a tool_result for them. Text editor, bash, computer use and memory are Anthropic-defined <i>client</i> tools you still execute.</li></ul>
<h4>Prompt caching</h4>
<ul><li>Add <code>cache_control: {"type":"ephemeral"}</code> to a block; the cached prefix is everything <b>up to and including</b> that block, in this order: tools → system → messages. Up to 4 breakpoints.</li>
<li>Pricing: cache <b>write</b> ≈ 1.25× base input (5-min TTL) or 2× (1-hour TTL); cache <b>read</b> ≈ 0.1× base input. Break-even after roughly two reads.</li>
<li>Minimum cacheable prefix depends on the model: 512 tokens (Opus 5, Fable 5.x), 1,024 (Sonnet 5, Sonnet 4.5/4.6, Opus 4.8), 2,048 (Opus 4.7), 4,096 (Opus 4.5/4.6, Haiku 4.5). Shorter prefixes are silently not cached.</li>
<li>TTL 5 minutes by default, refreshed on every hit; optional <code>ttl: "1h"</code>.</li>
<li>Any change before the breakpoint (including tool definitions, images, or the model) invalidates the cache — stable content first, volatile content last. For chat, put the breakpoint on the latest message so the growing history is cached incrementally.</li>
<li>You confirm hits via <code>usage.cache_read_input_tokens</code>. Caching cuts cost and time-to-first-token; it never reduces output tokens.</li></ul>
<h4>Message Batches</h4>
<ul><li>Asynchronous: submit up to 100,000 requests (or ~256 MB), each with a <code>custom_id</code>; results within 24 h, usually much faster; <b>50% off</b> input and output. Works with caching and tools.</li>
<li>Lifecycle: <code>in_progress</code> → <code>ended</code>; then per-request result type <code>succeeded</code> / <code>errored</code> / <code>canceled</code> / <code>expired</code>. Results are available for 29 days. Order is not guaranteed — always join on custom_id.</li>
<li>Use for evals, backfills, bulk classification, nightly summaries. Never for anything interactive.</li></ul>
<h4>Errors, limits and resilience</h4>
<table><thead><tr><th>Code</th><th>Meaning</th><th>Whose fault</th><th>Do</th></tr></thead><tbody>
<tr><td>400</td><td>invalid_request_error</td><td>you</td><td>fix the request (roles, max_tokens, schema)</td></tr>
<tr><td>401</td><td>authentication_error</td><td>you</td><td>check key/env</td></tr>
<tr><td>403</td><td>permission_error</td><td>you</td><td>key lacks access</td></tr>
<tr><td>404</td><td>not_found_error</td><td>you</td><td>wrong model id / resource</td></tr>
<tr><td>413</td><td>request_too_large</td><td>you</td><td>shrink input</td></tr>
<tr><td>429</td><td>rate_limit_error</td><td>volume</td><td>honour <code>retry-after</code>; backoff; batch</td></tr>
<tr><td>500</td><td>api_error</td><td>Anthropic</td><td>retry with backoff</td></tr>
<tr><td>529</td><td>overloaded_error</td><td>Anthropic</td><td>retry with backoff + jitter, degrade gracefully</td></tr></tbody></table>
<ul><li>Rate limits are per organisation per model: requests/min, input tokens/min, output tokens/min; tiers rise with spend. Headers report remaining quota.</li>
<li>The SDK retries 408/409/429/5xx and connection errors twice by default with backoff; tune <code>max_retries</code> and <code>timeout</code>. Make writes idempotent; log request ids (<code>request-id</code> header / <code>_request_id</code>) for support.</li>
<li>Long requests: stream, or the SDK may reject non-streaming calls expected to exceed ~10 minutes.</li></ul>
<div class="trap"><b>Exam traps:</b> Who executes a client tool? Always your code (server tools need no tool_result). tool_result goes in a <i>user</i> message, first in the content list, and must match every tool_use id. Caching reduces cost and latency but not output tokens. Batch cannot power a live chat UI. 429 is not a bug in your code — back off or move to batch. Cache prefix order is tools → system → messages. Cache reads don't count against ITPM rate limits.</div>
<h4>Tool loop skeleton</h4>
<pre><code>REGISTRY = {"get_time": get_time, "get_weather": get_weather}
def run(messages, tools, max_iter=8):
    for _ in range(max_iter):
        r = client.messages.create(model=MODEL, max_tokens=1024, tools=tools, messages=messages)
        messages.append({"role":"assistant","content": r.content})
        if r.stop_reason != "tool_use":
            return r
        results = []
        for b in r.content:
            if b.type == "tool_use":
                try:
                    out = REGISTRY[b.name](**b.input)
                    results.append({"type":"tool_result","tool_use_id":b.id,"content":str(out)})
                except Exception as e:
                    results.append({"type":"tool_result","tool_use_id":b.id,"content":str(e),"is_error":True})
        messages.append({"role":"user","content": results})
    raise RuntimeError("tool loop exceeded max_iter")</code></pre>
<h4>Caching a system prompt</h4>
<pre><code>r = client.messages.create(
    model=MODEL, max_tokens=300,
    system=[{"type":"text","text": BIG_STABLE_CONTEXT,
             "cache_control":{"type":"ephemeral"}}],
    messages=[{"role":"user","content":"Question about the context…"}])
print(r.usage.cache_creation_input_tokens, r.usage.cache_read_input_tokens)</code></pre>`,

 notes:`<h4>Model selection</h4>
<table><thead><tr><th>Tier</th><th>Strength</th><th>Typical use</th><th>Relative cost</th></tr></thead><tbody>
<tr><td><b>Haiku</b></td><td>fastest, cheapest</td><td>classification, extraction, routing, moderation pre-checks, high-volume simple Q&amp;A, sub-agents doing narrow jobs</td><td>lowest</td></tr>
<tr><td><b>Sonnet</b></td><td>best balance</td><td>default for apps, coding, RAG chat, agents with tools</td><td>middle</td></tr>
<tr><td><b>Opus</b></td><td>deepest reasoning</td><td>complex multi-step agents, hard analysis, orchestrator in multi-agent systems, when quality dominates cost</td><td>highest</td></tr></tbody></table>
<ul><li><b>Start small</b>: pick the smallest model that passes your eval; escalate only on measured failure. Route: cheap model first, escalate on low confidence or a "needs expert" classification.</li>
<li>Current lineup (Sep 2026): Fable 5.1, Opus 5 and Sonnet 5 have a 1M context window and 128K max output; Haiku 4.5 has 200K / 64K. No long-context surcharge. Prices per MTok in/out: Fable 5.1 $10/$50 · Opus 5 $5/$25 · Sonnet 5 $2/$10 · Haiku 4.5 $1/$5.</li>
<li>Pin model IDs in production so behaviour is stable. Pre-4.6 models have dated snapshots (<code>claude-sonnet-4-5-20250929</code>) plus rolling aliases (<code>claude-sonnet-4-5</code>) — aliases are for experiments; 4.6+ IDs (<code>claude-sonnet-5</code>) are dateless but already pinned snapshots. Deprecations get ≥60 days' notice; migrate by re-running evals on the new snapshot. All Claude 3.x models are retired.</li>
<li>Cloud availability: the same models are on Amazon Bedrock, Google Vertex AI and Microsoft Foundry — model IDs differ per platform; the SDK has platform-specific clients.</li></ul>
<h4>Cost ladder (do in this order, measure between rungs)</h4>
<ol><li><b>Trim</b> the prompt and outputs: remove boilerplate, cap <code>max_tokens</code>, ask for terse formats.</li>
<li><b>Cache</b> the stable prefix (system, tools, documents) — biggest win for repeated context.</li>
<li><b>Batch</b> anything non-interactive — flat 50% off.</li>
<li><b>Downgrade</b> the model where the eval still passes; route the hard cases up.</li>
<li>Reduce <b>thinking</b> budget or effort on tasks that do not need it.</li></ol>
<ul><li>Measure with <code>usage</code> and <code>count_tokens</code> first — do not optimise blind. Output tokens cost ~5× input; thinking is output.</li></ul>
<h4>Prompt engineering — Anthropic's technique order</h4>
<ol><li><b>Be clear and direct</b>: state the task, audience, success criteria, constraints; give context on why. Imagine handing it to a capable new colleague.</li>
<li><b>Examples (multishot)</b>: 3–5 diverse, relevant examples wrapped in <code>&lt;example&gt;</code> tags — the single most effective lever for format and tone.</li>
<li><b>Let Claude think</b>: chain of thought — "think step by step" or structured <code>&lt;thinking&gt;</code>/<code>&lt;answer&gt;</code> tags; or turn on extended thinking.</li>
<li><b>XML tags</b>: separate instructions, context, examples, documents (<code>&lt;document&gt;</code>, <code>&lt;instructions&gt;</code>) so nothing is confused for anything else. Tags are also the safe way to fence untrusted content.</li>
<li><b>Give Claude a role</b> via the system prompt ("You are a senior SRE reviewing Terraform…") — changes tone, depth, and what it notices.</li>
<li><b>Prefill</b> the response to force format or skip preamble.</li>
<li><b>Chain prompts</b>: split complex work into sequential calls, each verifiable.</li>
<li><b>Long-context tips</b>: documents at the top (~20k+ tokens), query at the bottom; ask for quotes first; structure multiple docs with metadata tags.</li></ol>
<h4>Extended thinking and effort</h4>
<ul><li>Manual mode: <code>thinking: {type:"enabled", budget_tokens: N}</code>; N ≥ 1,024 and below <code>max_tokens</code> (Haiku 4.5 and 4.5-era models). Adaptive mode: <code>thinking: {type:"adaptive"}</code> plus <code>output_config: {effort: low|medium|high|xhigh|max}</code> on 4.6+ — manual budget_tokens is a 400 on 4.7+/Opus 5/Sonnet 5. Thinking blocks come back in content (summarised) and are billed as output tokens.</li>
<li>Helps: maths, multi-step planning, complex analysis, agentic decisions. Wastes money: lookups, classification, formatting, retrieval-style Q&amp;A.</li>
<li>Constraints: no prefill; with tool use you pass thinking blocks back unchanged (signature validated); tool_choice any/tool is not allowed with manual thinking; interleaved thinking (between tool calls) is automatic in adaptive mode. 4.6+ keeps prior-turn thinking in context (billed as input).</li>
<li><b>Effort</b> (low / medium / high / xhigh / max, default high) shapes the whole response — text, tool calls and thinking depth; it is a signal, not a hard budget; changing it at the top level invalidates the message cache.</li></ul>
<h4>Context engineering</h4>
<ul><li>The window is a budget: system + tools + history + documents + <b>output</b> must fit. Exceeding it is a 400 error (or a truncation with some settings).</li>
<li>Strategies: summarise or drop old turns; keep the last N turns verbatim; store long-term facts in a retrieval layer and inject only what is relevant (RAG); keep the system prompt stable so it caches; put volatile content last.</li>
<li>Newer platform features automate this: context editing (auto-clear old tool results), compaction, and memory tools for agents.</li>
<li>Attention degrades with size — "lost in the middle" — so place the most important material at the start and end, and ask for quotes to ground answers.</li></ul>
<div class="trap"><b>Exam traps:</b> "Fastest way to cut cost" is caching or a smaller model, not lowering temperature. Temperature controls randomness, not length or cost (and is rejected on Claude 4.7+). Thinking tokens are billed as output; budget_tokens ≥ 1,024 and < max_tokens. Aliases are not pinned. Cached tokens still count toward the context window. The first technique to try is always clearer instructions, not examples or thinking. Docs go before the question, not after.</div>
<h4>Structured prompt template</h4>
<pre><code>system = """You are a senior SRE. Review Terraform plans for risk.
&lt;rules&gt;
- Flag any destroy of a stateful resource as HIGH.
- Output only the JSON described in &lt;output_format&gt;.
&lt;/rules&gt;
&lt;output_format&gt;{"risk":"LOW|MEDIUM|HIGH","findings":[{"resource":"","why":""}]}&lt;/output_format&gt;
&lt;example&gt;…&lt;/example&gt;"""
user = f"&lt;plan&gt;{plan_text}&lt;/plan&gt;\\nClassify the risk of this plan."</code></pre>`,

 notes:`<h4>Definitions (Anthropic's framing)</h4>
<ul><li><b>Augmented LLM</b>: one model call with retrieval, tools and memory — the building block.</li>
<li><b>Workflow</b>: LLM calls orchestrated by <i>code</i> along predefined paths. Predictable, testable, cheap, easy to debug. Prefer this whenever the steps are known.</li>
<li><b>Agent</b>: the <i>model</i> decides the path — choosing tools in a loop, observing results, until done. Use only when the task genuinely needs open-ended decisions and the number of steps is unknown. Costs more, harder to test, needs guardrails.</li>
<li>Rule: find the simplest solution possible; increase complexity only when it demonstrably improves outcomes. Many "agent" requests are really a single well-crafted prompt.</li></ul>
<h4>The five workflow patterns</h4>
<table><thead><tr><th>Pattern</th><th>Shape</th><th>Use when</th><th>Watch out</th></tr></thead><tbody>
<tr><td><b>Prompt chaining</b></td><td>A → gate → B → C</td><td>task decomposes into fixed steps; add programmatic checks between steps</td><td>more latency; each step must be verifiable</td></tr>
<tr><td><b>Routing</b></td><td>classify → specialised prompt/model</td><td>distinct input categories handled differently (support tiers, cheap vs expensive model)</td><td>misroutes; keep the classifier cheap and evaluated</td></tr>
<tr><td><b>Parallelisation</b></td><td><i>sectioning</i> (split work) or <i>voting</i> (same task N times)</td><td>independent subtasks; need multiple perspectives or confidence</td><td>cost × N; aggregation logic</td></tr>
<tr><td><b>Orchestrator–workers</b></td><td>lead model plans sub-tasks dynamically, delegates, merges</td><td>sub-tasks not predictable in advance (multi-file code change, research)</td><td>token cost; workers need clear briefs and return summaries</td></tr>
<tr><td><b>Evaluator–optimizer</b></td><td>generator ↔ critic loop</td><td>clear evaluation criteria and iteration measurably helps (translation, code with tests)</td><td>infinite loops — cap iterations</td></tr></tbody></table>
<h4>The agent loop</h4>
<ul><li>Receive task → (model reasons → picks tool → your code runs it → result appended) × N → model signals done. Ground truth comes from tool results, so tool result quality drives agent quality.</li>
<li>Always give the agent: a clear goal and stopping condition, a small well-described tool set, max turns, a budget, and checkpoints for human approval before side effects.</li>
<li>Failure modes and guards: <b>loops</b> → loop detection + max turns; <b>runaway cost</b> → token/USD budget; <b>hallucinated tools/args</b> → strict schemas, is_error feedback; <b>lost context</b> → compaction, memory/scratchpad files, subagents; <b>destructive actions</b> → permission callbacks/hooks, dry-run tools.</li></ul>
<h4>Claude Agent SDK</h4>
<ul><li>The framework behind Claude Code, exposed as a library (Python and TypeScript). You describe the task; it runs the loop with built-in tools (file read/edit, bash, grep, web), permission handling, automatic context compaction, CLAUDE.md/project context, MCP servers, subagents, hooks and session persistence.</li>
<li>Key knobs: <code>allowed_tools</code> / disallowed tools, <code>permission_mode</code>, <code>max_turns</code>, system prompt, MCP config, custom tools (in-process MCP), subagent definitions.</li>
<li>Use it when you want an agent that acts on files/systems; use the raw Messages API when you want tight control or a simple workflow.</li></ul>
<h4>Subagents, memory, state</h4>
<ul><li>A subagent runs in its <b>own context window</b> with its own system prompt and tool set and returns a result to the parent. Benefits: isolation, parallelism, specialised roles. Cost: extra tokens; the parent only sees a summary — brief it well.</li>
<li>Short-term memory = the context window; long-term = files, a memory tool, a database, or a retrieval store the agent reads and writes.</li>
<li>Sessions can be persisted and resumed; design tasks to be resumable and idempotent.</li></ul>
<h4>Server tools and Skills</h4>
<ul><li><b>Server tools</b> (web search, web fetch, code execution, computer use, text editor, bash) execute on Anthropic's infrastructure; you add them to <code>tools</code> and get results and citations back without running anything.</li>
<li><b>Skills</b>: folders of instructions (SKILL.md) plus scripts/resources that Claude loads progressively when the task matches — knowledge and procedures, not actions. Tools do things; Skills teach how.</li>
<li><b>MCP</b> (Chapter 5): a standard way to plug external tools/resources into any client.</li></ul>
<div class="trap"><b>Exam traps:</b> Simplest solution wins — a single prompt or a workflow before an agent. If steps are predictable, it's a workflow. Subagents get their own context window (isolation, but extra cost and only a summary returns). Human approval belongs <i>before</i> destructive actions. Parallelisation is code-driven; orchestrator–workers is model-driven. Evaluator–optimizer needs a cap.</div>
<h4>Agent SDK minimal (Python)</h4>
<pre><code>import asyncio
from claude_agent_sdk import query, ClaudeAgentOptions

async def main():
    opts = ClaudeAgentOptions(
        allowed_tools=["Read","Grep","Glob"],   # read-only
        max_turns=10,
        system_prompt="You are a code reviewer. Report, don't edit.")
    async for msg in query(prompt="Find error handling gaps in src/", options=opts):
        print(msg)
asyncio.run(main())</code></pre>`,

 notes:`<h4>Why MCP</h4>
<ul><li>An open protocol (JSON-RPC 2.0) so any <b>client</b> (Claude Code, Claude.ai, Cursor, your app) can use any <b>server</b> (GitHub, Postgres, Jira, your internal API) without bespoke glue — "USB-C for AI tools". It turns an N clients × M integrations problem into N + M.</li></ul>
<h4>Architecture and lifecycle</h4>
<ul><li><b>Host</b> = the application the user runs (Claude Code, Claude Desktop). <b>Client</b> = the connection object inside the host, one per server. <b>Server</b> = the process exposing capabilities.</li>
<li>Lifecycle (as the exam was written, 2025 revisions): <code>initialize</code> (protocol version + capability negotiation) → <code>initialized</code> notification → operation → shutdown. The 2026-07-28 revision made MCP stateless: a <code>server/discover</code> request replaces initialize and every request carries version/capabilities in <code>_meta</code>; sampling and logging were deprecated. Know both.</li>
<li>Transports: <b>stdio</b> — the host spawns the server as a child process and talks over stdin/stdout (local, simplest, no network). <b>Streamable HTTP</b> — server at a URL, HTTP POST plus optional SSE streaming, supports sessions and auth (OAuth 2.1) — for remote/shared servers. (Older "HTTP+SSE" transport is deprecated.)</li></ul>
<h4>Server primitives</h4>
<table><thead><tr><th>Primitive</th><th>What</th><th>Controlled by</th><th>Methods</th></tr></thead><tbody>
<tr><td><b>Tools</b></td><td>executable actions with a JSON schema</td><td>the model (it decides to call)</td><td>tools/list, tools/call</td></tr>
<tr><td><b>Resources</b></td><td>data to read (files, records) identified by URI</td><td>the application/host (decides what to expose to context)</td><td>resources/list, resources/read, templates</td></tr>
<tr><td><b>Prompts</b></td><td>reusable prompt templates with arguments</td><td>the user (invoked explicitly, e.g. slash commands)</td><td>prompts/list, prompts/get</td></tr></tbody></table>
<ul><li>Client primitives (offered by the host to the server): <b>roots</b> (filesystem boundaries), <b>sampling</b> (server requests an LLM completion through the client), <b>elicitation</b> (server asks the user for input).</li>
<li>Servers can notify <code>listChanged</code> when tools/resources change; tool results carry <code>isError</code> for execution failures, distinct from protocol errors.</li></ul>
<h4>In Claude Code</h4>
<ul><li><code>claude mcp add &lt;name&gt; -- &lt;command&gt;</code> (stdio) or <code>--transport http &lt;url&gt;</code>. Scopes: <b>local</b> (default; you, this project; in ~/.claude.json) → <b>project</b> (<code>.mcp.json</code> in the repo, committed, shared with the team; Claude Code asks for approval before using it) → <b>user</b> (all your projects). Local overrides project overrides user.</li>
<li><code>/mcp</code> shows status and handles OAuth logins; tools appear as <code>mcp__server__tool</code> and can be allow-listed in settings permissions; server prompts appear as slash commands; resources can be referenced with @.</li>
<li>Environment variable expansion is supported in .mcp.json for secrets — never commit keys.</li></ul>
<h4>MCP in the API and the Agent SDK</h4>
<ul><li><b>MCP connector</b>: pass <code>mcp_servers=[{type:"url", url, name, authorization_token?}]</code> plus an <code>mcp_toolset</code> entry in <code>tools</code> (beta header mcp-client-2025-11-20); the API connects, lists tools and executes calls server-side — you receive <code>mcp_tool_use</code> / <code>mcp_tool_result</code> blocks. Only remote HTTPS servers; only tools (not resources/prompts).</li>
<li>Agent SDK: <code>mcp_servers</code> option accepts stdio, HTTP, and in-process servers; tools are named <code>mcp__name__tool</code> and gated by allowed_tools.</li></ul>
<h4>Tool use vs MCP — choosing</h4>
<ul><li><b>Plain tool use</b>: one app, private functions, you own the loop and the code path, lowest latency, no extra process. Best for product features.</li>
<li><b>MCP</b>: reuse across many clients, standard discovery, third-party servers, team-shared integrations, letting Claude Code/Desktop reach your systems. Both end up as tools from the model's point of view.</li>
<li>Skills (know-how) complement both; they are not a transport for actions.</li></ul>
<h4>Security</h4>
<ul><li>Tool results and resource contents are <b>untrusted input</b> — possible prompt injection; keep them fenced and never let them change permissions.</li>
<li>Threats named in the spec: tool poisoning (malicious descriptions), rug pulls (server changes after approval), confused-deputy problems with OAuth proxies, token passthrough (server forwarding client tokens), session hijacking. Mitigations: least privilege and roots, explicit user consent for tools, validate inputs, pin/verify servers, separate credentials, human approval for side effects.</li></ul>
<div class="trap"><b>Exam traps:</b> Resources are not tools — the application reads them; the model calls tools. Project-scope <code>.mcp.json</code> is the one you commit for the team. stdio is local only; remote needs Streamable HTTP. The MCP connector in the API executes tools server-side (unlike client tools). Tool results are untrusted input.</div>
<h4>Minimal server (Python)</h4>
<pre><code>from mcp.server.fastmcp import FastMCP
mcp = FastMCP("devproject")

@mcp.tool()
def recent_commits(n: int = 5) -> str:
    """Return the last n git commits of the project (1–50). Output is untrusted text."""
    import subprocess
    n = max(1, min(int(n), 50))
    return subprocess.check_output(["git","log",f"-{n}","--oneline"], text=True)

@mcp.resource("repo://readme")
def readme() -> str:
    return open("README.md").read()

@mcp.prompt()
def review_pr(pr: str) -> str:
    return f"Review PR {pr} for error handling and security. Be terse."

if __name__ == "__main__":
    mcp.run()   # stdio; mcp.run(transport="streamable-http") for remote</code></pre>
<h4>Registering in Claude Code</h4>
<pre><code>claude mcp add devproject --scope project -- python mcp_server/server.py
claude mcp add jira --transport http https://mcp.example.com/jira   # then /mcp to log in
claude mcp list</code></pre>`,

 notes:`<h4>Memory files</h4>
<ul><li>Hierarchy, all loaded together: <code>~/.claude/CLAUDE.md</code> (you, every project) → <code>./CLAUDE.md</code> (project, committed, team) → <code>./CLAUDE.local.md</code> (you, this project, git-ignored). Parent-directory CLAUDE.md files load too; subdirectory ones load on demand. Enterprise/managed policy files sit above all.</li>
<li><code>@path/to/file</code> imports other files; keep CLAUDE.md short and operational (build/test/lint commands, conventions, what not to touch). <code>/memory</code> shows what is loaded; <code>/init</code> bootstraps one.</li></ul>
<h4>Settings precedence (highest first)</h4>
<ol><li>Managed/enterprise policy settings</li><li>Command-line flags</li><li><code>.claude/settings.local.json</code> (personal, git-ignored)</li><li><code>.claude/settings.json</code> (project, committed)</li><li><code>~/.claude/settings.json</code> (user)</li></ol>
<ul><li>Settings hold permissions (allow/ask/deny rules per tool, e.g. <code>Bash(npm run test:*)</code>), hooks, env vars, model defaults, MCP approvals.</li></ul>
<h4>Extending Claude Code</h4>
<table><thead><tr><th>Mechanism</th><th>Where</th><th>Invoked by</th><th>Use for</th></tr></thead><tbody>
<tr><td>CLAUDE.md</td><td>project/user</td><td>always loaded</td><td>conventions, commands, context</td></tr>
<tr><td>Slash command</td><td><code>.claude/commands/*.md</code> (legacy — a same-named skill wins)</td><td>user types /name</td><td>repeatable prompts with $ARGUMENTS / $0 $1, frontmatter allowed-tools</td></tr>
<tr><td>Skill</td><td><code>.claude/skills/&lt;name&gt;/SKILL.md</code></td><td>model, when description matches</td><td>procedures plus scripts/resources; progressive loading</td></tr>
<tr><td>Hook</td><td>settings.json</td><td>lifecycle event</td><td>deterministic enforcement: format, lint, block, notify</td></tr>
<tr><td>Subagent</td><td><code>.claude/agents/*.md</code></td><td>model delegates or user asks</td><td>isolated context, restricted tools, specialised role</td></tr>
<tr><td>MCP server</td><td>.mcp.json / claude mcp add</td><td>model calls tools</td><td>external systems</td></tr>
<tr><td>Plugin</td><td>marketplace</td><td>install</td><td>bundle of commands, skills, agents, hooks, MCP</td></tr></tbody></table>
<h4>Hooks</h4>
<ul><li>Events: <code>PreToolUse</code>, <code>PostToolUse</code>, <code>Notification</code>, <code>UserPromptSubmit</code>, <code>Stop</code>, <code>SubagentStop</code>, <code>SessionStart</code>, <code>PreCompact</code> and more. Matchers select tools (e.g. <code>Edit|Write</code>).</li>
<li>A hook is a shell command that receives JSON on stdin (tool name, input, file paths, session). Exit 0 = continue; exit 2 = <b>block</b> and show stderr to Claude; other codes = non-blocking error. Hooks can also return JSON to allow/deny or add context.</li>
<li>Hooks are <i>enforcement</i>; CLAUDE.md is <i>guidance</i>. "Must always/never" → hook.</li></ul>
<h4>Permissions and modes</h4>
<ul><li><b>default</b>: reads free, asks before edits and commands. <b>acceptEdits</b>: file edits auto-approved. <b>plan</b>: read-only, produces a plan for approval. <b>auto</b>: a classifier decides. <b>dontAsk</b>. <b>bypassPermissions</b> (<code>--dangerously-skip-permissions</code>): everything auto — only inside a sandbox/container without credentials; admins can disable it.</li>
<li>Rules evaluate <b>deny → ask → allow</b>, first match wins; a broad deny beats a narrow allow. Committed project allow rules wait for workspace trust; deny applies immediately. In <code>-p</code> mode trust checks are skipped — restrict tools explicitly.</li>
<li>Allow-list patterns in settings; <code>/permissions</code> to manage; deny rules win.</li></ul>
<h4>Subagents</h4>
<ul><li>Markdown files with frontmatter (<code>name</code>, <code>description</code> — used for automatic delegation, <code>tools</code>, <code>model</code>) and a system prompt body. Project-level overrides user-level with the same name.</li>
<li>Run in a separate context window; return a summary. Good for reviews, research, test-writing; cost extra tokens and lose the main thread's context.</li></ul>
<h4>Headless and CI</h4>
<ul><li><code>claude -p "prompt"</code> non-interactive; <code>--output-format text|json|stream-json</code>; <code>--allowedTools</code>, <code>--max-turns</code>, <code>--model</code>, <code>--resume &lt;session&gt;</code>, <code>--continue</code>. JSON output includes result, cost, usage, session_id.</li>
<li>GitHub Actions: <code>anthropics/claude-code-action</code> — @claude in issues/PRs, automated review; API key from secrets; also works with Bedrock/Vertex credentials.</li>
<li>Session commands: <code>/compact [focus]</code> summarises context and keeps going; <code>/clear</code> wipes it; <code>/cost</code> (alias of <code>/usage</code>) shows tokens and USD; <code>/context</code> shows what is loaded; <code>/model</code>, <code>/effort</code>; <code>/review</code> (alias of <code>/code-review</code>); <code>/resume</code>, <code>/fork</code>, <code>/rewind</code> for sessions.</li></ul>
<div class="trap"><b>Exam traps:</b> CLAUDE.md is guidance, hooks are enforcement — pick hooks for "must always". /compact summarises the context, /clear wipes it. Subagents cost extra tokens because they have their own context. Project settings.json is shared; settings.local.json is personal and outranks it; CLI flags outrank both; managed outranks everything. Exit code 2 in a hook blocks (exit 1 does not). bypassPermissions is for sandboxes only. Project agents beat user agents, but personal skills beat project skills.</div>
<h4>Hook example (settings.json)</h4>
<pre><code>{
  "hooks": {
    "PostToolUse": [{
      "matcher": "Edit|Write",
      "hooks": [{"type":"command","command":"jq -r '.tool_input.file_path' | xargs -I{} ruff format {}"}]
    }],
    "PreToolUse": [{
      "matcher": "Bash",
      "hooks": [{"type":"command","command":"jq -r .tool_input.command | grep -q 'terraform destroy' && { echo 'blocked: destroy' >&2; exit 2; } || exit 0"}]
    }]
  }
}</code></pre>
<h4>Subagent file</h4>
<pre><code>---
name: reviewer
description: Reviews code changes for error handling and security. Use after any edit to src/.
tools: Read, Grep, Glob
model: sonnet
---
You are a strict reviewer. Report findings with file:line. Never edit files.</code></pre>`,

 notes:`<h4>Threat model</h4>
<table><thead><tr><th>Threat</th><th>How it shows up</th><th>Primary defence</th></tr></thead><tbody>
<tr><td><b>Direct prompt injection</b></td><td>user types "ignore your instructions…"</td><td>clear system prompt, input screening, Claude's own robustness, don't rely on the prompt for security</td></tr>
<tr><td><b>Indirect prompt injection</b></td><td>instructions hidden in documents, web pages, emails, tool results, MCP descriptions</td><td>treat all external content as <i>data</i>; fence in tags; least-privilege tools; approval for side effects; output monitoring</td></tr>
<tr><td><b>Data exfiltration</b></td><td>model tricked into putting secrets into a URL, email, or tool argument</td><td>allow-list destinations; no secrets in context; egress controls; review tool args</td></tr>
<tr><td><b>Excessive agency</b></td><td>agent with write/delete/pay tools acts on bad input</td><td>read-only default; scoped credentials; human-in-the-loop; dry-run tools; budgets</td></tr>
<tr><td><b>System prompt leak</b></td><td>user extracts confidential instructions</td><td>never put secrets in prompts; accept that prompts are not secret; filter outputs if needed</td></tr>
<tr><td><b>Jailbreaks</b></td><td>role-play or encoding tricks to get harmful content</td><td>Claude's safety training + a Haiku pre-screen + usage policy compliance + monitoring</td></tr>
<tr><td><b>Insecure output handling</b></td><td>model output executed as code/SQL/HTML unvalidated</td><td>validate and sanitise outputs like any untrusted input; parameterised queries</td></tr></tbody></table>
<ul><li><b>Defence in depth</b>: Claude's built-in safety → your prompt design → input/output validation → tool permissions and hooks → human review → logging and monitoring. No single layer is sufficient; the prompt alone is never the security boundary.</li>
<li>Secrets and credentials come from environment or a secret manager, are scoped per environment, rotated, and never appear in prompts, tool results or logs.</li>
<li>Privacy: send the minimum data, redact PII where you can, respect retention rules; <code>metadata.user_id</code> is an opaque identifier, not an email.</li></ul>
<h4>Safety behaviours and policy</h4>
<ul><li>Claude may refuse or add caveats; on newer models a refusal can surface as <code>stop_reason: refusal</code> — handle it, do not retry blindly.</li>
<li>Usage policy: no prohibited uses (weapons, CSAM, malware, deception at scale…); high-risk domains (medical, legal, financial, employment decisions) need human oversight and disclosure; you are responsible for your application's behaviour.</li>
<li>Moderation pattern: cheap classifier (Haiku, few-shot, temperature 0, JSON) before and/or after the main call; escalate borderline items to humans.</li></ul>
<h4>Evals</h4>
<ul><li>Define success criteria first (specific, measurable: accuracy, format compliance, latency, cost, refusal rate). Build the eval before tuning the prompt; treat it like a unit-test suite.</li>
<li>Test cases = input + expected outcome (+ metadata: domain, difficulty). Include edge cases, adversarial inputs, and real production samples. Start with dozens, grow to hundreds; volume beats perfection.</li>
<li>Graders: <b>code/exact/regex</b> (cheap, deterministic — labels, JSON validity, numbers); <b>LLM-as-judge with a rubric</b> (flexible — tone, completeness, faithfulness; use a strong model at temperature 0, give it the rubric and examples, ask for a score with reasoning); <b>human</b> (gold standard, expensive — calibrate the judge against it).</li>
<li>Run evals on every prompt, model, or tool change; use Batches to make large runs cheap; track pass rate over time as a regression suite; the Console Evaluation tool covers quick comparisons.</li>
<li>A/B prompts on the same cases; never compare on different inputs.</li></ul>
<h4>Debugging checklist (in order)</h4>
<ol><li><code>stop_reason</code> — max_tokens? tool_use never answered? refusal?</li>
<li><code>usage</code> — did the context blow the window? are cache reads happening?</li>
<li>Tool trace — missing/mismatched tool_result ids, is_error, oversized results, loops.</li>
<li>Prompt — ambiguous instructions, missing examples, untrusted content unfenced.</li>
<li>Reproduce at temperature 0, log request ids, check Console usage/logs, then add a regression case.</li></ol>
<div class="trap"><b>Exam traps:</b> The right defence for a web-scraping agent is treating fetched content as untrusted, not a better system prompt alone. LLM-as-judge is for subjective quality, not for exact-value checks. Human approval goes before the action. System prompts are not secret storage. Evals run on every change, on the same case set. Debug order starts with stop_reason.</div>
<h4>Judge prompt sketch</h4>
<pre><code>system = """You grade answers against a rubric. Output JSON {"score":1-5,"reason":""} only."""
user = f"""&lt;rubric&gt;{rubric}&lt;/rubric&gt;
&lt;question&gt;{q}&lt;/question&gt;
&lt;reference&gt;{ref}&lt;/reference&gt;
&lt;answer&gt;{a}&lt;/answer&gt;"""  # temperature=0, strong model</code></pre>`,

 notes:`<h4>Exam-day tactics</h4>
<ul><li>53 questions in 120 min ≈ 2 min 15 s each. Flag anything over 3 min and move on; review flagged at the end. Budget: first pass 75 min, review 30 min, spare 15.</li>
<li>Multiple-response items state how many to pick — count before you submit.</li>
<li>Scenario questions reward the Anthropic-recommended answer: smallest adequate model, clear instructions before clever tricks, cache before batch before downgrade, structured tools over text parsing, workflow before agent, human approval before destructive actions, external content is untrusted, secrets never in prompts, simplest architecture first, evals before tuning.</li>

{id:"examguide", ch:"ch0", title:"Official CCDV-F Exam Guide (Anthropic)", u:["https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542875%2FClaude+Certified+Developer+%E2%80%93+Foundations+Exam+Guide.pdf"],
 f:["Credential: Claude Certified Developer – Foundations, code CCDV-F. 53 items (multiple-choice and multiple-response), 120 minutes, proctored online or test centre, pass 720 on a 100–1,000 scale, USD 125, valid 12 months from award.",
    "Target audience: technical professionals who build, integrate and ship production-grade AI solutions; 1–5 years software experience, 6+ months hands-on Claude/LLM experience, Python and/or TypeScript, REST APIs, CLI tools, LLM fundamentals, agents, context management, MCP. No mandatory prerequisites.",
    "Domain 1 Agents and Workflows 14.7%: Agent Architecture 4.5% (patterns, manager hierarchies, workflow-vs-agent decisions); Agent Construction 5.3% (Claude Agent SDK, custom loops, deployment models); Agent Patterns 4.9% (design patterns, frameworks such as LangGraph, memory management).",
    "Domain 2 Applications and Integration 33.1%: Understanding Requirements 3.4%; Systems Life Cycle 2.8%; Claude API Mechanics 6.8% (messages, tools, streaming, vision, caching, batch); Software Engineering Foundations 7.4% (REST APIs, JSON, version control, refactoring); Claude Application Design 8.6% (interface interpretation, schema design, session hygiene); Configuration Management 4.1% (CLAUDE.md, settings.json, model versioning).",
    "Domain 3 Claude Code 3.1%: core components — rules, skills, commands, agents, agent memory; features — session management, slash commands, headless/streaming modes.",
    "Domain 4 Eval, Testing and Debugging 2.6%: error identification, recovery strategies, trace analysis for failure modes.",
    "Domain 5 Model Selection and Optimization 16.8%: LLM Fundamentals 5.2% (tokens, context windows, sampling, prompting techniques); Technical Fundamentals 6.1% (SDK integration, websockets); Model Selection and Trade-offs 2.7% (Opus/Sonnet/Haiku, quality vs latency vs cost); Cost and Token Management 2.8% (token tracking, caching strategies).",
    "Domain 6 Prompt and Context Engineering 11.0%: Context Engineering 3.8% (context drift prevention, subagent isolation); Prompt Engineering 4.6% (instruction clarity, few-shot, iterative refinement); Output Handling 2.6% (structured output, validation, defensive parsing).",
    "Domain 7 Security and Safety 8.1%: AI Application Security 3.2% (prompt injection, jailbreak defence, PII); Guardrails and Safe Deployment 2.3% (content policy, secure-by-design); Claude Hooks 1.0% (guardrails preventing destructive actions); Identity and Secrets Management 1.6%.",
    "Domain 8 Tools and MCPs 10.6%: Tool Implementation 4.4% (function calling, tool descriptions, agentic patterns); MCP Server Development 2.1% (authoring, deployment, communication patterns); Agentic Customization 4.1% (trade-offs among tools, Skills and MCPs).",
    "Preparation: self-assess against the blueprint; review official docs (API, models, prompt engineering, Claude Code, Skills, MCP); build and operate a real Claude application with tools, prompt/context engineering and security practices; practise prompts, agents, Claude Code configuration, token management, guardrails, custom tools/MCPs; study the sample questions.",
    "Sample 1 (Domain 2): 10,000 documents overnight, cost-effectively → Message Batches API (asynchronous, within 24 h, reduced cost). Sample 2 (Domain 7): hidden prompt-injection text → treat content as untrusted, isolate from trusted instructions, use guardrails/hooks. Sample 3 (Domain 8): make an inventory REST API reusable across apps → build an MCP server exposing the operations as tools.",
    "Retakes: wait 14 days after the 1st fail, 30 days after the 2nd, 90 days after the 3rd; maximum four attempts in a rolling 12 months; USD 125 per attempt.",
    "Conduct: valid government photo ID with name matching registration; no phones, notes, second monitors or recording; stay in webcam view; 24-hour cancellation/reschedule deadline; confidentiality agreement before the exam; cheating or content disclosure = invalidation, revocation and ban.",
    "Maintenance: renewal is a free, non-proctored assessment on the Partner Academy covering changes since certification; a lapsed credential needs a full retake at full fee. Name corrections: certifications-support@anthropic.com; scheduling/accommodations/results: Pearson VUE; appeals within 14 days."],
 c:"", t:["The 24-hour reschedule deadline is the real go/no-go cut-off — decide by the morning of 2 Nov at the latest, not on 3 Nov.","Second and third fails cost 30 and 90 days of waiting — the first attempt is the cheap one to get right.","Roughly a quarter of the exam (Requirements, Life Cycle, SE Foundations, App Design) is general engineering judgement, not Claude API trivia."]},

/* ---------- Chapter 1: Messages API ---------- */
{id:"messages", ch:"ch1", title:"Messages API reference", u:["https://platform.claude.com/docs/en/api/messages","https://docs.claude.com/en/api/messages"],
 f:["POST /v1/messages. Required: model, messages (array of {role, content}; role ∈ user | assistant), max_tokens. Optional: system, stop_sequences, metadata.user_id (≤512 chars, opaque — no identifying info), tools, tool_choice, thinking, output_config, container.",
    "tool_choice types: auto (default), any (must call some tool), tool + name (must call that tool), none. auto/any/tool accept disable_parallel_tool_use.",
    "thinking: {type:'enabled', budget_tokens ≥ 1024 and < max_tokens} on models that support manual thinking; {type:'adaptive'} on Claude 4.6+; {type:'disabled'}. output_config: effort ∈ low | medium | high | xhigh | max; format = {type:'json_schema', schema}.",
    "cache_control: {type:'ephemeral', ttl?: '5m' | '1h'} — allowed on text, image, document, tool_use, tool_result blocks and on tool definitions.",
    "Content sources: base64 (image media_type jpeg/png/gif/webp; PDF application/pdf), url, file (file_id from the Files API), text (text/plain documents).",
    "Response: id, type 'message', role 'assistant', content[] (blocks: text, thinking, redacted_thinking, tool_use, server_tool_use, web_search_result…), model, stop_reason, stop_sequence (null unless hit), usage.",
    "stop_reason enum: end_turn, max_tokens, stop_sequence, tool_use, pause_turn, refusal, model_context_window_exceeded. A refusal carries stop_details with a category.",
    "usage: input_tokens, output_tokens, cache_creation_input_tokens, cache_read_input_tokens, cache_creation.{ephemeral_5m_input_tokens, ephemeral_1h_input_tokens}, server_tool_use.{web_search_requests, web_fetch_requests}, output_tokens_details.thinking_tokens.",
    "Tool names must match ^[a-zA-Z0-9_-]{1,256}$; server-tool ids start srvtoolu_. Citations are off by default (citations: {enabled:false}).",
    "Related endpoints: POST /v1/messages/count_tokens; /v1/messages/batches (create, list, get, cancel, delete, results)."],
 c:"import anthropic\nclient = anthropic.Anthropic()          # reads ANTHROPIC_API_KEY\nmsg = client.messages.create(\n    model=\"claude-sonnet-5\", max_tokens=1024,\n    system=\"You are terse.\",\n    messages=[{\"role\": \"user\", \"content\": \"Hello, Claude\"}],\n    metadata={\"user_id\": \"hashed-user-123\"},\n)\nprint(msg.stop_reason, msg.usage.input_tokens, msg.content[0].text)",
 t:["max_tokens is required and has no default; system is a top-level field, never a message with role 'system' at index 0.","budget_tokens must be ≥1024 and < max_tokens; tool_choice 'any' forces some tool, 'tool' forces a named one.","stop_sequence is populated only when stop_reason == 'stop_sequence'; cache_read_input_tokens is reported separately from input_tokens."]},

{id:"workingmsgs", ch:"ch1", title:"Working with messages (multi-turn, roles, prefill)", u:["https://platform.claude.com/docs/en/build-with-claude/working-with-messages","https://docs.claude.com/en/docs/build-with-claude/working-with-messages"],
 f:["The API is stateless — send the full conversation history on every call.","Messages alternate user/assistant; consecutive same-role messages are combined into one turn. The first message must be user.","A role 'system' message may appear mid-conversation on the newest models (4.8+, Opus 5, Fable 5) but never first; use top-level system for from-the-start instructions. Mid-conversation system turns don't invalidate the cached prefix.","Prefill (a partial assistant message as the final turn, e.g. '{' or 'The answer is (') is NOT supported on Claude 4.6 and later — use structured outputs or explicit format instructions. Older models still accept it.","temperature, top_p, top_k return HTTP 400 on Claude 4.7+ when set to non-default values; omit them. (Python SDK v1.0+ removed the parameters.)","You may inject synthetic assistant turns to shape the flow of a conversation.","Image sources: base64, url, file; formats jpeg/png/gif/webp."],
 c:"msg = client.messages.create(\n    model=\"claude-sonnet-5\", max_tokens=1024,\n    messages=[\n        {\"role\": \"user\", \"content\": \"Hello, Claude\"},\n        {\"role\": \"assistant\", \"content\": \"Hello!\"},\n        {\"role\": \"user\", \"content\": \"Can you describe LLMs?\"},\n    ])",
 t:["First message role must be user.","Prefilling the assistant turn is legacy: on 4.6+ it is a 400 error and the replacement is output_config.format (structured outputs).","Sampling parameters (temperature/top_p/top_k) are rejected on 4.7+, not silently ignored."],
 n:"The exam blueprint predates these changes, so a question may still present prefill or temperature as valid techniques. Answer such questions with the classic behaviour (prefill forces format; temperature controls randomness) unless the stem names a Claude 4.6+/4.7+ model."},

{id:"streaming", ch:"ch1", title:"Streaming Messages", u:["https://platform.claude.com/docs/en/build-with-claude/streaming","https://docs.claude.com/en/docs/build-with-claude/streaming"],
