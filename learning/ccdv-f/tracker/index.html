 f:["Files = YAML frontmatter + Markdown system prompt. Priority: managed > --agents CLI JSON > project .claude/agents/ > user ~/.claude/agents/ > plugin agents. Closest project file wins; live-reloaded.","Required frontmatter: name, description (drives automatic delegation). Optional: tools (allow-list), disallowedTools, model (sonnet | opus | haiku | fable | inherit | full ID), permissionMode, maxTurns, memory (user | project | local), skills, mcpServers, background, isolation: worktree, effort, hooks.","Built-ins: Explore (read-only), Plan (read-only), general-purpose (all tools). Explore/Plan skip CLAUDE.md.","Fresh context: own system prompt, task message, CLAUDE.md, git snapshot, preloaded skills — NOT the parent's conversation, auto memory or output style. Forks (/fork) inherit everything.","Nesting allowed: default max depth 3; concurrency limit configurable. Invoke by natural language, @agent-name (guaranteed), claude --agent name, or 'agent' in settings. Completed subagents return an ID and can be resumed.","Warning when combined agent descriptions exceed 15,000 tokens; /tasks lists running subagents."],
 c:"---\nname: reviewer\ndescription: Reviews code for error handling and security. Use proactively after edits under src/.\ntools: Read, Glob, Grep, Bash\nmodel: sonnet\nmemory: project\n---\nYou are a strict senior reviewer. Report findings as file:line with a fix. Never edit files.",
 t:["Project .claude/agents/ beats user ~/.claude/agents/ — the opposite of skills (personal beats project).","Subagents don't see the parent's history or auto memory, but they do load CLAUDE.md (except Explore/Plan).","model: inherit uses the main model; omitting tools inherits all parent tools."]},

{id:"cccli", ch:"ch6", title:"Claude Code — CLI reference (headless mode)", u:["https://code.claude.com/docs/en/cli-reference","https://docs.claude.com/en/docs/claude-code/cli-reference","https://docs.claude.com/en/docs/claude-code/common-workflows","https://docs.claude.com/en/docs/claude-code/ide-integrations"],
 f:["claude (interactive); claude 'query'; claude -p 'query' (print/headless); cat file | claude -p; -c/--continue (most recent session); -r/--resume <id|name>; claude update; claude doctor; claude mcp; claude plugin.","Output: --output-format text | json | stream-json; --input-format stream-json; --include-partial-messages (stream-json only); --json-schema for validated structured output; --verbose. JSON output includes result, cost, usage, session_id.","Permissions: --permission-mode default|acceptEdits|plan|auto|dontAsk|bypassPermissions; --dangerously-skip-permissions; --allowedTools / --disallowedTools; --add-dir; --permission-prompt-tool <mcp tool>.","Prompts: --system-prompt REPLACES the default; --append-system-prompt adds to it. --settings <file|json>; --setting-sources user,project,local; --agents '{…}'.","Limits: --max-turns N (print mode only); --max-budget-usd; --model; --effort; --fallback-model a,b. Sessions: --session-id, --fork-session, --name.","MCP: --mcp-config <file|json>; --strict-mcp-config (only those servers). --bare skips hooks/skills/plugins/MCP; --safe-mode disables customisations.","-p runs default to permission mode 'default' and skip trust verification."],
 c:"cat app.log | claude -p --output-format json --max-turns 3 \\\n  --permission-mode plan \"Find critical errors and summarise\"\nclaude -p \"review this diff\" --allowedTools \"Read,Grep\" < pr.diff\nclaude -r \"auth-refactor\" --append-system-prompt \"Always suggest tests\"",
 t:["--system-prompt replaces the whole default prompt; --append-system-prompt adds to it.","--max-turns applies only in print (-p) mode.","--strict-mcp-config ignores every configured server except those passed via --mcp-config."]},

{id:"ccgha", ch:"ch6", title:"Claude Code — GitHub Actions", u:["https://code.claude.com/docs/en/github-actions","https://docs.claude.com/en/docs/claude-code/github-actions"],
 f:["Action anthropics/claude-code-action@v1. Quick setup: /install-github-app (needs gh CLI and repo admin); manual: install the Claude GitHub App + secret + copy the example workflow to .github/workflows/.","Auth inputs: anthropic_api_key (ANTHROPIC_API_KEY secret) or claude_code_oauth_token (from claude setup-token); use_bedrock / use_vertex / use_foundry for cloud platforms.","Modes are auto-detected: interactive (no prompt → waits for the trigger phrase, default @claude) vs automation (prompt given → runs on any event). There is no mode input in v1.","Trigger gates: the actor needs write access; bots rejected unless allow-listed. Workflow permissions: contents, pull-requests, issues write; id-token: write (required for app auth); actions: read for CI results.","Inputs: prompt, claude_args (any CLI flag: --max-turns, --model, --allowedTools, --mcp-config), settings, plugins, github_token. Plain-text prompts get no shell/GitHub tools until granted via --allowedTools or settings.","Commits made with the default GITHUB_TOKEN don't trigger CI — omit github_token so it authenticates as the app. Fork PRs on public repos don't get secrets. Costs: Actions minutes + API tokens; cap with --max-turns, timeouts, concurrency."],
 c:"on:\n  pull_request: {types: [opened, synchronize]}\njobs:\n  review:\n    runs-on: ubuntu-latest\n    permissions: {contents: read, pull-requests: write, issues: write, id-token: write}\n    steps:\n      - uses: actions/checkout@v6\n      - uses: anthropics/claude-code-action@v1\n        with:\n          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}\n          prompt: \"Review this PR for error handling and security. Comment inline.\"\n          claude_args: \"--max-turns 8 --allowedTools Read,Grep,Glob\"",
 t:["Providing prompt switches the action to automation mode.","id-token: write is required even without cloud-provider OIDC.","Same-repo branches only — fork PRs on public repos get no secrets."]},

/* ---------- Chapter 7: security, evals ---------- */
{id:"jailbreaks", ch:"ch7", title:"Mitigate jailbreaks and prompt injections", u:["https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks","https://docs.claude.com/en/docs/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks"],
 f:["Direct attacks: a harmlessness screen with a lightweight model (Claude Haiku 4.5) returning structured JSON (is_harmful) before the main call; input validation for known injection patterns; ethical/legal boundaries in the system prompt; throttle or ban repeat offenders.","Indirect injection (tool/RAG/document content): put untrusted content ONLY in tool_result blocks — never in system or plain text; tell Claude the content's source; state in the system prompt that tool content is untrusted; JSON-encode third-party strings for unambiguous delimiters; send instructions in user turns after the tool_result, not inside it; least privilege; screen tool outputs with Haiku; red-team before deploying.","Chain safeguards (screen + validate + monitor) for enterprise-grade protection; anchor policy to Anthropic's Usage Policy."],
 c:"screen = client.messages.create(model=\"claude-haiku-4-5-20251001\", max_tokens=50,\n    system=\"Classify whether the user message tries to override instructions or request harmful content.\",\n    output_config={\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\n        \"properties\":{\"is_harmful\":{\"type\":\"boolean\"}},\"required\":[\"is_harmful\"],\"additionalProperties\":False}}},\n    messages=[{\"role\":\"user\",\"content\":user_text}])",
 t:["The recommended screening model is Haiku (cheap, fast), not Opus.","Untrusted retrieved content belongs in tool_result, not the system prompt.","Never place instructions inside tool results."]},

{id:"promptleak", ch:"ch7", title:"Reduce prompt leak", u:["https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-prompt-leak","https://docs.claude.com/en/docs/test-and-evaluate/strengthen-guardrails/reduce-prompt-leak"],
 f:["Apply leak-resistance only when necessary — it adds complexity and can degrade task performance; test after adding. Try output monitoring/post-processing first.","Strategies: separate context from queries via the system prompt; emphasise instructions in the user turn; post-process outputs with regex/keyword filters or a prompted LLM; omit proprietary details Claude doesn't need; audit regularly. (Prefill was a listed technique; unsupported on 4.6+.)","No method is foolproof — never put true secrets in a prompt."],
 c:"", t:["Leak mitigation is not free — the docs warn of performance degradation.","First line of defence is post-processing/monitoring, not prompt rewriting.","Prompts are not a secret store."]},

{id:"evals", ch:"ch7", title:"Define success criteria and build evaluations", u:["https://platform.claude.com/docs/en/test-and-evaluate/develop-tests","https://docs.claude.com/en/docs/test-and-evaluate/develop-tests","https://docs.claude.com/en/docs/test-and-evaluate/define-success","https://docs.claude.com/en/docs/test-and-evaluate/eval-tool"],
 f:["Good criteria are Specific, Measurable, Achievable, Relevant. Bad: 'good performance'. Good: 'F1 ≥ 0.85 on a held-out set of 10,000 diverse posts, 5% over baseline'. Latency as percentiles (95% < 200 ms), not averages.","Common criteria: task fidelity, consistency, relevance and coherence, tone and style, privacy preservation, context utilisation, latency, price.","Design: task-specific cases mirroring the real distribution plus edge cases (irrelevant data, long inputs, poor input, ambiguity); automate when possible; prioritise VOLUME over hand-graded quality.","Example evals: exact match (categorical), cosine similarity of embeddings (consistency), ROUGE-L (summarisation), LLM Likert 1–5 (tone), binary classification (privacy), LLM ordinal (context use).","Grading: code-based (fastest, most reliable, least nuance) > LLM-based (fast, scalable; test it first) > human (slowest, highest quality; avoid if possible).","LLM grading tips: detailed rubric ('must mention Acme Inc. in the first sentence'); constrain output to correct/incorrect or 1–5; ask for reasoning in <thinking> tags then discard it.","The old Console 'Evaluation tool' page is gone; current docs frame evals as code you run (Batches make them cheap)."],
 c:"def grader_prompt(answer, rubric):\n    return f\"\"\"Grade this answer against the rubric.\n<rubric>{rubric}</rubric>\n<answer>{answer}</answer>\nThink in <thinking> tags, then output 'correct' or 'incorrect' in <result> tags.\"\"\"\ngrade = \"correct\" if \"<result>correct</result>\" in resp.lower() else \"incorrect\"",
 t:["Volume over quality is the stated principle.","ROUGE-L = longest common subsequence (summaries); cosine similarity = embedding closeness (consistency).","Human grading is the fallback for nuance, not the default."]},

{id:"moderation", ch:"ch7", title:"Content moderation guide", u:["https://platform.claude.com/docs/en/about-claude/use-case-guides/content-moderation","https://docs.claude.com/en/docs/about-claude/use-case-guides/content-moderation"],
 f:["Recommended model: Claude Haiku 4.5 ($1/$5 per MTok). Worked example: 1B posts/month → ≈$36k/month on Haiku vs ≈$180k on Opus.","Default unsafe categories: child exploitation, conspiracy theories, hate, indiscriminate weapons, IP, non-violent crimes, privacy, self-harm, sex crimes, sexual content, specialised advice, violent crimes. Claude's own AUP-aligned safety may override your settings for dangerous content.","Output JSON only: {violation: bool, categories: [...], explanation?}; risk-level variant 0–3 (auto-block high, route medium to humans); batch variant with per-message ids (cheaper, slight quality loss, raise max_tokens).","Provide category definitions and examples; wrap the input in <message> tags; evaluate as a classification problem with precision/recall on a test set including edge cases and multilingual content."],
 c:"r = client.messages.create(model=\"claude-haiku-4-5-20251001\", max_tokens=200,\n    messages=[{\"role\":\"user\",\"content\":f\"Classify this message against the policy. Reply with JSON only.\\n<message>{text}</message>\"}])\nverdict = json.loads(next(b.text for b in r.content if b.type == \"text\"))",
 t:["Cost-optimal moderation model is Haiku (~5× cheaper than Opus).","JSON only, no markdown fences, input fenced in <message> tags.","Batching lowers cost but the docs warn of a slight quality drop."]},

{id:"refusals", ch:"ch7", title:"Handle streaming refusals", u:["https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/handle-streaming-refusals","https://docs.claude.com/en/docs/test-and-evaluate/strengthen-guardrails/handle-streaming-refusals"],
 f:["Claude 4+ streaming classifiers can return stop_reason 'refusal' with stop_details {type, category, explanation}. It is an HTTP 200, not an error — monitor refusals separately from error rates.","Detect in message_delta events (event.delta.stop_reason == 'refusal').","You must reset context: remove or rephrase the triggering turn or clear history — continuing without resetting yields continued refusals.","Three distinct cases: streaming classifier refusal (stop_reason), API input/copyright validation (400 errors), model-generated refusals (ordinary text)."],
 c:"with client.messages.stream(model=\"claude-sonnet-5\", max_tokens=1024, messages=messages) as stream:\n    for event in stream:\n        if event.type == \"message_delta\" and event.delta.stop_reason == \"refusal\":\n            reset_conversation(); break",
 t:["A classifier refusal arrives as a 200 with stop_reason 'refusal', not a 4xx.","Retrying the same conversation without removing the content keeps refusing.","Copyright/input validation failures are 400s — a different case."]},

{id:"aup", ch:"ch7", title:"Usage policy and OWASP LLM Top 10 (external)", u:["https://www.anthropic.com/legal/aup","https://owasp.org/www-project-top-10-for-large-language-model-applications/"],
 f:["Anthropic Usage Policy: prohibited uses (weapons, CSAM, malware, large-scale deception, etc.); high-risk domains (medical, legal, financial, employment, insurance decisions) require human oversight and disclosure of AI use; the developer is responsible for the application's behaviour and for downstream users.","OWASP LLM Top 10 (2025) — the names exam questions borrow: LLM01 prompt injection; LLM02 sensitive information disclosure; LLM03 supply chain; LLM04 data and model poisoning; LLM05 improper output handling; LLM06 excessive agency; LLM07 system prompt leakage; LLM08 vector/embedding weaknesses; LLM09 misinformation; LLM10 unbounded consumption.","Map to Claude apps: LLM01 → untrusted content in tool_result + screening; LLM05 → validate model output before executing/SQL/HTML; LLM06 → least-privilege tools + approval before side effects; LLM07 → no secrets in prompts; LLM10 → max_tokens, max_turns, budgets, rate limits."],
 c:"", t:["Improper output handling = executing model output unvalidated (SQL, shell, HTML).","Excessive agency = tools/permissions beyond what the task needs.","Unbounded consumption = no caps on tokens, turns or spend — an agent-loop cost blow-up is a security issue too."]},

/* ---------- Blueprint gaps: engineering foundations & app design ---------- */
{id:"sefoundations", ch:"ch1", title:"Software engineering foundations for Claude apps (REST, JSON, git, refactoring) — blueprint 7.4%", u:[],
 f:["REST essentials the API relies on: HTTPS POST /v1/messages with headers x-api-key, anthropic-version (e.g. 2023-06-01), content-type: application/json; status classes 2xx success / 4xx client / 5xx server; idempotency matters for retries (a retried POST can double-charge — make your own writes idempotent).","JSON discipline: content is a list of typed blocks, not a string; parse with a strict parser, validate with a schema (pydantic / zod), never eval; handle unicode, escaping and large numbers; treat model output as untrusted input.","Version control: keep prompts, tool schemas, CLAUDE.md, settings.json and eval cases in the repo; pin model IDs and SDK versions (requirements.txt / package-lock); tag releases; never commit .env or keys (.gitignore, secret scanning); review prompt changes like code changes (diff + eval run).","Refactoring for LLM code: isolate the API call behind one function (client, model, retries, logging in one place); separate prompt templates from code; make tools small pure functions with typed inputs; add tests around parsing and tool handlers; remove dead prompt text — every token costs.","Async and concurrency: use the async client with bounded concurrency (semaphore) to respect rate limits; stream for user-facing paths; batch for offline paths.","Observability: log request id, model, stop_reason, usage, latency, tool calls; emit metrics (cost per request, cache hit rate, refusal rate, p95 latency); keep traces for debugging."],
 c:"import asyncio\nfrom anthropic import AsyncAnthropic\nclient = AsyncAnthropic(max_retries=3)\nsem = asyncio.Semaphore(8)                 # bounded concurrency vs rate limits\nasync def ask(prompt):\n    async with sem:\n        r = await client.messages.create(model=\"claude-haiku-4-5-20251001\", max_tokens=200,\n            messages=[{\"role\":\"user\",\"content\":prompt}])\n        return r.content[0].text, r.usage\nresults = asyncio.run(asyncio.gather(*(ask(p) for p in prompts)))",
 t:["A retried POST is not automatically safe — make downstream writes idempotent.","Pin model IDs and SDK versions in version control; treat prompt edits like code (review + eval).","Model output is untrusted input — schema-validate before use."]},

{id:"requirements", ch:"ch1", title:"Understanding requirements and the systems life cycle — blueprint 6.2%", u:[],
 f:["Requirements for an LLM feature: user goal and success criteria (measurable, see evals); input types (text, images, PDFs, tool data); latency budget (interactive → stream, small model; batch → Batches); cost ceiling per request/month; quality bar and failure tolerance; privacy/PII constraints and data residency; safety/compliance domain (high-risk → human oversight); who is accountable for outputs.","Decide the architecture from the requirements: single prompt → workflow → agent, in that order; choose the smallest model that meets the bar; decide state handling (stateless request, server-side session store, retrieval).","Life cycle: define criteria → prototype in the Workbench → build eval set → implement with logging → red-team → staged rollout (shadow / canary / percentage) → monitor (quality, cost, latency, refusals, injection attempts) → iterate on prompt/model with regression evals → plan for model deprecations (60-day notice) and version pinning.","Operational readiness: rate-limit headroom and backoff, spend limits per workspace, secrets rotation, fallbacks when 529/overloaded (degrade to smaller model or queue), runbooks for tool failures.","Change management: every prompt/model/tool change goes through the eval suite and a diff review; keep a changelog of prompt versions with their eval scores."],
 c:"", t:["The first design question is 'what does success look like and how will we measure it?', not 'which model?'.","Interactive latency requirement rules out Batches; cost requirement pushes toward caching and Haiku.","Plan for deprecation from day one: pin IDs, keep evals ready to validate the successor model."]},

{id:"appdesign", ch:"ch3", title:"Claude application design: schemas, sessions, interface hygiene — blueprint 8.6%", u:[],
 f:["Interface interpretation: read a Messages request/response like a contract — which blocks are present (text, tool_use, thinking), what stop_reason implies, what usage costs; never assume content[0] is text.","Schema design for tools and outputs: small, flat objects; explicit enums instead of free text; required vs optional deliberate; descriptions on every property; unambiguous names (user_id); avoid deeply nested or union-heavy schemas (structured outputs has limits on unions/optionals); version schemas when you change them.","Session hygiene: the API is stateless — your app owns the history. Store it server-side keyed by session id; cap history length; summarise or drop old turns; keep the system prompt stable (cacheable) and put per-request data last; never leak one user's context into another's; clear or rephrase after a refusal; strip tool results that are no longer needed (context editing).","Conversation state vs application state: the model sees only what you send — keep authoritative state (orders, balances) in your database and pass snapshots, not the other way round.","Defensive parsing (blueprint 'Output Handling'): check stop_reason first; validate JSON against a schema; handle max_tokens truncation; retry once with the error message; fail closed on unparsable output; log the raw response with request id.","Multi-tenant design: one workspace/key per tenant for Files and spend isolation; opaque metadata.user_id for abuse tracking; per-tenant rate-limit budgets.","Configuration management (blueprint 4.1%): model ID, max_tokens, effort, tool list and prompt versions live in config (not scattered in code); CLAUDE.md and settings.json versioned with the repo; environment-specific settings (dev/staging/prod keys and models)."],
 c:"def parse_reply(r, schema):\n    if r.stop_reason == \"refusal\":        return None, \"refused\"\n    if r.stop_reason == \"max_tokens\":     return None, \"truncated\"\n    text = \"\".join(b.text for b in r.content if b.type == \"text\")\n    try:\n        return schema.model_validate_json(text), None\n    except Exception as e:\n        return None, f\"invalid: {e}\"",
 t:["The API is stateless: session state is your responsibility, keyed and isolated per user.","Check stop_reason before parsing; treat max_tokens and refusal as distinct failure paths.","Flat schemas with enums and good descriptions beat clever nested ones — for both tools and structured outputs."]},

{id:"techfund", ch:"ch3", title:"Technical fundamentals: SDK integration, streaming transports, websockets — blueprint 6.1%", u:[],
 f:["Transport reality: the Messages API is HTTPS request/response; streaming uses server-sent events (SSE) over that same HTTP response — one-way, text/event-stream, reconnect by resending. There is no WebSocket endpoint on the Messages API; WebSockets appear in YOUR app tier (browser ↔ your server) to relay SSE tokens to a UI, or in voice/realtime products.","Pattern: browser ⇄ (WebSocket or SSE) ⇄ your backend ⇄ (SSE) ⇄ Claude. Keep the API key on the backend only; never call the API from the browser.","SDK integration: sync client for scripts/batch, async client for servers; configure max_retries and timeout; use with_options per call; catch typed exceptions; use messages.stream() helper for token streaming; read _request_id for support.","Timeouts: non-streaming calls have a ~10-minute limit; stream long outputs; use Batches for long offline work; set TCP keep-alive on long connections.","Idempotency and retries: the SDK retries transient errors (408/409/429/5xx); design tool side effects to be safe under retry.","Environment: ANTHROPIC_API_KEY from env/secret manager; separate keys per environment; spend limits per workspace; region/data residency via inference_geo where required."],
 c:"# FastAPI relay: browser gets SSE, key stays server-side\n@app.get(\"/chat\")\nasync def chat(q: str):\n    async def gen():\n        async with aclient.messages.stream(model=\"claude-sonnet-5\", max_tokens=800,\n                messages=[{\"role\":\"user\",\"content\":q}]) as s:\n            async for text in s.text_stream:\n                yield f\"data: {json.dumps(text)}\\n\\n\"\n    return StreamingResponse(gen(), media_type=\"text/event-stream\")",
 t:["Claude streams via SSE; WebSockets are something your app adds between browser and backend.","Never expose the API key to a browser client — proxy through your backend.","Streaming is for perceived latency and long outputs; it doesn't change token cost."]},

{id:"agentpatterns", ch:"ch4", title:"Agent frameworks and memory management (LangGraph and friends) — blueprint 4.9%", u:["https://docs.claude.com/en/api/agent-sdk/overview"],

/* ============================================================
   STORAGE — window.storage (Claude artifacts) → localStorage → memory
   ============================================================ */
const KEY = "ccdvf-progress-v2";
const OLD_KEY = "ccdvf-progress-v1";
let mem = {};
const store = {
  mode: "memory",
  async load(){
    let v = null;
    try{ if(window.storage){ this.mode="artifact"; const r = await window.storage.get(KEY,false); if(r) v=JSON.parse(r.value); else { const o=await window.storage.get(OLD_KEY,false); if(o) v=JSON.parse(o.value);} } }catch(e){}
    if(v) return v;
    try{ const s = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY); this.mode = this.mode==="artifact"?"artifact":"browser"; if(s) return JSON.parse(s); }catch(e){ if(this.mode!=="artifact") this.mode="memory"; }
    return {};
  },
  async save(obj){
    mem = obj;
    try{ if(window.storage){ await window.storage.set(KEY, JSON.stringify(obj), false); return; } }catch(e){}
    try{ localStorage.setItem(KEY, JSON.stringify(obj)); }catch(e){}
  }
};

   ============================================================ */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt = d => { const x=new Date(d+"T00:00:00"); return x.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); };
const todayStr = () => { const t=new Date(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); };
const addDays = (d,n) => { const x=new Date(d+"T00:00:00"); x.setDate(x.getDate()+n); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const pctClass = p => p==null?"":p>=80?"good":p>=75?"warn":"bad";

function itemIds(ch){
  const ids=[];
  ch.lessons.forEach((l,i)=>ids.push(ch.id+":l"+i));
  ch.checklist.forEach((c,i)=>ids.push(ch.id+":c"+i));
  return ids;
}
function chPct(ch){ const ids=itemIds(ch); const d=ids.filter(i=>state[i]).length; return ids.length?Math.round(100*d/ids.length):0; }
function domainLessonPct(key){
  const chs = CHAPTERS.filter(c=>c.keys.includes(key)); if(!chs.length) return null;
  const ids = chs.flatMap(itemIds); const d = ids.filter(i=>state[i]).length; return Math.round(100*d/ids.length);
}
function quizBest(key){ const runs=(state.quiz&&state.quiz[key])||[]; return runs.length?Math.max(...runs.map(r=>Math.round(100*r.score/r.total))):null; }
function quizLast(key){ const runs=(state.quiz&&state.quiz[key])||[]; return runs.length?Math.round(100*runs[runs.length-1].score/runs[runs.length-1].total):null; }
function allTraps(){
  const out=[]; CHAPTERS.forEach(ch=>(ch.traps||[]).forEach((t,i)=>out.push({id:ch.id+":t"+i, ch, q:t[0], a:t[1]}))); return out;
}
function trapState(id){ return (state.sr&&state.sr[id])||{box:0,due:todayStr()}; }
function dueTraps(){ const t=todayStr(); return allTraps().filter(x=>trapState(x.id).due<=t); }

function quizTitle(key){ return key==="MIX"?"Mixed 20 (weighted like the exam)":DOMAINS[key].name; }
function renderQuiz(){
  const el = document.getElementById("view-quiz");
  if(quizRun){ renderQuizRun(el); return; }
  const cards = Object.keys(DOMAINS).map(k=>{
    const runs=(state.quiz&&state.quiz[k])||[]; const best=quizBest(k), last=quizLast(k);
    return `<div class="qcard"><h3>${esc(DOMAINS[k].name)}</h3><div class="w">${DOMAINS[k].weight}% of the exam · ${QUIZ[k].length} questions · 23 min</div>
      <div class="best">${runs.length?`Best <b>${best}%</b> · last ${last}% · ${runs.length} attempt${runs.length>1?"s":""}`:"Not attempted yet"}</div>
      <button class="primary" data-startquiz="${k}">Start timed quiz</button></div>`;
  }).join("");
  const mixRuns=(state.quiz&&state.quiz.MIX)||[];
  el.innerHTML=`<div class="card"><h2>Question bank</h2><div class="sub">80 exam-style items — 10 per domain, single- and multiple-response. Timed at ≈2 min 15 s per question like the real exam. Scores feed the Domain dashboard. Retake until every domain is at 80%+, then rely on fresh practice sets in Chapter 8 so you are not memorising answers.</div>
    <div class="quizgrid">
      <div class="qcard" style="border-color:var(--amber)"><h3>Mixed 20</h3><div class="w">Sampled by domain weight · 45 min</div>
        <div class="best">${mixRuns.length?`Best <b>${quizBest("MIX")}%</b> · last ${quizLast("MIX")}% · ${mixRuns.length} attempt${mixRuns.length>1?"s":""}`:"Not attempted yet"}</div>
        <button class="primary" data-startquiz="MIX">Start mixed quiz</button></div>
      ${cards}
    </div></div>
    <div class="card"><h2>How to use it</h2><div class="sub">Take a domain quiz on that chapter's review day (Sunday). Do not look anything up during the timer. After grading, read every explanation, including for the ones you got right by luck. Anything you missed goes into that chapter's My notes as a one-line trap.</div></div>`;
}
function startQuiz(key){
  let items=[];
  if(key==="MIX"){
    const plan={AI:7,MSO:3,AW:3,PCE:2,TM:2,SS:2,CC:1,ETD:0};
    Object.keys(plan).forEach(d=>{ const idx=[...QUIZ[d].keys()].sort(()=>Math.random()-.5).slice(0,plan[d]); idx.forEach(i=>items.push({d,i})); });
    items.sort(()=>Math.random()-.5);
  } else {
    items = QUIZ[key].map((_,i)=>({d:key,i})).sort(()=>Math.random()-.5);
  }
  const secs = Math.round(items.length*135);
  quizRun = {key, items, sel:{}, graded:false, end:Date.now()+secs*1000, total:secs};
  quizRun.timer = setInterval(tickTimer,1000);
  renderQuiz(); window.scrollTo({top:0,behavior:"smooth"});
}
function tickTimer(){
  if(!quizRun||quizRun.graded) return;
  const left=Math.max(0,Math.round((quizRun.end-Date.now())/1000));
  const t=document.getElementById("qtimer"); if(t){ t.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0"); t.classList.toggle("low",left<120); }
  if(left<=0) gradeQuiz();
}
function renderQuizRun(el){
  const r=quizRun;
  const items = r.items.map((it,n)=>{
    const q=QUIZ[it.d][it.i]; const multi=q.a.length>1; const sel=r.sel[n]||[];
    const opts=q.o.map((o,oi)=>{
      const on=sel.includes(oi);
      let cls="opt"; if(r.graded){ if(q.a.includes(oi)) cls+=" right"; else if(on) cls+=" wrong"; }
      return `<label class="${cls}"><input type="${multi?"checkbox":"radio"}" name="q${n}" data-qn="${n}" data-oi="${oi}" ${on?"checked":""} ${r.graded?"disabled":""}><span>${esc(o)}</span></label>`;
    }).join("");
    const ok = r.graded && sel.length===q.a.length && q.a.every(x=>sel.includes(x));
    return `<div class="qitem ${r.graded?"graded":""}"><div class="qn">Q${n+1} · ${esc(DOMAINS[it.d].name)}${multi?` · <b>select ${q.a.length}</b>`:""}${r.graded?(ok?' · <b style="color:var(--done)">correct</b>':' · <b style="color:var(--red)">incorrect</b>'):""}</div>
      <div class="qt">${esc(q.q)}</div>${opts}<div class="why">${esc(q.w)}</div></div>`;
  }).join("");
  let result="";
  if(r.graded){
    const pct=Math.round(100*r.score/r.items.length);
    const byDom={}; r.items.forEach((it,n)=>{ byDom[it.d]=byDom[it.d]||{c:0,t:0}; byDom[it.d].t++; if(r.correct[n]) byDom[it.d].c++; });
    const dom = Object.keys(byDom).map(d=>`${esc(DOMAINS[d].name)}: ${byDom[d].c}/${byDom[d].t}`).join(" · ");
    result=`<div class="result ${pct>=80?"pass":"fail"}"><b>${pct}%</b><div>${r.score}/${r.items.length} correct · ${Math.round((r.total-Math.max(0,Math.round((r.end-Date.now())/1000)))/60)} min used<br><span style="opacity:.85;font-size:13px">${dom}</span></div><button data-endquiz="1" style="margin-left:auto">Back to bank</button></div>`;
  }
  el.innerHTML=`<div class="card quizrun"><div class="qhead"><div><h2 style="margin:0">${esc(quizTitle(r.key))}</h2><div class="sub" style="margin:0">${r.items.length} questions · no notes, no docs</div></div>
    <div style="display:flex;gap:10px;align-items:center">${r.graded?"":`<span class="timer" id="qtimer">--:--</span><button class="primary" data-gradequiz="1">Submit</button>`}<button class="ghost" data-endquiz="1">${r.graded?"Close":"Abandon"}</button></div></div>
    ${result}${items}${r.graded?`<div style="margin-top:14px"><button data-endquiz="1">Back to bank</button></div>`:`<div style="margin-top:14px"><button class="primary" data-gradequiz="1">Submit answers</button></div>`}</div>`;
  tickTimer();
}
async function gradeQuiz(){
  const r=quizRun; if(!r||r.graded) return;
  clearInterval(r.timer); r.graded=true; r.correct=[]; r.score=0;
  r.items.forEach((it,n)=>{ const q=QUIZ[it.d][it.i]; const sel=r.sel[n]||[]; const ok=sel.length===q.a.length&&q.a.every(x=>sel.includes(x)); r.correct[n]=ok; if(ok) r.score++; });
  state.quiz=state.quiz||{}; state.quiz[r.key]=state.quiz[r.key]||[];
  state.quiz[r.key].push({date:todayStr(), score:r.score, total:r.items.length});
  await store.save(state); renderQuiz(); renderHeader(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderTraps(){
  const el=document.getElementById("view-traps");
  const all=allTraps(); const due=dueTraps(); const list = showAllTraps?all:due;
  const boxes=[0,1,2,3,4,5].map(b=>({b, n:all.filter(t=>trapState(t.id).box===b).length}));
  const cards = list.map(t=>{ const s=trapState(t.id);
    return `<div class="srcard" data-trap="${t.id}"><div class="src">Chapter ${esc(t.ch.num)} · ${esc(t.ch.title)} · box ${s.box||"new"}</div>
      <div class="q">${esc(t.q)}</div><div class="a">${esc(t.a)}</div>
      <div class="btns"><button data-reveal="${t.id}">Show answer</button><button class="primary" data-sr="${t.id}" data-ok="1">Got it</button><button data-sr="${t.id}" data-ok="0">Missed</button></div></div>`; }).join("");
  el.innerHTML=`<div class="card"><h2>Trap review</h2><div class="sub">Spaced repetition over ${all.length} exam traps. New and missed traps come back tomorrow; each "Got it" doubles the gap (1 → 2 → 4 → 7 → 14 days). Clear the due pile every morning before studying — it takes 2–5 minutes. Aim to have everything in box 3+ by 30 Oct.</div>
    <div class="boxes">${boxes.map(x=>`<span class="box">${x.b===0?"new":"box "+x.b} <b>${x.n}</b></span>`).join("")}<span class="box" style="background:var(--amber-soft)">due today <b>${due.length}</b></span></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button data-toggletraps="1">${showAllTraps?"Show only due":"Review everything ("+all.length+")"}</button></div></div>
    ${cards||`<div class="card"><h2>Nothing due</h2><div class="sub">All caught up. Come back tomorrow, or use "Review everything" for a full pass.</div></div>`}`;
}
async function markTrap(id, ok){
  state.sr=state.sr||{}; const s=trapState(id); const t=todayStr();
  let box = ok?Math.min(5,(s.box||0)+1):1;
  state.sr[id]={box, due: addDays(t, ok?SR_INTERVALS[box]:1)};
  await store.save(state); renderTraps(); renderHeader();
}

function renderDash(){
  const el=document.getElementById("view-dash");
  const today=todayStr(); const keys=Object.keys(DOMAINS);
  const exams=state.exams||{};
  let wsum=0, wready=0, taken=0, low=[];
  const rows = keys.map(k=>{
    const d=DOMAINS[k]; const lp=domainLessonPct(k); const best=quizBest(k), last=quizLast(k);
    const ex=[1,2,3,4].map(n=>(exams[n]&&exams[n][k]!=null)?exams[n][k]:null);
    const latestEx=[...ex].reverse().find(v=>v!=null);
    const readiness = latestEx!=null?latestEx:best;
    wsum+=d.weight; if(readiness!=null){ wready+=d.weight*readiness/100; taken++; if(readiness<75) low.push(d.name); }
    const chs=CHAPTERS.filter(c=>c.keys.includes(k)).map(c=>c.num).join(", ");
    return `<tr><td><b style="color:${d.color}">■</b> ${esc(d.name)}<div class="hint">Ch ${chs}</div></td><td>${d.weight}%</td>
      <td><div class="bar"><i style="width:${lp||0}%"></i></div><div class="hint">${lp==null?"–":lp+"%"}</div></td>
      <td><div class="bar q"><i style="width:${best||0}%"></i></div><div class="hint">${best==null?"not taken":"best "+best+"% · last "+last+"%"}</div></td>
      ${ex.map((v,i)=>`<td><input type="number" min="0" max="100" data-exam="${i+1}" data-dom="${k}" value="${v==null?"":v}" placeholder="%"></td>`).join("")}
      <td><span class="${readiness==null?"":readiness>=80?"good":readiness>=75?"warn":"bad"}" style="font-weight:600;color:${readiness==null?"var(--ink-3)":readiness>=80?"var(--done)":readiness>=75?"var(--amber)":"var(--red)"}">${readiness==null?"–":readiness>=80?"ready":readiness>=75?"borderline":"weak"}</span></td></tr>`;
  }).join("");
  const wr = taken?Math.round(100*wready/wsum):null;
  const all=CHAPTERS.flatMap(itemIds); const done=all.filter(i=>state[i]).length;
  const daysLeft=Math.max(0,Math.round((new Date(EXAM_DATE+"T00:00:00")-new Date(today+"T00:00:00"))/86400000));
  const mixLast=quizLast("MIX");
  const exAvg = n=>{ const e=exams[n]; if(!e) return null; let s=0,w=0; keys.forEach(k=>{ if(e[k]!=null){ s+=DOMAINS[k].weight*e[k]; w+=DOMAINS[k].weight; } }); return w?Math.round(s/w):null; };
  const exLine=[1,2,3,4].map(n=>{const v=exAvg(n); return `Exam ${n}: <b>${v==null?"–":v+"%"}</b>`;}).join(" · ");
  el.innerHTML=`<div class="card"><h2>Domain dashboard</h2><div class="sub">Where you stand against the exam blueprint. Readiness per domain = latest practice-exam score if entered, otherwise best quiz score. Weighted readiness multiplies each by the domain's exam weight — this is the number that predicts the real result.</div>
    <div class="kpis">
      <div class="kpi"><b>${daysLeft}</b><span>days to exam</span></div>
      <div class="kpi"><b>${Math.round(100*done/all.length)}%</b><span>plan complete</span></div>
      <div class="kpi ${pctClass(wr)}"><b>${wr==null?"–":wr+"%"}</b><span>weighted readiness</span></div>
      <div class="kpi ${pctClass(mixLast)}"><b>${mixLast==null?"–":mixLast+"%"}</b><span>last mixed quiz</span></div>
      <div class="kpi ${low.length?"bad":taken?"good":""}"><b>${taken?low.length:"–"}</b><span>domains under 75%</span></div>
    </div>
    <div class="weightbar">${keys.map(k=>`<span style="width:${DOMAINS[k].weight}%;background:${DOMAINS[k].color}" title="${esc(DOMAINS[k].name)} ${DOMAINS[k].weight}%">${DOMAINS[k].weight>=8?DOMAINS[k].weight+"%":""}</span>`).join("")}</div>
    <div class="legend">${keys.map(k=>`<span><i style="background:${DOMAINS[k].color}"></i>${esc(DOMAINS[k].name)}</span>`).join("")}</div>
    <div style="overflow-x:auto"><table class="dtable"><thead><tr><th>Domain</th><th>Weight</th><th>Plan progress</th><th>Quiz</th><th>Exam 1<br><span class="hint">24 Oct</span></th><th>Exam 2<br><span class="hint">27 Oct</span></th><th>Exam 3<br><span class="hint">29 Oct</span></th><th>Exam 4<br><span class="hint">31 Oct</span></th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="hint" style="margin-top:8px">Practice-exam columns: enter your per-domain percentage after each timed exam in Chapters 7–8. Weighted averages — ${exLine}.</div>
    ${low.length?`<div class="trap" style="margin-top:12px"><b>Gap-day targets:</b> ${esc(low.join(", "))}. Rebuild that chapter's main lab, re-read its traps, retake its quiz.</div>`:""}
    <div class="tip" style="margin-top:12px"><b>Go / no-go on 31 Oct:</b> weighted readiness ≥ 80% and no domain under 70% → sit the exam. Otherwise reschedule while it is still free.</div>
  </div>`;
}

/* ============================================================
   RENDER — cheat sheet
   ============================================================ */
function renderCheat(){
  const el=document.getElementById("view-cheat");
  const secs = CHAPTERS.filter(c=>(c.cheat&&c.cheat.length)||(c.traps&&c.traps.length)).map(c=>{
    const lines=(c.cheat||[]).map(x=>`<li>${esc(x)}</li>`).join("");
    const traps=(c.traps||[]).map(t=>`<li class="trapline">${esc(t[0])} → ${esc(t[1])}</li>`).join("");
    const mine=(state.notes&&state.notes[c.id]||"").trim();
    return `<h2>${c.num==="★"?"":c.num+" · "}${esc(c.title)}</h2><ul>${lines}${traps}</ul>${mine?`<div class="hint" style="margin:4px 0 0"><b>My notes:</b> ${esc(mine).replace(/\n/g,"<br>")}</div>`:""}`;
  }).join("");
  el.innerHTML=`<div class="card cheat"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="border:0;margin:0;font-size:19px">Cheat sheet</h2><div class="sub" style="margin:0">Every key fact and trap from all chapters, plus your own notes. Print it on 30 Oct and read it twice — for memory only; nothing goes into the exam room.</div></div><button data-print="1">Print / save as PDF</button></div>${secs}</div>`;
}

/* ============================================================
   RENDER — library
   ============================================================ */
let libQuery = "";
function renderLib(){
  const el=document.getElementById("view-lib");
  const q=libQuery.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const match = e => { if(!words.length) return true; const hay=(e.title+" "+e.f.join(" ")+" "+(e.c||"")+" "+(e.t||[]).join(" ")+" "+(e.n||"")).toLowerCase(); return words.every(w=>hay.includes(w)); };
  const groups = CHAPTERS.map(ch=>({ch, items: LIBRARY.filter(e=>e.ch===ch.id && match(e))})).filter(g=>g.items.length);
  const nav = CHAPTERS.map(ch=>{ const n=LIBRARY.filter(e=>e.ch===ch.id).length; return n?`<a href="#libgroup-${ch.id}" data-golibgroup="${ch.id}">${ch.num==="★"?"":ch.num+" · "}${esc(ch.title)} (${n})</a>`:""; }).join("");
  const body = groups.map(g=>`<div class="libgroup" id="libgroup-${g.ch.id}"><h2>${g.ch.num==="★"?"":"Chapter "+g.ch.num+" — "}${esc(g.ch.title)}</h2>${g.items.map(e=>`
    <div class="libentry" id="lib-${e.id}">
      <h3>${esc(e.title)}</h3>
      <div class="src">${e.u.length?`<a href="${e.u[0]}" target="_blank" rel="noopener">original ↗</a>`:"<span>Written for this tracker from the blueprint and the docs above</span>"}${e.u.length?"· verified against the live page 6 Sep 2026":""}</div>
      <ul>${e.f.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      ${e.c?`<pre><code>${esc(e.c)}</code></pre>`:""}
      ${e.t&&e.t.length?`<div class="traps"><b>Exam traps</b><ul>${e.t.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
      ${e.n?`<div class="now"><b>Then vs now:</b> ${esc(e.n)}</div>`:""}
    </div>`).join("")}</div>`).join("");
  el.innerHTML=`<div class="card"><h2>Library</h2><div class="sub">${LIBRARY.length} digests — every document in the reading lists (official docs, engineering posts, MCP spec, Claude Code docs, the exam guide) condensed to the facts, numbers, code and traps you are examined on, plus five written-for-you entries covering the blueprint's engineering-foundations and application-design sub-skills. Each entry links to the original if you want the full page. The "Then vs now" boxes flag where the live docs have moved on from what the exam was written against.</div>
    <input class="libsearch" type="text" placeholder="Search the library — e.g. tool_choice, 529, minimum cacheable, exit code 2, custom_id" value="${esc(libQuery)}" data-libsearch="1">
    <div class="libnav">${nav}</div></div>${body||'<div class="card"><h2>No matches</h2></div>'}`;
}

/* ============================================================
   HEADER + VIEW SWITCH
   ============================================================ */
function renderHeader(){
  const today=todayStr();
  const all = CHAPTERS.flatMap(itemIds);
  const done = all.filter(i=>state[i]).length;
  const pct = Math.round(100*done/all.length);
  document.getElementById("doneCount").textContent = done+"/"+all.length;
  document.getElementById("overallBar").style.width = pct+"%";
  document.getElementById("overallText").textContent = pct+"% complete";
  const ex = new Date(EXAM_DATE+"T00:00:00"), t=new Date(today+"T00:00:00");
  document.getElementById("daysLeft").textContent = Math.max(0,Math.round((ex-t)/86400000));
  let behind=0; CHAPTERS.forEach(ch=>ch.lessons.forEach((l,i)=>{ if(l.d<today && !state[ch.id+":l"+i]) behind++; }));
  document.getElementById("behind").textContent = behind;
  const due=dueTraps().length;
  document.getElementById("srDue").textContent = due;
  document.getElementById("srBadge").textContent = due; document.getElementById("srBadge").hidden = !due;
  document.getElementById("storeNote").textContent =
    store.mode==="memory" ? "Progress is kept only while this page is open — use Export to keep it." :
    store.mode==="browser" ? "Public copy on amitphadke.com — ticks and notes save only in this browser. Amit's live progress is tracked separately." : "Progress is saved to your account.";
}
function switchView(v){
  view=v;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.view===v));
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==="view-"+v));
  document.getElementById("wrap").classList.toggle("single", v!=="plan");
  document.getElementById("sidenav").hidden = v!=="plan";
  try{ localStorage.setItem("ccdvf-view", v); }catch(e){}
}
function render(){ renderPlan(); renderQuiz(); renderTraps(); renderDash(); renderCheat(); renderLib(); renderHeader(); }
function goLib(id){ switchView("lib"); const el=document.getElementById("lib-"+id); if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); el.classList.add("hit"); setTimeout(()=>el.classList.remove("hit"),1600); } }

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("change", async e=>{
  const el=e.target;
  if(el.matches("input[type=checkbox][data-id]")){
    if(el.checked) state[el.dataset.id]=true; else delete state[el.dataset.id];
    await store.save(state); render();
  } else if(el.matches("input[data-qn]")){
    const n=+el.dataset.qn, oi=+el.dataset.oi; const q=QUIZ[quizRun.items[n].d][quizRun.items[n].i];
    if(q.a.length>1){ const s=new Set(quizRun.sel[n]||[]); el.checked?s.add(oi):s.delete(oi); quizRun.sel[n]=[...s]; }
    else quizRun.sel[n]=[oi];
  } else if(el.matches("input[data-exam]")){
    state.exams=state.exams||{}; const n=el.dataset.exam; state.exams[n]=state.exams[n]||{};
    const v=el.value===""?null:Math.max(0,Math.min(100,+el.value));
    if(v==null) delete state.exams[n][el.dataset.dom]; else state.exams[n][el.dataset.dom]=v;
    await store.save(state); renderDash();
  }
});
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.matches("textarea[data-note]")){
    state.notes = state.notes||{}; state.notes[el.dataset.note]=el.value;
    clearTimeout(el._t); el._t=setTimeout(()=>{store.save(state); renderCheat();},400);
  } else if(el.matches("input[data-libsearch]")){
    libQuery=el.value; clearTimeout(el._t); el._t=setTimeout(()=>{ renderLib(); const i=document.querySelector("input[data-libsearch]"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },250);
  } else if(el.matches("textarea[data-retro]")){
    state.retro=state.retro||{}; const c=el.dataset.retro; state.retro[c]=state.retro[c]||{}; state.retro[c][el.dataset.i]=el.value;
    clearTimeout(el._t); el._t=setTimeout(()=>store.save(state),400);
  }
});
document.addEventListener("click", e=>{
  const gl=e.target.closest("[data-golib]"); if(gl){ e.preventDefault(); goLib(gl.dataset.golib); return; }
  const gg=e.target.closest("[data-golibgroup]"); if(gg){ e.preventDefault(); const el=document.getElementById("libgroup-"+gg.dataset.golibgroup); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const li=e.target.closest(".qa li"); if(li){ li.classList.toggle("show"); return; }
  const tab=e.target.closest(".tab"); if(tab){ switchView(tab.dataset.view); return; }
  const b=e.target.closest("[data-startquiz]"); if(b){ switchView("quiz"); startQuiz(b.dataset.startquiz); return; }
  if(e.target.closest("[data-gradequiz]")){ gradeQuiz(); return; }
  if(e.target.closest("[data-endquiz]")){ if(quizRun&&!quizRun.graded&&!confirm("Abandon this quiz? Nothing will be recorded.")) return; if(quizRun) clearInterval(quizRun.timer); quizRun=null; renderQuiz(); return; }
  const g=e.target.closest("[data-goquiz]"); if(g){ e.preventDefault(); switchView("quiz"); window.scrollTo({top:0}); return; }
  const rv=e.target.closest("[data-reveal]"); if(rv){ rv.closest(".srcard").classList.add("show"); return; }
  const sr=e.target.closest("[data-sr]"); if(sr){ markTrap(sr.dataset.sr, sr.dataset.ok==="1"); return; }
  if(e.target.closest("[data-toggletraps]")){ showAllTraps=!showAllTraps; renderTraps(); return; }
  if(e.target.closest("[data-print]")){ window.print(); return; }
});
document.getElementById("btnToday").onclick=()=>{
  switchView("plan");
  const t=todayStr(); const ch=CHAPTERS.find(c=>t>=c.start&&t<=c.end)||CHAPTERS.find(c=>c.start>t)||CHAPTERS[CHAPTERS.length-1];
  document.getElementById(ch.id).scrollIntoView({behavior:"smooth",block:"start"});
};
document.getElementById("btnExport").onclick=async()=>{
  const j=JSON.stringify(state);
  try{ await navigator.clipboard.writeText(j); alert("Progress JSON copied to clipboard. Paste it somewhere safe (Notes, a file)."); }
  catch(e){ prompt("Copy this JSON:", j); }
};
document.getElementById("btnImport").onclick=async()=>{
  const j=prompt("Paste your exported progress JSON:"); if(!j) return;
  try{ state=JSON.parse(j); await store.save(state); render(); }catch(e){ alert("That wasn't valid JSON — nothing changed."); }
};
document.getElementById("btnReset").onclick=async()=>{
  if(confirm("Clear all ticks, notes, quiz scores and trap progress? This cannot be undone.")){ state={}; await store.save(state); render(); }
};
window.addEventListener("beforeunload", e=>{ if(quizRun&&!quizRun.graded){ e.preventDefault(); e.returnValue=""; } });

(async()=>{
  state = await store.load() || {};
  render();
  let v="plan"; try{ v=localStorage.getItem("ccdvf-view")||"plan"; }catch(e){}
  switchView(v);
})();
</script>
</body>
</html>
