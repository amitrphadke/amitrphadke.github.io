 f:["Set stream: true; transport is server-sent events (SSE).","Event order: message_start → (content_block_start → content_block_delta* → content_block_stop)* → message_delta → message_stop. ping can appear anywhere; an error event (e.g. overloaded_error) can arrive mid-stream after a 200.","Delta types: text_delta (text), input_json_delta (partial_json — accumulate then parse), thinking_delta, signature_delta (just before a thinking block stops), citations_delta.","message_start usage shows input_tokens (and output_tokens: 1); message_delta carries cumulative output usage and the stop_reason.","Streaming is required when max_tokens exceeds 128,000; non-streaming requests time out at about 10 minutes.","Python helpers: client.messages.stream() context manager, .text_stream, .get_final_message(). TS: .finalMessage().","Recovering an interrupted stream: on 4.6+ send a user message 'Your previous response was interrupted and ended with […]. Continue from where you left off.' Tool-use and thinking blocks cannot be partially recovered — resume from the last text block."],
 c:"with client.messages.stream(\n    model=\"claude-sonnet-5\", max_tokens=1024,\n    messages=[{\"role\": \"user\", \"content\": \"Hello\"}],\n) as stream:\n    for text in stream.text_stream:\n        print(text, end=\"\", flush=True)\nfinal = stream.get_final_message()\nprint(final.stop_reason, final.usage.output_tokens)",
 t:["Tool inputs arrive as input_json_delta.partial_json strings that must be concatenated — never as complete objects.","Final usage and stop_reason come in message_delta, not message_stop.","An SSE error event can arrive after HTTP 200 — handle overloaded_error inside the stream."]},

{id:"structured", ch:"ch1", title:"Structured outputs (JSON schema + strict tools)", u:["https://platform.claude.com/docs/en/build-with-claude/structured-outputs","https://docs.claude.com/en/docs/build-with-claude/structured-outputs"],
 f:["Two features: JSON outputs via output_config.format = {type:'json_schema', schema} (replaces the deprecated output_format name), and strict tool use via strict: true on a tool definition. GA — no beta header needed.","Supported: Opus 4.5+, Sonnet 4.5+, Haiku 4.5, Fable/Mythos 5.x.","Schema support: standard types, enum, const, required, anyOf, type arrays (['string','null']), nested objects/arrays, additionalProperties:false (required — SDK adds it), limited format/pattern. Not supported: minimum/maximum, minLength/maxLength, minItems/maxItems, not, allOf, most oneOf, $ref, if/then/else — the SDK strips them and appends the constraint to descriptions.","Limits: 20 strict tools per request; 24 optional parameters combined; 16 union-type parameters; 180 s grammar compile timeout. Grammar is cached 24 h; invalidated by schema structure or tool-set changes, not by name/description edits.","Changing output_config.format invalidates the prompt cache; a small input-token overhead is added by an injected system prompt.","Output may NOT match the schema when stop_reason is refusal (still HTTP 200, still billed) or max_tokens — always check stop_reason before parsing.","Enum casing may drift — compare case-insensitively; required properties are emitted before optional ones.","Incompatible with citations (400) and with prefill; the grammar constrains only the final output, not tool calls or thinking. Works with streaming, Batches (50% off) and token counting.","Python SDK: client.messages.parse(output_format=PydanticModel) → response.parsed_output; anthropic.transform_schema() helper."],
 c:"from pydantic import BaseModel\nclass Incident(BaseModel):\n    name: str\n    severity: str\n    component: str\nresp = client.messages.parse(\n    model=\"claude-sonnet-5\", max_tokens=512,\n    messages=[{\"role\": \"user\", \"content\": incident_text}],\n    output_format=Incident,\n)\nprint(resp.parsed_output)   # validated Incident instance",
 t:["The raw API parameter is output_config.format — not response_format, not top-level output_format.","Structured output + citations → 400.","stop_reason 'refusal' returns HTTP 200 with non-conforming output — check stop_reason, don't just json.loads."],
 n:"Classic exam answers for 'guaranteed JSON' were prefill + validation, or a forced tool with input_schema. Both still count as correct reasoning; structured outputs is the modern, stronger answer where the options include it."},

{id:"vision", ch:"ch1", title:"Vision (images)", u:["https://platform.claude.com/docs/en/build-with-claude/vision","https://docs.claude.com/en/docs/build-with-claude/vision"],
 f:["Formats: image/jpeg, image/png, image/gif (first frame only), image/webp. Sources: base64, url, file (Files API — recommended when reusing an image across turns).","Max size 10 MB base64 on the Claude API (5 MB on Bedrock/Vertex); max 8000×8000 px; with more than 20 images per request each is capped at 2000×2000.","Auto-downscaled preserving aspect ratio to a long edge of 1568 px (standard) or 2576 px (high-res, Claude 4.7+). 'oversized_image': 'error' rejects instead of resizing.","Per request: 100 images on 200K-context models, 600 on 1M models; claude.ai 20 per message.","Token cost ≈ ceil(width/28) × ceil(height/28): 200×200 = 64 tokens; 1000×1000 ≈ 1,296; 1920×1080 ≈ 1,560 (standard). Example: Haiku 4.5 at $1/MTok → about $1.30 per 1,000 1000×1000 images.","Limitations: cannot identify people; weak on <200 px, rotated or low-quality images; approximate spatial coordinates; poor at counting many small objects; cannot detect AI-generated images; not for medical scans; no image generation."],
 c:"import base64\ndata = base64.standard_b64encode(open(\"shot.png\",\"rb\").read()).decode()\nmsg = client.messages.create(model=\"claude-sonnet-5\", max_tokens=1024,\n    messages=[{\"role\":\"user\",\"content\":[\n        {\"type\":\"image\",\"source\":{\"type\":\"base64\",\"media_type\":\"image/png\",\"data\":data}},\n        {\"type\":\"text\",\"text\":\"Describe this screenshot.\"}]}])",
 t:["The token formula is now width/28 × height/28 (28-px patches); the old (w×h)/750 rule is out of date — both give the same order of magnitude.","Bedrock/Vertex cap images at 5 MB vs 10 MB on the Claude API.","More than 20 images in a request lowers the per-image cap to 2000×2000."]},

{id:"pdf", ch:"ch1", title:"PDF support (document blocks)", u:["https://platform.claude.com/docs/en/build-with-claude/pdf-support","https://docs.claude.com/en/docs/build-with-claude/pdf-support"],
 f:["Content block type 'document', media_type application/pdf; sources url, base64, file (file_id). Plain text (.txt/.csv/.md) uses text/plain; .docx/.xlsx must be converted first.","Limits: 32 MB per request; 600 pages (100 pages on models with a 200K window); no encrypted/password PDFs.","Each page is rasterised to an image AND its text extracted; both go to the model (so charts and tables work). Cost = 1,500–3,000 text tokens per page plus image tokens; no extra PDF fee.","Put document blocks before the text in the user message; refer to logical page numbers; split very large PDFs.","Supports cache_control on the document block, citations, and Message Batches."],
 c:"msg = client.messages.create(model=\"claude-sonnet-5\", max_tokens=1024,\n    messages=[{\"role\":\"user\",\"content\":[\n        {\"type\":\"document\",\"source\":{\"type\":\"url\",\"url\":\"https://example.com/report.pdf\"},\n         \"cache_control\":{\"type\":\"ephemeral\"}},\n        {\"type\":\"text\",\"text\":\"What are the key findings? Cite pages.\"}]}])",
 t:["600 pages on 1M-context models but only 100 on 200K models such as Haiku 4.5.","PDFs are billed as text AND image tokens per page.","Block type is 'document', not 'image'."]},

{id:"files", ch:"ch1", title:"Files API", u:["https://platform.claude.com/docs/en/build-with-claude/files","https://docs.claude.com/en/docs/build-with-claude/files"],
 f:["GA. Endpoints: POST /v1/files (upload), GET /v1/files, GET /v1/files/{id}, GET /v1/files/{id}/content, DELETE /v1/files/{id}.","Limits: 500 MB per file, 1 TB per organisation, ~500 requests/min.","Mapping: PDF → document; text/plain → document; jpeg/png/gif/webp → image; other files → container_upload (for code execution).","Reference with source {type:'file', file_id}. Uploaded files are not downloadable (400) — only files produced by code execution/skills are.","Optional expires_in_seconds at upload: 1 hour to 90 days. Files are workspace-scoped — any key in the workspace can read them; never accept file_ids from untrusted users; use one workspace per tenant.","Upload/storage is free; content is billed as input tokens every time it is referenced. Not ZDR-eligible."],
 c:"up = client.files.upload(file=(\"doc.pdf\", open(\"doc.pdf\",\"rb\"), \"application/pdf\"))\nmsg = client.messages.create(model=\"claude-sonnet-5\", max_tokens=1024,\n    messages=[{\"role\":\"user\",\"content\":[\n        {\"type\":\"document\",\"source\":{\"type\":\"file\",\"file_id\":up.id}},\n        {\"type\":\"text\",\"text\":\"Summarise this.\"}]}])",
 t:["Files are workspace-scoped, not per key or per user.","Uploading is free; you pay tokens each time the file is used in a request.","You cannot download a file you uploaded — only tool-generated outputs."]},

{id:"sdks", ch:"ch1", title:"Client SDKs (Python)", u:["https://platform.claude.com/docs/en/cli-sdks-libraries/sdks/python","https://platform.claude.com/docs/en/api/client-sdks","https://docs.claude.com/en/api/client-sdks","https://github.com/anthropics/anthropic-sdk-python"],
 f:["Official SDKs: Python, TypeScript, C#, Go, Java, PHP, Ruby (+ CLI, Swift, OpenAI-compat layer). Python: pip install anthropic, Python ≥3.10, reads ANTHROPIC_API_KEY.","Clients: Anthropic, AsyncAnthropic, AnthropicBedrock, AnthropicVertex, AnthropicFoundry (and AWS variants).","Defaults: max_retries=2 (exponential backoff, honours retry-after); timeout 10 minutes. Retried automatically: connection errors, 408, 409, 429, ≥500. Per-call override: client.with_options(max_retries=5, timeout=20.0).","Exceptions: APIStatusError base → BadRequestError 400, AuthenticationError 401, PermissionDeniedError 403, NotFoundError 404, ConflictError 409, UnprocessableEntityError 422, RateLimitError 429, InternalServerError ≥500; plus APIConnectionError, APITimeoutError.","Helpers: messages.stream(), messages.parse(), messages.count_tokens(), files.upload(), client.beta.messages with betas=[...], auto-pagination on .list(), message.to_dict(), message._request_id.","SDK v1.0+ removed temperature/top_p/top_k (TypeError if passed)."],
 c:"from anthropic import Anthropic, RateLimitError, APIStatusError\nclient = Anthropic(max_retries=3, timeout=60)\ntry:\n    m = client.with_options(timeout=20.0).messages.create(\n        model=\"claude-sonnet-5\", max_tokens=256,\n        messages=[{\"role\":\"user\",\"content\":\"ping\"}])\n    print(m._request_id)\nexcept RateLimitError as e:\n    print(\"429\", e.response.headers.get(\"retry-after\"))\nexcept APIStatusError as e:\n    print(e.status_code, e.message)",
 t:["Default retries = 2 (three attempts total); default timeout = 10 minutes.","Beta features go through client.beta.messages with a betas=[...] list.","429 and 5xx are auto-retried; 400/401/403/404 are not."]},

{id:"errors", ch:"ch2", title:"API errors", u:["https://platform.claude.com/docs/en/api/errors","https://docs.claude.com/en/api/errors"],
 f:["400 invalid_request_error · 401 authentication_error · 402 billing_error · 403 permission_error · 404 not_found_error · 409 conflict_error · 413 request_too_large · 429 rate_limit_error · 500 api_error · 504 timeout_error · 529 overloaded_error.","Error body: {type:'error', error:{type, message}, request_id:'req_…'}. Header request-id; Python message._request_id.","Request-size limits: Messages 32 MB, Token Counting 32 MB, Batches 256 MB, Files 500 MB.","Non-streaming requests can time out around 10 minutes — stream or use Batches for long jobs; don't set huge max_tokens without streaming.","SDKs retry transient errors (connection, 429, 5xx) with backoff, 2 retries by default, honouring retry-after.","SSE error events can arrive after a 200 response."],
 c:"",
 t:["529 overloaded_error is Anthropic-side; 429 rate_limit_error is your quota.","413: Messages cap is 32 MB, Batch 256 MB.","A 400 can also mean an organisation spend limit was hit, not only malformed input."]},

{id:"ratelimits", ch:"ch2", title:"Rate limits", u:["https://platform.claude.com/docs/en/api/rate-limits","https://docs.claude.com/en/api/rate-limits"],
 f:["Usage tiers by monthly spend cap: Start $500, Build $1,000, Scale $200,000, Custom; new orgs may start in an Evaluation tier.","Three limits per model per organisation: requests/min (RPM), input tokens/min (ITPM), output tokens/min (OTPM). Limits are per model — hitting Sonnet's limit doesn't block Opus.","Cache-aware ITPM: input_tokens + cache_creation_input_tokens count; cache_read_input_tokens do NOT (except Haiku 3.5). At 80% cache hit, 2M ITPM ≈ 10M effective tokens/min.","Token-bucket enforcement with continuous replenishment — bursts get 429 even under the per-minute number. max_tokens does not count toward OTPM.","429 returns retry-after (seconds). A spend-cap 429 has details.error_code 'enforced_spend_limit_reached', no retry-after, and resets on the 1st at 00:00 UTC.","Headers: anthropic-ratelimit-{requests,input-tokens,output-tokens}-{limit,remaining,reset}; retry-after.","Batches: 1,000 RPM shared across models; 200,000 requests in the processing queue; 100,000 requests per batch."],
 c:"raw = client.messages.with_raw_response.create(model=\"claude-sonnet-5\", max_tokens=64,\n    messages=[{\"role\":\"user\",\"content\":\"ping\"}])\nprint(raw.headers[\"anthropic-ratelimit-input-tokens-remaining\"])",
 t:["Cache reads are free against ITPM — caching raises effective throughput, not just cost.","A spend-limit 429 has no retry-after and won't clear until next month.","Limits are per model per org/workspace."]},

{id:"models", ch:"ch3", title:"Models overview and IDs", u:["https://platform.claude.com/docs/en/about-claude/models/overview","https://docs.claude.com/en/docs/about-claude/models/overview","https://docs.claude.com/en/docs/about-claude/models/choosing-a-model"],
 f:["Current lineup (Sep 2026): Claude Fable 5.1 claude-fable-5-1 (1M context, 128K max output, adaptive thinking always on, $10/$50); Claude Opus 5 claude-opus-5 (1M, 128K, adaptive, $5/$25); Claude Sonnet 5 claude-sonnet-5 (1M, 128K, adaptive, $2/$10, fast); Claude Haiku 4.5 claude-haiku-4-5-20251001 (200K, 64K, manual extended thinking, $1/$5, fastest).","Recommendations: Opus 5 for most workloads; Fable 5.1 for the hardest reasoning/agentic work; Sonnet 5 for speed/cost balance; Haiku 4.5 for budget and speed. Default effort is high on the 5-series; effort is not supported on Haiku 4.5.","All support text+image input, tool use, vision, multilingual output.","ID formats: 4.6 and later are dateless and pinned (claude-sonnet-4-6, claude-opus-5) — they are snapshots, not evergreen aliases. Pre-4.6: dated IDs (claude-sonnet-4-5-20250929) plus rolling aliases (claude-sonnet-4-5). Bedrock: anthropic.claude-opus-5; Vertex: same as API.","Weights never change for a given ID. GET /v1/models returns max_input_tokens, max_tokens and capabilities.","Same models on Amazon Bedrock, Google Vertex AI, Microsoft Foundry with platform-specific IDs and SDK clients."],
 c:"for m in client.models.list():\n    print(m.id, m.display_name)",
 t:["claude-sonnet-4-6 is a fixed snapshot; claude-sonnet-4-5 is an alias that rolls forward — only pre-4.6 IDs have alias/snapshot pairs.","Haiku 4.5 is the only current model with 200K context / 64K output; the 5-series is 1M / 128K.","Fable 5.1's adaptive thinking cannot be turned off."],
 n:"Exam questions naming 'Opus / Sonnet / Haiku' tiers are about trade-offs (quality vs latency vs cost), which are unchanged. If a stem uses older IDs (claude-3-5-…, claude-sonnet-4-…), answer on the tier logic; all Claude 3.x models are retired as of 2026."},

{id:"pricing", ch:"ch3", title:"Pricing", u:["https://platform.claude.com/docs/en/about-claude/pricing","https://docs.claude.com/en/docs/about-claude/pricing"],
 f:["USD per million tokens — input / 5-min cache write / 1-h cache write / cache read / output: Fable 5.1 $10 / 12.50 / 20 / 0.25 / 50 · Opus 5 (and 4.5–4.8) $5 / 6.25 / 10 / 0.50 / 25 · Sonnet 5 $2 / 2.50 / 4 / 0.20 / 10 · Sonnet 4.5–4.6 $3 / 3.75 / 6 / 0.30 / 15 · Haiku 4.5 $1 / 1.25 / 2 / 0.10 / 5.","Multipliers: 5-min cache write 1.25×, 1-hour write 2×, cache read 0.1× (0.025× on Fable/Mythos 5.1). Batch API: 50% off input AND output (Opus 5 $2.50/$12.50; Sonnet 5 $1/$5; Haiku 4.5 $0.50/$2.50).","No long-context premium above 200K — the full 1M window is billed at standard rates. Data residency inference_geo 'us' = 1.1×.","Fast mode (Opus 5/4.8, preview): $10/$50; stacks with caching; not available in Batch.","Server tools: web search $10 per 1,000 searches (+ tokens, errors free); web fetch free beyond tokens; code execution free alongside web search/fetch, otherwise 1,550 free container-hours/month then $0.05/hour (5-min minimum).","Tool-use system prompt overhead: Opus 5 286 tokens (auto/none) / 406 (any/tool); Sonnet 5 354/474; Haiku 4.5 496/588."],
 c:"PRICE = {\"claude-opus-5\": (5, 25), \"claude-sonnet-5\": (2, 10), \"claude-haiku-4-5-20251001\": (1, 5)}\ndef cost(model, u, batch=False):\n    i, o = PRICE[model]\n    c = (u.input_tokens*i + u.cache_creation_input_tokens*i*1.25\n         + u.cache_read_input_tokens*i*0.1 + u.output_tokens*o) / 1e6\n    return c*0.5 if batch else c",
 t:["Cache write costs MORE than base input (1.25× or 2×); reads cost 0.1× — caching pays only with reuse (break-even ≈ 2 reads).","Batch discount is 50% on input and output but cannot combine with fast mode.","Output tokens are ~5× input price; thinking tokens are output."]},

{id:"deprecations", ch:"ch3", title:"Model deprecations", u:["https://platform.claude.com/docs/en/about-claude/model-deprecations","https://docs.claude.com/en/docs/about-claude/model-deprecations"],
 f:["Minimum 60 days' notice before retiring a publicly released model; email to orgs with active usage plus docs updates.","States: Active → Legacy (no updates) → Deprecated (still serves, retirement date set) → Retired (requests fail).","All Claude 3.x models are retired (3.5 Haiku and 3.7 Sonnet retired Feb 2026; 3 Haiku Apr 2026); Opus 4 / Sonnet 4 retired Jun 2026; Opus 4.1 retired Aug 2026. Oldest still-active: Sonnet 4.5 and Haiku 4.5.","Parameter deprecation: temperature/top_p/top_k → 400 on Opus 4.7+.","Audit your usage by model: Console Usage page → export CSV by API key and model."],
 c:"", t:["Deprecated models still work; only Retired ones fail.","Notice period is 60 days, not 30 or 90.","Migrate by re-running your evals on the replacement snapshot before switching IDs."]},

{id:"tokencount", ch:"ch3", title:"Token counting", u:["https://platform.claude.com/docs/en/build-with-claude/token-counting","https://docs.claude.com/en/docs/build-with-claude/token-counting"],
 f:["POST /v1/messages/count_tokens; SDK client.messages.count_tokens(...) → {input_tokens: N}. Free, but rate-limited separately (Start 5,000 RPM, Build 10,000, Scale 20,000).","Counts system, messages, tools, images, PDFs and thinking blocks — it is not text-only; input tokens only, no output estimate.","Claude 4.7+ uses a new tokenizer yielding ~30% more tokens for the same text — don't reuse older counts.","Result is an estimate; billing excludes system-added tokens. Request cap 32 MB."],
 c:"r = client.messages.count_tokens(model=\"claude-sonnet-5\",\n    system=\"You are a scientist\",\n    messages=[{\"role\":\"user\",\"content\":\"Hello, Claude\"}])\nprint(r.input_tokens)",
 t:["Token counting is free but has its own RPM limit.","Counts input only — never an output estimate.","4.7+ tokenizer counts ≈30% higher than 4.5/4.6 for identical text."]},
/* ---------- Chapter 2: tools, caching, batches ---------- */
{id:"tooluse", ch:"ch2", title:"Tool use overview", u:["https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview","https://docs.claude.com/en/docs/agents-and-tools/tool-use/overview","https://docs.claude.com/en/docs/build-with-claude/tool-use/overview"],
 f:["A tool = name, description, input_schema (JSON Schema object with properties and required).","tool_choice: {type:'auto'} default — Claude decides; {type:'any'} — must call some tool; {type:'tool', name} — must call that tool; {type:'none'} — no tools. disable_parallel_tool_use: true inside tool_choice limits Claude to one call per turn; parallel calls are on by default and appear as several tool_use blocks in one response.","When Claude calls a tool: stop_reason 'tool_use', block {type:'tool_use', id, name, input}. You reply in a USER message with {type:'tool_result', tool_use_id, content, is_error?}.","Client tools run in your code (custom tools plus Anthropic-defined computer use, text editor, bash, memory). Server tools run on Anthropic's side (web search, web fetch, code execution, MCP connector, tool search) — results come back directly; you do not send tool_result for them.","strict: true on a custom tool guarantees the call's arguments match the schema exactly (no hallucinated parameters).","Tool use injects an automatic system prompt of ~286–800 tokens depending on model and tool_choice (Opus 5 286/406; Sonnet 5 354/474; Haiku 4.5 496/588).","Billing: tools, tool_use and tool_result blocks are input tokens; client tools have no extra charge; web search / code execution have per-use charges.","Claude won't reliably invent missing required parameters — ask or make them optional; steer eagerness in the system prompt."],
 c:"tools = [{\"name\":\"get_weather\",\n  \"description\":\"Get the current weather for a city. Use whenever the user asks about weather or temperature. Returns a short text summary.\",\n  \"input_schema\":{\"type\":\"object\",\"properties\":{\"location\":{\"type\":\"string\"}},\"required\":[\"location\"]}}]\nr = client.messages.create(model=\"claude-sonnet-5\", max_tokens=1024, tools=tools,\n    messages=[{\"role\":\"user\",\"content\":\"Weather in Pune?\"}])\ntu = next(b for b in r.content if b.type == \"tool_use\")\nr2 = client.messages.create(model=\"claude-sonnet-5\", max_tokens=1024, tools=tools, messages=[\n    {\"role\":\"user\",\"content\":\"Weather in Pune?\"},\n    {\"role\":\"assistant\",\"content\": r.content},\n    {\"role\":\"user\",\"content\":[{\"type\":\"tool_result\",\"tool_use_id\":tu.id,\"content\":\"31°C, humid\"}]}])",
 t:["Server tools (web search, code execution) need no tool_result from you; client tools do.","any = some tool; tool = a named tool; none = disabled; auto = default.","disable_parallel_tool_use lives inside tool_choice, not at the top level."]},

{id:"definetools", ch:"ch2", title:"Define tools and handle tool calls", u:["https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools","https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls","https://docs.claude.com/en/docs/agents-and-tools/tool-use/implement-tool-use","https://docs.claude.com/en/docs/agents-and-tools/tool-use/implement-tool-use#handling-tool-use-and-tool-result-content-blocks"],
 f:["name must match ^[a-zA-Z0-9_-]{1,64}$; description and input_schema are required; optional: input_examples, cache_control, strict, defer_loading, allowed_callers.","The description is the single most important factor — 3–4+ sentences: what it does, when to use it, what each parameter means, what it returns. Prefer fewer, more capable tools; namespace names (github_list_prs).","tool_choice any/tool are NOT supported with manual extended thinking, nor on Fable/Mythos 5.1 — use auto + strict:true. With any/tool Claude emits no text before the tool_use block. Changing tool_choice invalidates cached message blocks (tools/system cache stays).","tool_result content may be a string or a list of text/image/document/search_result blocks; empty content is allowed; is_error defaults to false.","tool_result blocks must immediately follow the tool_use turn and must come FIRST in the user content array (text after them). Every tool_use id needs a matching tool_result or the API errors: 'tool_use ids were found without tool_result blocks'.","Parallel calls: return all results in one user message, one block per call.","Write instructive error messages ('Rate limit exceeded. Retry after 60 seconds.'); Claude typically retries 2–3 times on invalid-parameter errors.","Keep untrusted tool output inside tool_result blocks (never in system or plain text) to limit prompt injection."],
 c:"results = []\nfor b in r.content:\n    if b.type == \"tool_use\":\n        try:\n            out = REGISTRY[b.name](**b.input)\n            results.append({\"type\":\"tool_result\",\"tool_use_id\":b.id,\"content\":str(out)})\n        except Exception as e:\n            results.append({\"type\":\"tool_result\",\"tool_use_id\":b.id,\n                            \"content\":f\"Error: {e}. Check the arguments and retry.\",\"is_error\":True})\nmessages.append({\"role\":\"user\",\"content\": results})   # results first, then any text",
 t:["tool_result goes in a user message and must precede any text in that message.","is_error:true tells Claude the execution failed; it does not end the conversation.","Forced tool use (any/tool) is incompatible with manual extended thinking."]},

{id:"caching", ch:"ch2", title:"Prompt caching", u:["https://platform.claude.com/docs/en/build-with-claude/prompt-caching","https://docs.claude.com/en/docs/build-with-claude/prompt-caching"],
 f:["Mark a breakpoint with cache_control: {type:'ephemeral'}; optional ttl '5m' (default) or '1h'. Up to 4 breakpoints per request.","Pricing: 5-min write 1.25× base input; 1-hour write 2×; read 0.1× (0.025× on Fable/Mythos 5.1).","Minimum cacheable prefix by model: 512 tokens (Fable 5.1, Opus 5, Fable 5); 1,024 (Opus 4.8, Sonnet 5, Sonnet 4.6, Sonnet 4.5); 2,048 (Opus 4.7, Haiku 3.5); 4,096 (Opus 4.6, Opus 4.5, Haiku 4.5). Shorter prefixes are processed but silently not cached.","Prefix order: tools → system → messages. The system looks ~20 blocks back from each breakpoint for an earlier cache hit.","usage: cache_creation_input_tokens, cache_read_input_tokens, input_tokens (tokens after the last breakpoint); total input = the sum.","Invalidation: changing tool definitions invalidates everything; toggling web search/citations invalidates system+messages; changing tool_choice or adding/removing images invalidates the messages cache; thinking config changes usually invalidate; changing top-level effort invalidates the message cache.","Cannot cache thinking blocks directly, citation sub-blocks or empty text blocks; cached tokens still count toward the context window.","Place the breakpoint on the last block identical across requests; never on content with timestamps or per-request data. For chat, a moving breakpoint on the newest message caches history incrementally."],
 c:"r = client.messages.create(model=\"claude-sonnet-5\", max_tokens=300,\n    system=[{\"type\":\"text\",\"text\": BIG_STATIC_CONTEXT,\n             \"cache_control\":{\"type\":\"ephemeral\",\"ttl\":\"1h\"}}],\n    messages=[{\"role\":\"user\",\"content\":\"Summarise section 3.\"}])\nu = r.usage\nprint(u.cache_creation_input_tokens, u.cache_read_input_tokens, u.input_tokens)",
 t:["Reads are 10% of base price; writes cost MORE than base — caching only pays with reuse.","Order is tools → system → messages: a changed tool definition busts every downstream cache.","A 1,000-token system prompt on Haiku 4.5 or Opus 4.6 (4,096 minimum) will silently not be cached."]},

{id:"batches", ch:"ch2", title:"Message Batches API", u:["https://platform.claude.com/docs/en/build-with-claude/batch-processing","https://docs.claude.com/en/docs/build-with-claude/batch-processing"],
 f:["50% off standard prices on input and output; stacks with prompt caching.","Limits: 100,000 requests or 256 MB per batch. Most batches finish within 1 hour; hard limit 24 hours, after which unfinished requests are 'expired' (not billed). Results retrievable for 29 days.","Each request: custom_id (1–64 chars, unique) + params (normal Messages params). processing_status: in_progress → ended (or canceling → ended). Per-request result.type: succeeded, errored, canceled, expired — only succeeded is billed.","Results are NOT returned in input order — match on custom_id; delivered as a .jsonl stream.","Not supported: stream:true, fast mode. Supported: vision, tool use incl. server tools, system prompts, multi-turn, extended thinking, caching, all active models.","Endpoints: POST /v1/messages/batches; GET …/{id}; GET …; POST …/{id}/cancel; GET …/{id}/results; DELETE …/{id}. Validation errors surface asynchronously in results."],
 c:"from anthropic.types.message_create_params import MessageCreateParamsNonStreaming\nfrom anthropic.types.messages.batch_create_params import Request\nbatch = client.messages.batches.create(requests=[\n    Request(custom_id=f\"ticket-{i}\", params=MessageCreateParamsNonStreaming(\n        model=\"claude-haiku-4-5-20251001\", max_tokens=200,\n        messages=[{\"role\":\"user\",\"content\":t}])) for i, t in enumerate(tickets)])\nwhile client.messages.batches.retrieve(batch.id).processing_status != \"ended\":\n    time.sleep(30)\nfor res in client.messages.batches.results(batch.id):\n    print(res.custom_id, res.result.type)",
 t:["Discount is 50% on input AND output, and combines with caching.","'Guaranteed within 24 hours' is wrong — requests may expire at 24 h; typical is under an hour.","Results are unordered; custom_id is the only reliable join key."]},

/* ---------- Chapter 3: prompting, thinking, context ---------- */
{id:"pe-overview", ch:"ch3", title:"Prompt engineering overview", u:["https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview","https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview","https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/prefill-claudes-response"],
 f:["Prerequisites before prompt engineering: clear success criteria, empirical evals against them, a first-draft prompt.","Prompt engineering beats fine-tuning for most needs: faster, cheaper, preserves general knowledge, transparent, easy to iterate.","Prompting does not fix latency or cost — choose a different model or architecture for those.","Technique order (broad → specialised): be clear and direct → examples (few-shot) → XML structure → role via system prompt → let Claude think → chain prompts → long-context tips.","Resources: prompt generator/improver in the Console Workbench, the interactive GitHub tutorial, model-specific best-practice pages."],
 c:"", t:["Cost/latency problems → change model, not prompt.","Success criteria and evals must exist before you start iterating on prompts.","Clarity comes before examples; examples before thinking."]},

{id:"pe-best", ch:"ch3", title:"Claude prompting best practices (clarity, examples, XML, roles, thinking, long context)", u:["https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/be-clear-and-direct","https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/multishot-prompting","https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/use-xml-tags","https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/system-prompts","https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/chain-of-thought","https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/long-context-tips"],
 f:["Golden rule: show the prompt to a colleague with minimal context — if they'd be confused, so will Claude. Treat Claude as a brilliant new employee who lacks your context.","Be specific about output format and constraints; use numbered lists when order matters; explain WHY ('a text-to-speech engine will read this, so no ellipses' beats 'NEVER use ellipses'). Tell Claude what to do rather than what not to do.","Examples: 3–5, relevant and diverse, wrapped in <example> inside <examples>; include <thinking> inside examples to demonstrate reasoning style.","XML: consistent descriptive tag names; nest for hierarchy (<documents> → <document index='n'>); separate <instructions>, <context>, <input>.","Role: set it in the system parameter — even one sentence makes a difference; put task-specific data in the user turn.","Thinking: prefer general instructions ('think thoroughly') over prescriptive steps; adaptive thinking on 4.6+ (always on for Fable/Mythos 5.x); when thinking is off, use manual chain of thought with <thinking> and <answer> tags.","Long context (20k+ tokens): documents at the TOP, query at the END — up to 30% better; wrap each in <document> with <source> and <document_content>; ask Claude to quote relevant parts first.","Prefill on the last assistant turn is unsupported from Claude 4.6 (400 error); use explicit format instructions, XML output tags or structured outputs.","Prompt chaining remains useful when you must inspect intermediate outputs or enforce a pipeline (draft → review → refine).","Tool-use prompting: be explicit ('Change this function' vs 'Can you suggest'); require confirmation before destructive or irreversible actions."],
 c:"system = \"You are a senior SRE reviewing Terraform plans for risk.\"\nuser = \"\"\"<documents><document index=\"1\"><source>plan.txt</source>\n<document_content>{plan}</document_content></document></documents>\nFirst quote the lines relevant to stateful resources inside <quotes>, then classify the risk in <answer>.\"\"\"",
 t:["Long documents go ABOVE the question, not below.","Recommended few-shot count is 3–5, not 'as many as possible'.","Role goes in system; prefill on the last assistant turn is a 400 on Claude 4.6+."]},

{id:"thinking", ch:"ch3", title:"Extended thinking", u:["https://platform.claude.com/docs/en/build-with-claude/extended-thinking","https://docs.claude.com/en/docs/build-with-claude/extended-thinking"],
 f:["Manual mode: thinking={type:'enabled', budget_tokens:N} — N ≥ 1,024 and < max_tokens; budget is a target, max_tokens the hard ceiling. Adaptive mode: thinking={type:'adaptive'} plus output_config.effort.","Support: manual only on 4.5 and earlier (and Haiku 4.5); deprecated on 4.6; rejected (400) on 4.7+, Opus 5, Sonnet 5, Fable 5.1 — those are adaptive-only.","Thinking tokens are billed as OUTPUT; breakdown in usage.output_tokens_details.thinking_tokens.","Response: thinking block (summarised) then text; redacted_thinking may appear; blocks carry a signature and must be passed back unmodified with tool results.","Interleaved thinking (thinking between tool calls) is automatic in adaptive mode (beta header in manual mode).","Incompatible with prefill and with max_tokens:0 cache pre-warm; changing thinking config between requests misses the cache. Claude 4.6+ keeps prior-turn thinking in context (billed as input); 4.5 and earlier strip it.","Use Batches for budgets above ~32k to avoid timeouts; stream for large max_tokens."],
 c:"r = client.messages.create(model=\"claude-haiku-4-5-20251001\", max_tokens=16000,\n    thinking={\"type\":\"enabled\",\"budget_tokens\":8000},\n    messages=[{\"role\":\"user\",\"content\":\"Plan a zero-downtime Postgres major upgrade.\"}])\nfor b in r.content:\n    if b.type == \"thinking\": print(\"THINK:\", b.thinking[:200])\n    elif b.type == \"text\":  print(\"ANSWER:\", b.text)\n# On Sonnet 5 / Opus 5: thinking={\"type\":\"adaptive\"}, output_config={\"effort\":\"high\"}",
 t:["budget_tokens < 1,024 → error; budget_tokens ≥ max_tokens → error.","Thinking tokens are output tokens for billing.","Manual enabled + budget_tokens is a 400 on 4.7+ — use adaptive + effort."],
 n:"The blueprint's 'extended thinking / budget tokens' wording matches the manual mode. Expect questions framed that way; know both the manual rules (≥1024, < max_tokens, billed as output) and the modern adaptive + effort replacement."},

{id:"effort", ch:"ch3", title:"Effort parameter", u:["https://platform.claude.com/docs/en/build-with-claude/effort","https://docs.claude.com/en/docs/build-with-claude/effort"],
 f:["output_config={effort: low | medium | high | xhigh | max}; default high. Supported on Opus 4.5+, Sonnet 4.6+, Fable/Mythos; not Haiku 4.5.","Effort shapes all output — text length, number of tool calls, thinking depth; it is a behavioural signal, not a strict budget. thinking controls whether thinking happens; effort controls how much.","Lower effort → fewer/combined tool calls, terse output; xhigh for long-horizon work; max unconstrained. On Opus 5, xhigh/max require thinking enabled.","Changing top-level effort between requests invalidates the message cache; a per-message effort via a system turn (beta) preserves it. No separate pricing — cost changes only through tokens."],
 c:"r = client.messages.create(model=\"claude-sonnet-5\", max_tokens=2048,\n    output_config={\"effort\":\"low\"},\n    messages=[{\"role\":\"user\",\"content\":\"Classify: 'pod stuck in CrashLoopBackOff'\"}])",
 t:["Five levels, default high — not three.","Effort is set under output_config, not inside thinking.","Changing effort mid-conversation at the top level busts the cache."]},

{id:"contextwin", ch:"ch3", title:"Context windows", u:["https://platform.claude.com/docs/en/build-with-claude/context-windows","https://docs.claude.com/en/docs/build-with-claude/context-windows"],
 f:["1M-token window with 128K max output on the 5-series and 4.6+ Opus/Sonnet; 200K on Sonnet 4.5 and older, and Haiku 4.5. 1M is the default (no beta header, no surcharge).","Everything counts: system, all messages, tool definitions, tool results, images/documents, generated output; cached tokens still count.","Input alone > window → 400 'prompt is too long'. Input + max_tokens > window → generation stops with stop_reason 'model_context_window_exceeded' (Claude 4.5+).","Thinking: models that strip prior thinking (Opus <4.5, Sonnet <4.6, all Haiku) bill it once as output; models that keep it (Opus 4.5+, Sonnet 4.6+, 5.x) count prior thinking as input each turn — clear with context editing.","Tool-use turns must return the unmodified thinking block (signature validated).","Context awareness: Sonnet 4.5+/Haiku 4.5 receive token-budget warnings after tool calls; server-side compaction (beta, 4.6+) summarises earlier turns to continue past the limit. 'Context rot' degrades accuracy as tokens grow even below the limit.","Max 600 images/PDF pages per request (100 on 200K models)."],
 c:"resp = client.messages.count_tokens(model=\"claude-sonnet-5\", system=SYSTEM, messages=history)\nif resp.input_tokens > 150_000:\n    history = summarise_older_turns(history, keep_last=6)",
 t:["Input too long = 400; input + max_tokens too long = truncated response with model_context_window_exceeded.","Cached tokens count toward the window; caching changes billing only.","On Opus 4.5+/Sonnet 4.6+ prior thinking persists and is billed as input."]},

{id:"ctxedit", ch:"ch3", title:"Context editing (server-side clearing)", u:["https://platform.claude.com/docs/en/build-with-claude/context-editing","https://docs.claude.com/en/docs/build-with-claude/context-editing"],
 f:["Beta header context-management-2025-06-27; request param context_management={edits:[…]}; use client.beta.messages.create.","Strategy clear_tool_uses_20250919: clears old tool results (replaced by a placeholder) once context grows. Fields: trigger (default input_tokens 100,000; or tool_uses N), keep (default tool_uses 3), clear_at_least (input_tokens N), exclude_tools, clear_tool_inputs (default false).","Strategy clear_thinking_20251015: keep {thinking_turns: N} or 'all'. When combining, list clear_thinking first.","Response includes context_management.applied_edits (type, cleared_tool_uses, cleared_input_tokens). Edits are server-side; your stored history is untouched.","Clearing tool results invalidates the prompt cache from that point — use clear_at_least to make it worthwhile. Pair with the memory tool to persist critical facts before clearing; count_tokens accepts context_management to preview."],
 c:"r = client.beta.messages.create(model=\"claude-sonnet-5\", max_tokens=4096,\n    betas=[\"context-management-2025-06-27\"],\n    tools=[{\"type\":\"web_search_20250305\",\"name\":\"web_search\"}],\n    messages=history,\n    context_management={\"edits\":[{\"type\":\"clear_tool_uses_20250919\",\n        \"trigger\":{\"type\":\"input_tokens\",\"value\":30000},\n        \"keep\":{\"type\":\"tool_uses\",\"value\":3},\n        \"clear_at_least\":{\"type\":\"input_tokens\",\"value\":5000}}]})",
 t:["Default trigger 100,000 input tokens; default keep 3 tool uses.","Server-side: the client's conversation history is unchanged.","Thinking-clearing must precede tool-clearing in the edits list."]},

{id:"ctxeng", ch:"ch3", title:"Effective context engineering for AI agents (engineering blog)", u:["https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"],
 f:["Context engineering = curating the whole context state (system prompt, tools, external data, history) — a superset of prompt engineering.","Context rot: performance degrades as tokens grow; attention is a finite budget (n² pairwise); a gradient, not a cliff.","System prompt at the right altitude: not brittle if/else rules, not vague; specific heuristics in organised sections; minimal high-signal tokens.","Tools: self-contained, non-overlapping, token-efficient — 'if a human engineer can't say which tool to use, an agent can't either'.","Few-shot: diverse canonical examples, not laundry lists of edge cases.","Just-in-time context: lightweight references (paths, URLs, queries) loaded at runtime; hybrid with upfront context (Claude Code loads CLAUDE.md then greps).","Long-horizon techniques: compaction (summarise history — maximise recall first, then precision), structured note-taking (persistent notes outside context, e.g. Claude Code memory), sub-agent architectures (clean context per subagent, 1–2k-token summaries back)."],
 c:"", t:["Compaction: maximise recall first, then tune precision.","Few-shot ≠ exhaustive edge cases.","Sub-agents return condensed summaries, not transcripts."]},

/* ---------- Chapter 4: agents ---------- */
{id:"bea", ch:"ch4", title:"Building effective agents (Anthropic engineering)", u:["https://www.anthropic.com/engineering/building-effective-agents"],
 f:["Workflows = LLMs and tools orchestrated through predefined code paths. Agents = LLMs dynamically direct their own process and tool use.","Building block: the augmented LLM (LLM + retrieval + tools + memory); MCP is one way to wire in tools.","Five workflow patterns: prompt chaining (sequential steps with programmatic gates; trades latency for accuracy); routing (classify → specialised prompt/model); parallelisation — sectioning (independent subtasks) and voting (same task several times); orchestrator–workers (central LLM dynamically decomposes and delegates; for unpredictable subtasks); evaluator–optimizer (generator + feedback loop; needs clear evaluation criteria).","Autonomous agent: LLM in a loop using tools on environmental feedback ('ground truth' each step), pausing for human checkpoints; stops on completion or a stopping condition (e.g. max iterations).","Start with the simplest solution; add agentic complexity only when it demonstrably improves outcomes — agents bring higher cost and compounding errors.","Three principles: simplicity, transparency (show planning), a well-crafted agent–computer interface (thorough tool docs, tested).","Frameworks are fine to start but add abstraction that obscures prompts and responses.","Tool-design appendix: formats close to natural text; avoid formatting overhead; docstring-quality descriptions; poka-yoke arguments (e.g. require absolute paths)."],
 c:"", t:["Orchestrator–workers decides subtasks dynamically; parallelisation uses predefined splits.","Voting belongs to parallelisation, not evaluator–optimizer.","The recommendation is the simplest system that works, not the most autonomous."]},

{id:"agentsdk", ch:"ch4", title:"Claude Agent SDK overview", u:["https://code.claude.com/docs/en/agent-sdk/overview","https://docs.claude.com/en/api/agent-sdk/overview"],
 f:["Agent SDK = Claude Code as a library: same tools, agent loop and context management, in Python and TypeScript only. Other languages: run the CLI with -p and --output-format json.","Positioning: Agent SDK (runs the loop in your process) vs Claude Code CLI (interactive) vs Client SDK (raw API — you write the tool loop) vs Managed Agents (hosted; Anthropic runs the sandbox).","Capabilities: built-in tools (read/write/edit files, run commands, web search), hooks, subagents, MCP, permissions, sessions (resume/fork), skills/commands/memory from .claude/ and ~/.claude/, plugins.","Install: pip install claude-agent-sdk / npm install @anthropic-ai/claude-agent-sdk; Python 3.10+ / Node 18+; bundles the Claude Code binary.","Auth: ANTHROPIC_API_KEY in the process environment (the SDK does not load .env); CLAUDE_CODE_USE_BEDROCK / VERTEX / FOUNDRY for cloud platforms.","Branding: 'Powered by Claude' allowed; 'Claude Code' branding not permitted for third-party products."],
 c:"from claude_agent_sdk import query, ClaudeAgentOptions\nasync for message in query(\n    prompt=\"Review utils.py for bugs and report them.\",\n    options=ClaudeAgentOptions(allowed_tools=[\"Read\",\"Grep\",\"Glob\"], max_turns=10)):\n    if hasattr(message, \"result\"): print(message.result)",
 t:["Agent SDK ≠ Client SDK: with the client SDK you implement the tool loop yourself.","Python and TypeScript only.","ANTHROPIC_API_KEY must be in the environment; .env files are not auto-loaded."]},

{id:"agentsdkpy", ch:"ch4", title:"Agent SDK — Python reference", u:["https://code.claude.com/docs/en/agent-sdk/python","https://docs.claude.com/en/api/agent-sdk/python"],
 f:["query() = new session per call, single exchange, no interrupts. ClaudeSDKClient = persistent multi-turn session with interrupt(); use async with.","ClaudeAgentOptions: allowed_tools=[], disallowed_tools, permission_mode (default | acceptEdits | plan | dontAsk | bypassPermissions | auto), system_prompt, mcp_servers={}, max_turns, max_budget_usd, cwd, setting_sources (None = user+project+local; [] = none), continue_conversation, resume, fork_session, model, output_format (json_schema), hooks.","allowed_tools AUTO-APPROVES the listed tools — it does not restrict Claude to them; use disallowed_tools to remove tools.","can_use_tool callback fires only when permission evaluation falls through to a prompt; to intercept every call use a PreToolUse hook.","Precedence: managed policy > programmatic options > local > project > user settings.","Custom in-process tools: @tool(name, description, input_schema) + create_sdk_mcp_server(name, tools=[…]) passed via mcp_servers.","Message types: AssistantMessage, UserMessage, ResultMessage (subtype, session_id, total_cost_usd), SystemMessage, StreamEvent; blocks TextBlock/ThinkingBlock/ToolUseBlock/ToolResultBlock."],
 c:"from claude_agent_sdk import ClaudeSDKClient, ClaudeAgentOptions, ResultMessage\nopts = ClaudeAgentOptions(permission_mode=\"acceptEdits\", max_turns=5, max_budget_usd=1.0)\nasync with ClaudeSDKClient(options=opts) as client:\n    await client.query(\"Add input validation to api/handlers.py\")\n    async for m in client.receive_response():\n        if isinstance(m, ResultMessage): print(m.subtype, m.total_cost_usd)",
 t:["allowed_tools=['Bash'] does not block other tools — it only pre-approves Bash.","can_use_tool is skipped for auto-approved tools; PreToolUse hooks are not.","query() cannot be interrupted; only ClaudeSDKClient supports interrupt()."]},

{id:"sdksubagents", ch:"ch4", title:"Agent SDK — subagents", u:["https://code.claude.com/docs/en/agent-sdk/subagents","https://docs.claude.com/en/api/agent-sdk/subagents"],
 f:["Define via the agents={…} option (recommended), .claude/agents/*.md files, or the built-in general-purpose agent. Programmatic definitions override same-named files.","AgentDefinition: description and prompt required; optional tools (omit = inherit), disallowedTools, model (opus | sonnet | haiku | fable | inherit | full ID), skills, memory, mcpServers, maxTurns, background, effort, permissionMode.","Invoked through the Agent tool; include 'Agent' in allowed_tools to auto-approve delegation.","Context isolation: a subagent starts fresh — its own prompt, project CLAUDE.md and tool definitions; NOT the parent's history or system prompt. Only the final message returns to the parent (marked with parent_tool_use_id).","Subagents run in the background by default and can nest: default max depth 3 (CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH), max concurrent 20.","Completed subagents can be resumed by agentId with the same definitions; built-in Explore/Plan are one-shot.","Subagent output is scanned to neutralise system-reminder-style tags and fake turn markers."],
 c:"from claude_agent_sdk import AgentDefinition\nopts = ClaudeAgentOptions(\n    allowed_tools=[\"Read\",\"Grep\",\"Glob\",\"Agent\"],\n    agents={\"reviewer\": AgentDefinition(\n        description=\"Strict code reviewer. Use after any change under src/.\",\n        prompt=\"Review for error handling and security. Report file:line. Never edit.\",\n        tools=[\"Read\",\"Grep\",\"Glob\"], model=\"sonnet\")})",
 t:["Subagents do NOT inherit the parent's conversation or system prompt.","Programmatic definition beats a same-named .claude/agents file.","Default spawn depth 3, concurrency 20."]},

{id:"sessions", ch:"ch4", title:"Agent SDK — sessions (continue, resume, fork)", u:["https://code.claude.com/docs/en/agent-sdk/sessions","https://docs.claude.com/en/api/agent-sdk/sessions"],
 f:["A session = conversation history persisted to disk automatically; it persists the conversation, not the filesystem (use file checkpointing for that).","continue_conversation=True → most recent session in the cwd, no ID. resume=<id> → a specific session. resume + fork_session=True → new session ID with a copy of history; the original is unchanged.","Session ID comes on ResultMessage.session_id (present even on error results).","Storage: ~/.claude/projects/<encoded-cwd>/<session-id>.jsonl; CLAUDE_CONFIG_DIR overrides. Cross-host resume needs a session store adapter or moving the file.","Resume after error_max_turns / error_max_budget_usd with higher limits. Helpers: list_sessions(), get_session_messages(), rename_session(), tag_session()."],
 c:"async for m in query(prompt=\"Now outline OAuth2 instead\",\n        options=ClaudeAgentOptions(resume=session_id, fork_session=True)):\n    if isinstance(m, ResultMessage): forked_id = m.session_id",
 t:["Forking branches history, not files — a fork's edits are real on disk.","continue needs no ID but only finds the most recent session in that cwd.","Session IDs are on ResultMessage even when the run errored."]},

{id:"writingtools", ch:"ch4", title:"Writing effective tools for agents (engineering blog)", u:["https://www.anthropic.com/engineering/writing-tools-for-agents"],
 f:["Tools are a contract between deterministic systems and non-deterministic agents.","Workflow: prototype → wrap in a local MCP server → realistic multi-step evals → agentic loop evals → read transcripts → let Claude analyse transcripts and rewrite tool descriptions.","More tools don't mean better outcomes: consolidate multi-step flows (schedule_event instead of list_users + list_events + create_event); prefer search over list.","Namespace names by service/resource (asana_projects_search). Return semantic context (names over UUIDs); offer a response_format enum (detailed / concise) — concise cut ~⅔ of tokens in the example.","Token efficiency: pagination, filtering, truncation with sensible defaults; actionable error messages instead of opaque codes.","Descriptions are prompt engineering: state query formats, terminology, relationships; unambiguous parameter names (user_id, not user)."],
 c:"", t:["Wrapping every API endpoint as a tool is discouraged — target high-impact workflows.","Prefer semantic identifiers (names) in responses over technical IDs.","user_id beats user — parameter naming changes accuracy."]},

{id:"websearch", ch:"ch4", title:"Web search tool (server tool)", u:["https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool","https://docs.claude.com/en/docs/agents-and-tools/tool-use/web-search-tool","https://docs.claude.com/en/docs/agents-and-tools/tool-use/web-fetch-tool"],
 f:["Tool name web_search; type web_search_20250305 (newer types add dynamic filtering and response_inclusion). Must be enabled by an org admin in the Console, else 400.","Params: max_uses; allowed_domains / blocked_domains — mutually exclusive (400 if both); user_location {type:'approximate', city, region, country, timezone}.","Response: server_tool_use (srvtoolu_…) → web_search_tool_result with web_search_result items (url, title, encrypted_content, page_age); citations via web_search_result_location. encrypted_content must be passed back unchanged in multi-turn.","Errors: too_many_requests, invalid_tool_input, max_uses_exceeded, query_too_long, request_too_large, unavailable.","Pricing $10 per 1,000 searches plus tokens; failed searches aren't billed; usage.server_tool_use.web_search_requests. May return stop_reason pause_turn on long searches — send the response back to continue.","Supports streaming, caching, Batches; Claude 4.6+ on the Claude API, Vertex and Foundry (not Bedrock). Web fetch is a companion server tool (web_fetch) that retrieves a URL's content."],
 c:"r = client.messages.create(model=\"claude-sonnet-5\", max_tokens=2048,\n    tools=[{\"type\":\"web_search_20250305\",\"name\":\"web_search\",\"max_uses\":3,\n            \"blocked_domains\":[\"untrusted.example\"]}],\n    messages=[{\"role\":\"user\",\"content\":\"Latest Kubernetes CVE this month? Cite sources.\"}])",
 t:["allowed_domains and blocked_domains cannot be combined.","pause_turn means 'send it back to continue', not an error.","Each search counts as one use regardless of result count."]},

{id:"codeexec", ch:"ch4", title:"Code execution tool (server tool)", u:["https://platform.claude.com/docs/en/agents-and-tools/tool-use/code-execution-tool","https://docs.claude.com/en/docs/agents-and-tools/tool-use/code-execution-tool"],
 f:["name code_execution; types code_execution_20250825 / 20260120 (REPL state, programmatic tool calling). No beta header needed now.","Sandbox: Python 3.11, Linux, 1 CPU, 5 GiB RAM, 5 GiB disk, NO internet; 90 s per REPL cell. Pre-installed: pandas, numpy, scipy, scikit-learn, matplotlib, openpyxl, python-docx, python-pptx, pypdf, reportlab…","Container: response.container.id; reuse via top-level container=; expires 30 days after creation.","Files in via the Files API (container_upload); outputs written to $OUTPUT_DIR come back as file_ids (downloadable).","Pricing: free with web search/fetch; otherwise 1,550 free container-hours per org per month, then $0.05/hour (5-minute minimum). Haiku 4.5: no REPL persistence."],
 c:"r = client.messages.create(model=\"claude-sonnet-5\", max_tokens=4096,\n    tools=[{\"type\":\"code_execution_20250825\",\"name\":\"code_execution\"}],\n    messages=[{\"role\":\"user\",\"content\":\"Compute mean and p95 of these latencies: 120, 340, 90, 1500, 210\"}])\nr2 = client.messages.create(container=r.container.id, ...)   # reuse state",
 t:["No internet in the sandbox — pip install at runtime fails.","Only files at the top level of $OUTPUT_DIR are returned.","Container hard expiry is 30 days."]},

{id:"skills", ch:"ch4", title:"Agent Skills overview", u:["https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview","https://docs.claude.com/en/docs/agents-and-tools/agent-skills/overview"],
 f:["A Skill = a folder with SKILL.md (YAML frontmatter + instructions) plus optional scripts/resources.","Frontmatter: name (≤64 chars, lowercase/digits/hyphens, no 'anthropic'/'claude') and description (≤1,024 chars; must say what it does AND when to use it) — both required.","Progressive disclosure: L1 metadata always loaded (~100 tokens per skill); L2 SKILL.md body on trigger (<5k tokens recommended); L3 bundled files only when accessed.","Surfaces: Claude API (pre-built pptx/xlsx/docx/pdf + custom via /v1/skills; REQUIRES the code execution tool), Claude Code (custom only, ~/.claude/skills/ or .claude/skills/), claude.ai (per-user).","API: container={skills:[{type:'anthropic', skill_id:'pptx', version:'latest'}]}; max 20 skills per request; upload ≤30 MB; Skills API endpoints under /v1/skills.","Sandbox has no network and no runtime package install. Treat third-party skills like installing software."],
 c:"r = client.messages.create(model=\"claude-sonnet-5\", max_tokens=4096,\n    container={\"skills\":[{\"type\":\"anthropic\",\"skill_id\":\"xlsx\",\"version\":\"latest\"}]},\n    tools=[{\"type\":\"code_execution_20250825\",\"name\":\"code_execution\"}],\n    messages=[{\"role\":\"user\",\"content\":\"Build a workbook of last quarter's incident counts by service.\"}])",
 t:["Skills in the API need the code execution tool in tools, or they won't run.","The description must say WHEN to use the skill — that is the trigger.","Pre-built document skills are not in Claude Code; only custom skills are."]},
/* ---------- Chapter 5: MCP ---------- */
{id:"mcparch", ch:"ch5", title:"MCP architecture (protocol 2026-07-28)", u:["https://modelcontextprotocol.io/docs/learn/architecture","https://modelcontextprotocol.io/introduction","https://modelcontextprotocol.io"],
 f:["Participants: Host (the AI app, e.g. Claude Code/Desktop) creates one Client per Server; each client keeps a dedicated 1:1 connection.","Two layers: data layer (JSON-RPC 2.0 — discovery, primitives, notifications) and transport layer: stdio for local child processes; Streamable HTTP (HTTP POST + optional SSE streaming; bearer/API-key/custom headers; OAuth recommended) for remote servers. The old HTTP+SSE transport is deprecated.","Protocol revision 2026-07-28 made MCP stateless: every request carries _meta fields (protocolVersion, clientCapabilities, clientInfo) and a mandatory server/discover request replaces the old initialize handshake, returning supportedVersions, capabilities, ttlMs, cacheScope. Older revisions (2025-06-18) used initialize + Mcp-Session-Id.","Server primitives: tools, resources, prompts (methods tools/list, tools/call, resources/list, resources/read, prompts/list, prompts/get). Client primitives: elicitation (elicitation/create); sampling and logging are deprecated as of 2026-07-28; roots remain.","Notifications are opt-in via subscriptions/listen (e.g. toolsListChanged) and are best-effort with no id.","Local stdio servers usually serve one client; remote servers serve many."],
 c:"{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\n \"params\":{\"name\":\"recent_commits\",\"arguments\":{\"n\":5},\n   \"_meta\":{\"io.modelcontextprotocol/protocolVersion\":\"2026-07-28\"}}}",
 t:["One client per server, not one client for all servers.","stdio = local only; remote = Streamable HTTP.","Exam wording may still say 'initialize handshake negotiates version and capabilities' — that was true up to 2025 revisions; the concept (version + capability negotiation at connection start) still holds."],
 n:"The exam blueprint was written against the 2025 protocol: initialize handshake, sampling as a client feature, Mcp-Session-Id. Know both: answer 'initialize negotiates protocol version and capabilities' if asked, and know that the 2026-07-28 revision replaced it with stateless server/discover."},

{id:"mcpserver", ch:"ch5", title:"MCP server concepts (tools, resources, prompts)", u:["https://modelcontextprotocol.io/docs/learn/server-concepts"],
 f:["Three server features and who controls them: Tools → the model; Resources → the application; Prompts → the user.","Tools: JSON Schema inputSchema; tools/list, tools/call; may require user consent; hosts show approval dialogs, pre-approval settings, activity logs.","Resources: unique URI (file:///…, calendar://events/2024) + mimeType; direct resources vs resource templates (travel://activities/{city}/{category}); resources/list, resources/templates/list, resources/read, resources/subscribe; parameter completion supported.","Prompts: parameterised templates with arguments (name, type, required, description); prompts/list, prompts/get; surfaced as slash commands, palettes, buttons.","The application decides how to use resources (embed, subset, raw). Multi-server pattern: a prompt guides the model to combine resources from one server with tools from another."],
 c:"from mcp.server.fastmcp import FastMCP\nmcp = FastMCP(\"devproject\")\n\n@mcp.tool()\ndef recent_commits(n: int = 5) -> str:\n    \"\"\"Return the last n git commits (1–50). Output is untrusted text.\"\"\"\n    import subprocess; n = max(1, min(int(n), 50))\n    return subprocess.check_output([\"git\",\"log\",f\"-{n}\",\"--oneline\"], text=True)\n\n@mcp.resource(\"repo://readme\")\ndef readme() -> str: return open(\"README.md\").read()\n\n@mcp.prompt()\ndef review_pr(pr: str) -> str: return f\"Review PR {pr} for error handling. Be terse.\"\n\nif __name__ == \"__main__\": mcp.run()   # stdio; transport=\"streamable-http\" for remote",
 t:["Resources are application-controlled, not model-invoked.","Prompts are user-controlled — never auto-triggered.","resources/templates/list is separate from resources/list."]},

{id:"mcpclient", ch:"ch5", title:"MCP client concepts (elicitation, roots, sampling)", u:["https://modelcontextprotocol.io/docs/learn/client-concepts"],
 f:["Host = the app; client = protocol component, one per server connection.","Elicitation: server sends elicitation/create with message + requestedSchema (primitives/enums); user can provide, decline or cancel; must never be used for passwords or API keys.","Roots: {uri:'file:///…', name}; always file:// scheme; roots/list and roots/list_changed; ADVISORY, not a security boundary — servers 'SHOULD respect', not 'MUST enforce'.","Sampling: sampling/createMessage lets a server request an LLM completion from the client with modelPreferences (cost/speed/intelligence priorities) and human-in-the-loop on both sides. Deprecated in the 2026-07-28 revision."],
 c:"{\"method\":\"elicitation/create\",\"params\":{\"message\":\"Confirm booking:\",\n  \"requestedSchema\":{\"type\":\"object\",\"properties\":{\n    \"confirmBooking\":{\"type\":\"boolean\"},\n    \"seatPreference\":{\"type\":\"string\",\"enum\":[\"window\",\"aisle\"]}},\n    \"required\":[\"confirmBooking\"]}}}",
 t:["Roots don't enforce access — OS permissions and sandboxing do.","Sampling = the server asks the client's LLM, not the reverse.","Elicitation is for structured user input, never credentials."]},

{id:"mcpconnector", ch:"ch5", title:"MCP connector (Messages API)", u:["https://platform.claude.com/docs/en/agents-and-tools/mcp-connector","https://docs.claude.com/en/docs/agents-and-tools/mcp-connector","https://docs.claude.com/en/docs/agents-and-tools/remote-mcp-servers"],
 f:["Beta header mcp-client-2025-11-20. mcp_servers[]: type 'url' only, url (https://), name (unique), authorization_token (optional OAuth bearer — you obtain and refresh it).","Tool selection via the tools array: {type:'mcp_toolset', mcp_server_name, default_config, configs}. Every server must be referenced by exactly one toolset.","Transports: Streamable HTTP and SSE; local stdio is NOT supported. Tools only — no resources or prompts.","Response blocks: mcp_tool_use (id mcptoolu_…, name, server_name, input) and mcp_tool_result (tool_use_id, is_error, content). The API executes the calls — you run nothing.","Available on the Claude API, AWS (beta), Foundry (beta); not ZDR-eligible; several servers per request allowed."],
 c:"r = client.beta.messages.create(model=\"claude-sonnet-5\", max_tokens=1000,\n    betas=[\"mcp-client-2025-11-20\"],\n    mcp_servers=[{\"type\":\"url\",\"url\":\"https://mcp.example.com/mcp\",\"name\":\"tickets\",\n                  \"authorization_token\":TOKEN}],\n    tools=[{\"type\":\"mcp_toolset\",\"mcp_server_name\":\"tickets\"}],\n    messages=[{\"role\":\"user\",\"content\":\"List my open tickets\"}])",
 t:["Only remote HTTPS servers — localhost/stdio cannot be used.","Tools only; resources and prompts are unavailable through the connector.","Token refresh is the caller's job, not the API's."]},

{id:"mcpsecurity", ch:"ch5", title:"MCP security best practices", u:["https://modelcontextprotocol.io/specification/draft/basic/security_best_practices"],
 f:["Confused deputy: an MCP proxy with a static third-party client ID + dynamic client registration + a consent cookie lets an attacker skip consent. Proxies MUST obtain per-client consent before forwarding; exact-string redirect_uri matching; random single-use short-lived state.","Token passthrough is forbidden: servers MUST NOT accept tokens not issued for them (audience validation).","SSRF: require HTTPS for OAuth metadata, block private IP ranges, validate redirects, use egress proxies.","State-handle hijacking: servers MUST NOT treat possession of a session/state handle as authentication; bind handles to the verified user id.","Local server compromise: one-click installs MUST show the full command and require explicit approval; sandbox; prefer stdio for local servers.","OAuth URL validation: only http(s); reject javascript:, data:, file:; never open URLs via a shell. Scope minimisation: start minimal, step up via WWW-Authenticate.","Application-level threats to remember: tool poisoning (malicious tool descriptions), rug pulls (server changes after approval), prompt injection via tool results."],
 c:"", t:["Token passthrough is a MUST NOT, not merely discouraged.","Session/state IDs must never serve as authentication.","Tool poisoning = malicious metadata; rug pull = server changes after approval."]},

{id:"ccmcp", ch:"ch5", title:"Claude Code — connect to tools via MCP", u:["https://code.claude.com/docs/en/mcp","https://docs.claude.com/en/docs/claude-code/mcp"],
 f:["claude mcp add --transport http|sse|stdio <name> <url | -- cmd args>; SSE deprecated in favour of HTTP; '--' separator required before stdio args; --env KEY=VAL; --header 'Authorization: Bearer …'; --scope local|project|user.","Scopes and precedence: local (default; ~/.claude.json per project) > project (.mcp.json, committed/shareable; needs workspace trust) > user (~/.claude.json, all projects) > plugin > claude.ai connectors. Same name at several scopes → only the highest loads.",".mcp.json: {mcpServers:{name:{type:'http', url, headers, timeout}}}; env expansion ${VAR} and ${VAR:-default} in command, args, env, url, headers — never commit secrets.","Management: claude mcp list | get | remove | login | logout | add-json | add-from-claude-desktop | reset-project-choices; in-session /mcp for auth, reconnect, status.","Naming: tools mcp__<server>__<tool>; resources referenced with @server:resource-uri; server prompts as slash commands /mcp__server__prompt.","MAX_MCP_OUTPUT_TOKENS default 25,000 (warning at 10,000); MCP_TIMEOUT (HTTP/SSE only), MCP_TOOL_TIMEOUT; reconnect with backoff up to 5 attempts (stdio not auto-reconnected).","claude mcp serve exposes Claude Code itself as an MCP server. Enterprise: managed-mcp.json / ANTHROPIC_MANAGED_MCP_URL."],
 c:"claude mcp add devproject --scope project -- python mcp_server/server.py\nclaude mcp add --transport http jira https://mcp.example.com/jira --header \"Authorization: Bearer $TOKEN\"\nclaude mcp list        # then /mcp inside a session to log in / check status",
 t:["Default scope is local (not user or project).","Project scope .mcp.json is the one you commit for the team.","Tool names use double underscores: mcp__server__tool."]},

/* ---------- Chapter 6: Claude Code ---------- */
{id:"ccmemory", ch:"ch6", title:"Claude Code — memory (CLAUDE.md, rules, auto memory)", u:["https://code.claude.com/docs/en/memory","https://docs.claude.com/en/docs/claude-code/memory"],
 f:["Two memory systems: CLAUDE.md (you write) and auto memory (Claude writes). Both are context/guidance, not enforcement — use a PreToolUse hook to hard-block.","Load order: managed policy CLAUDE.md (OS-level path) → user ~/.claude/CLAUDE.md → project ./CLAUDE.md or ./.claude/CLAUDE.md → local ./CLAUDE.local.md (git-ignore it). Files in the cwd and every ancestor load at launch (closer files read last); subdirectory CLAUDE.md loads on demand when Claude reads files there.","Imports: @path/to/file (relative or absolute), max depth 4 hops; imports inside code fences are ignored; imports outside the working directory prompt once.","Size: target under 200 lines; a CLAUDE.md over 4 MiB is skipped. HTML comments are stripped.",".claude/rules/*.md: rules without paths: frontmatter load at launch; with paths: globs they load only when Claude touches matching files — this is what actually saves context (imports do not).","Auto memory: on by default (autoMemoryEnabled:false or CLAUDE_CODE_DISABLE_AUTO_MEMORY=1 to disable); stored under ~/.claude/projects/<project>/memory/ with MEMORY.md index; only the first 200 lines / 25 KB of MEMORY.md loads; not loaded into subagents (except forks).","/init generates CLAUDE.md; /memory edits memory files; /context shows what actually loaded. Claude reads CLAUDE.md, not AGENTS.md (import it with @AGENTS.md). Project-root CLAUDE.md survives /compact."],
 c:"---\npaths:\n  - \"src/api/**/*.ts\"\n---\n# API rules\n- All endpoints must validate input with zod\n- Never log request bodies",
 t:["Import depth is 4 hops; @README inside backticks does not import.","Managed CLAUDE.md cannot be excluded by claudeMdExcludes.","Splitting into @imports does not save context; path-scoped .claude/rules/ does."]},

{id:"ccsettings", ch:"ch6", title:"Claude Code — settings and precedence", u:["https://code.claude.com/docs/en/settings","https://docs.claude.com/en/docs/claude-code/settings"],
 f:["Files: user ~/.claude/settings.json; shared project .claude/settings.json; project local .claude/settings.local.json (auto-gitignored); managed managed-settings.json (OS-level path / MDM / console). ~/.claude.json holds global config, sign-in, MCP servers, trust decisions.","Precedence, highest first: 1 Managed → 2 Command line (--settings, flags) → 3 Project local → 4 Shared project → 5 User.","List keys (e.g. permissions.allow) MERGE across files; a few keys take the whole value from the highest layer (fallbackModel, availableModels).","Env vars are not a layer: ANTHROPIC_MODEL overrides model from any file; --model overrides everything.","permissions.defaultMode values auto and bypassPermissions are ignored from project/local settings (user/managed only).","Committed permissions.allow, additionalDirectories and most env values wait for workspace trust; deny/ask apply immediately. A local allow does not outrank a project/managed ask.","Strict JSON (no comments); '$schema': https://json.schemastore.org/claude-code-settings.json. Permissions and hooks hot-reload; model/effort are read at start (use /model, /effort). 'Yes, don't ask again' writes an allow rule to .claude/settings.local.json."],
 c:"{\n  \"$schema\": \"https://json.schemastore.org/claude-code-settings.json\",\n  \"permissions\": {\n    \"allow\": [\"Bash(npm run lint)\", \"Bash(npm run test *)\"],\n    \"deny\":  [\"Read(./.env)\", \"Read(./.env.*)\", \"Bash(terraform destroy *)\"]\n  }\n}",
 t:["--settings on the command line beats project/local/user files but never managed.","settings.local.json outranks the committed settings.json, but list keys merge rather than replace.","bypassPermissions as defaultMode in .claude/settings.json is silently ignored."]},

{id:"ccskills", ch:"ch6", title:"Claude Code — skills and slash commands", u:["https://code.claude.com/docs/en/skills","https://code.claude.com/docs/en/commands","https://docs.claude.com/en/docs/claude-code/slash-commands","https://docs.claude.com/en/docs/claude-code/skills"],
 f:["Custom slash commands (.claude/commands/<name>.md, invoked as /name) still work but are legacy; skills (.claude/skills/<name>/SKILL.md) are the recommended form and WIN on a name collision.","Skill = YAML frontmatter + Markdown body. Frontmatter: description (+ when_to_use), argument-hint, allowed-tools, disallowed-tools, model, effort, context: fork, agent, background, paths, disable-model-invocation, user-invocable.","Invocation control: default = you or Claude can invoke; disable-model-invocation:true = only you (description hidden from Claude); user-invocable:false = only Claude (hidden from the / menu).","Arguments: $ARGUMENTS (all), $0 / $1 positional (0-based), named via arguments: frontmatter. Shell injection with !`cmd` runs before Claude sees the content (needs allowed-tools; 2-min timeout).","Locations/precedence: Enterprise > Personal ~/.claude/skills > Project .claude/skills > Plugin > bundled. context: fork runs the skill in an isolated subagent; paths: auto-loads only for matching files.","allowed-tools in a skill is a one-turn grant, not a persistent rule. Compaction keeps the most recent skills (≈5k tokens each, 25k combined).","Built-in commands: /clear (/reset, /new), /compact [instructions], /config, /context, /usage (alias /cost), /init, /memory, /model, /effort, /permissions, /status, /rewind, /resume, /agents, /hooks, /mcp, /plugin, /export, /add-dir, /plan, /code-review (/review), /security-review, /install-github-app, /tasks, /fork. MCP prompts appear as /mcp__server__prompt."],
 c:"---\ndescription: Run the test suite and summarise failures. Use after code changes.\nargument-hint: [test-path]\nallowed-tools: Bash(pytest *)\n---\nTest output: !`pytest $0 -q 2>&1 | tail -40`\nSummarise failures with file:line and the likely cause.",
 t:["Positional args are 0-based ($0 is the first).",".claude/commands/ is legacy; if a skill and a command share a name, the skill wins.","/cost is now an alias of /usage; /review is an alias of /code-review."],
 n:"The blueprint lists 'Rules, Skills, Commands, Agents, Agent Memory' as separate components — answer with that taxonomy (command = user-invoked prompt; skill = model-invoked know-how) even though the docs have merged the implementations."},

{id:"cchooks", ch:"ch6", title:"Claude Code — hooks reference", u:["https://code.claude.com/docs/en/hooks","https://docs.claude.com/en/docs/claude-code/hooks","https://docs.claude.com/en/docs/claude-code/hooks-guide"],
 f:["Events (selection): SessionStart, SessionEnd, UserPromptSubmit, PreToolUse, PostToolUse, PostToolUseFailure, PermissionRequest, Stop, SubagentStart, SubagentStop, PreCompact, PostCompact, Notification, ConfigChange, FileChanged…","Handler types: command (JSON on stdin → stdout), http (POST), mcp_tool, prompt (single-turn model evaluation), agent.","Structure: hooks.<Event>[] = {matcher, hooks:[{type, command, timeout, async, if}]}. Matchers: exact tool names, A|B alternatives, regex (e.g. mcp__memory__.*), * or omitted = all. if uses permission-rule syntax such as Bash(rm *).","Timeouts: default 600 s for command/http/mcp_tool, 30 s prompt; on timeout PreToolUse does NOT block.","Exit codes: 0 = proceed (stdout parsed as JSON if it starts with '{'); 2 = BLOCK (stderr shown to Claude as the reason; PreToolUse blocks the tool, UserPromptSubmit rejects the prompt); any other code = non-blocking error, action proceeds.","Stdin JSON: session_id, cwd, permission_mode, hook_event_name, tool_name, tool_input, tool_use_id… JSON output can set continue, stopReason, systemMessage, additionalContext, hookSpecificOutput.permissionDecision allow|deny|ask, updatedInput.","Where: user/project/local settings, managed settings, plugin hooks/hooks.json, skill/subagent frontmatter. Project/local hooks wait for workspace trust; disableAllHooks:true does not disable managed hooks; /hooks is a read-only viewer."],
 c:"{\n  \"hooks\": {\n    \"PostToolUse\": [{\"matcher\": \"Edit|Write\",\n      \"hooks\": [{\"type\":\"command\",\"command\":\"jq -r .tool_input.file_path | xargs ruff format\"}]}],\n    \"PreToolUse\": [{\"matcher\": \"Bash\",\n      \"hooks\": [{\"type\":\"command\",\"if\":\"Bash(terraform destroy *)\",\n                 \"command\":\"echo 'blocked: destroy needs a human' >&2; exit 2\"}]}]\n  }\n}",
 t:["Exit 2 blocks; exit 1 does not (non-blocking error, action proceeds).","Default command-hook timeout is 600 s, not 60.","disableAllHooks cannot disable managed-settings hooks."]},

{id:"ccperms", ch:"ch6", title:"Claude Code — permissions, modes and authentication", u:["https://code.claude.com/docs/en/permissions","https://code.claude.com/docs/en/iam","https://docs.claude.com/en/docs/claude-code/iam","https://docs.claude.com/en/docs/claude-code/security"],
 f:["Rule evaluation: deny → ask → allow, first match wins; a broad deny beats a narrow allow (deny rules can't carry exceptions).","Modes: default (manual: reads free, asks before edits/commands), acceptEdits, plan (read-only, proposes), auto (classifier decides), dontAsk, bypassPermissions (--dangerously-skip-permissions; sandboxes only; can be disabled by admins).","Bash rules: Bash(npm run *) matches 'npm run …'; Bash(ls *) excludes lsof; compound commands (&&, ||, ;, |) are split and each part must match; wrappers like timeout/nice are stripped; suspicious commands prompt even if allow-listed.","File rules use gitignore syntax: Read(./.env), //absolute, ~/home; a Read deny also blocks Edit/Write on that path. WebFetch(domain:host); mcp__server = all tools on it; mcp__server__tool = one; Agent(Explore).","Committed project allow rules and additionalDirectories wait for workspace trust; deny/ask apply immediately. Trust verification is skipped in -p mode.","Credential precedence: cloud provider env (CLAUDE_CODE_USE_BEDROCK|VERTEX|FOUNDRY) → ANTHROPIC_AUTH_TOKEN → ANTHROPIC_API_KEY → apiKeyHelper (re-run every 5 min) → CLAUDE_CODE_OAUTH_TOKEN (claude setup-token, one-year, for CI) → profile/WIF → /login OAuth. Stored in macOS Keychain or ~/.claude/.credentials.json (0600).","Security posture: writes only under the start folder; network commands (curl, wget) not auto-approved; web-fetched content is processed in an isolated context (injection mitigation); MCP servers are not audited by Anthropic; report vulnerabilities via HackerOne."],
 c:"{\n  \"permissions\": {\n    \"allow\": [\"Bash(npm run *)\", \"Bash(git commit *)\", \"WebFetch(domain:github.com)\"],\n    \"ask\":   [\"Bash(git clean *)\"],\n    \"deny\":  [\"Bash(git push *)\", \"Read(./.env)\", \"Bash(curl *)\"],\n    \"disableBypassPermissionsMode\": \"disable\"\n  }\n}",
 t:["ANTHROPIC_API_KEY outranks a /login subscription once approved; ANTHROPIC_AUTH_TOKEN outranks the API key.","deny Bash(aws *) blocks Bash(aws s3 ls) even if that is allowed.","Trust verification and prompts are skipped in -p (headless) mode — restrict tools explicitly there."]},

{id:"ccsubagents", ch:"ch6", title:"Claude Code — subagents", u:["https://code.claude.com/docs/en/sub-agents","https://docs.claude.com/en/docs/claude-code/sub-agents"],
